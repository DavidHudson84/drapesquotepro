<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Partner Portal — Dr Drapes</title>
<link rel="icon" type="image/svg+xml" href="brand/drapr-favicon.svg" />
<style>
  /* The Dr Drapes palette, as on the quote PDF and the customer accept page:
     partners are quoting under our name, so their screen looks like our
     paperwork, not like the staff app. */
  :root {
    --navy: #323264; --navy-deep: #26264e; --pink: #C81B55;
    --ink: #2a2a3a; --muted: #6e6e78; --line: #dde0ea;
    --card: #ffffff; --bg: #f4f5fa; --ok: #1E7A4B; --warn: #B4740E; --bad: #B3261E;
    --tint: #eef0f8;
    --r: 12px; --r-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Open Sans', sans-serif; background: var(--bg); color: var(--ink); line-height: 1.45; font-size: 15px; }
  .hidden { display: none !important; }
  a { color: var(--navy); }

  /* ---------- top bar ---------- */
  .top { background: var(--navy); color: #fff; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; position: sticky; top: 0; z-index: 20; }
  .top .brand { display: flex; align-items: center; gap: 10px; min-width: 0; cursor: pointer; }
  .top .brand b { font-size: 16px; white-space: nowrap; }
  .top .brand span { font-size: 12px; color: rgba(255,255,255,.7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top .who { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .top .who .nm { color: rgba(255,255,255,.8); }
  .top button { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.25); border-radius: 6px; padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  @media (max-width: 560px) { .top .who .nm, .top .brand span { display: none; } }

  .wrap { max-width: 920px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border-radius: var(--r); box-shadow: 0 2px 14px rgba(50,50,100,.07); padding: 20px; margin-bottom: 14px; }
  @media (max-width: 480px) { .wrap { padding: 10px; } .card { padding: 15px; } }
  h1 { font-size: 21px; color: var(--navy); margin-bottom: 4px; }
  h2 { font-size: 16px; color: var(--navy); margin-bottom: 10px; }
  h3 { font-size: 14px; color: var(--navy); margin: 14px 0 8px; }
  .sub { color: var(--muted); font-size: 13.5px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .spread { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 600px) { .grid2 { grid-template-columns: 1fr; } }

  /* ---------- forms ---------- */
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12.5px; font-weight: 700; color: var(--navy); margin-bottom: 4px; }
  .field .hint { font-size: 12px; color: var(--muted); margin-top: 3px; }
  input[type=text], input[type=email], input[type=tel], input[type=password], input[type=number], input[type=date], select, textarea {
    width: 100%; padding: 10px 11px; border: 1.5px solid var(--line); border-radius: var(--r-sm); font: inherit; font-size: 15px; background: #fff; color: var(--ink);
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--navy); }
  textarea { resize: vertical; min-height: 70px; }
  .choice { display: flex; gap: 8px; flex-wrap: wrap; }
  .choice label { flex: 1 1 200px; display: flex; gap: 9px; align-items: flex-start; border: 1.5px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; cursor: pointer; font-size: 14px; background: #fff; }
  .choice label small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .choice input { margin-top: 3px; accent-color: var(--navy); }
  .choice label.on { border-color: var(--navy); background: var(--tint); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 16px; border-radius: var(--r-sm); border: none; font: inherit; font-size: 14.5px; font-weight: 700; cursor: pointer; text-decoration: none; white-space: nowrap; }
  .btn-primary { background: var(--pink); color: #fff; }
  .btn-primary:hover { background: #a8164a; }
  .btn-navy { background: var(--navy); color: #fff; }
  .btn-ok { background: var(--ok); color: #fff; }
  .btn-ghost { background: #fff; color: var(--navy); border: 1.5px solid var(--line); }
  .btn-ghost:hover { border-color: var(--navy); }
  .btn-sm { padding: 7px 11px; font-size: 13px; }
  .btn-link { background: none; border: none; color: var(--muted); text-decoration: underline; cursor: pointer; font: inherit; font-size: 13.5px; padding: 4px; }
  .btn-x { background: none; border: none; color: var(--muted); font-size: 20px; line-height: 1; cursor: pointer; padding: 4px 8px; }
  .btn[disabled] { opacity: .55; cursor: default; }
  .full { width: 100%; }

  .msg { border-radius: var(--r-sm); padding: 10px 12px; font-size: 14px; margin-bottom: 12px; }
  .msg.err { background: #fdecec; color: var(--bad); }
  .msg.ok { background: #e8f4ee; color: var(--ok); }
  .msg.info { background: var(--tint); color: var(--navy); }

  /* ---------- sign-in ---------- */
  .auth { max-width: 400px; margin: 40px auto; }
  .auth .logo { display: block; max-width: 200px; margin: 0 auto 18px; }

  /* ---------- job list ---------- */
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .tabs button { border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; color: var(--ink); }
  .tabs button.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  .jobrow { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-sm); margin-bottom: 8px; background: #fff; cursor: pointer; }
  .jobrow:hover { border-color: var(--navy); }
  .jobrow .t { font-weight: 700; }
  .jobrow .d { font-size: 13px; color: var(--muted); }
  .jobrow .amt { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  .jobrow .com { text-align: right; font-size: 12.5px; color: var(--ok); }
  .pill { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--tint); color: var(--navy); vertical-align: middle; }
  .pill.quoted { background: #fff4e0; color: var(--warn); }
  .pill.confirmed, .pill.in_progress { background: #e6f0fb; color: #1d5fa8; }
  .pill.complete { background: #eaf5ef; color: var(--ok); }
  .pill.invoiced, .pill.rehung { background: #eef0f3; color: #444; }
  .pill.declined { background: #fdecec; color: var(--bad); }
  .empty { text-align: center; padding: 30px 10px; color: var(--muted); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .stat { background: #fff; border-radius: var(--r-sm); padding: 12px; box-shadow: 0 1px 6px rgba(50,50,100,.06); }
  .stat .k { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }
  .stat .v { font-size: 19px; font-weight: 800; color: var(--navy); font-variant-numeric: tabular-nums; }
  @media (max-width: 560px) { .stats { grid-template-columns: 1fr 1fr; } .stats .stat:last-child { grid-column: 1 / -1; } }

  /* ---------- quote builder ---------- */
  .room { border: 1.5px solid var(--line); border-radius: var(--r); padding: 12px; margin-bottom: 12px; background: #fcfcfe; }
  .room-head { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .room-head input { font-weight: 700; }
  .item { display: grid; grid-template-columns: 2fr 1fr 1fr auto auto; gap: 8px; align-items: end; padding: 10px 0; border-top: 1px dashed var(--line); }
  .item:first-of-type { border-top: none; }
  .item .field { margin: 0; }
  .item .amt { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 80px; text-align: right; padding-bottom: 10px; }
  .item .opts { grid-column: 1 / -1; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 13px; }
  .item .opts input[type=text] { flex: 1; min-width: 160px; padding: 7px 9px; font-size: 13.5px; }
  .item .basis { font-size: 12px; color: var(--muted); }
  .rep { display: grid; grid-template-columns: 2fr 90px auto auto; gap: 8px; align-items: center; padding: 6px 0; }
  .rep .amt { font-weight: 700; min-width: 80px; text-align: right; }
  @media (max-width: 640px) {
    .item { grid-template-columns: 1fr 1fr; }
    .item .f-type { grid-column: 1 / -1; }
    .item .amt { grid-column: 1 / 2; text-align: left; padding: 0; }
    .rep { grid-template-columns: 1fr 70px auto; }
    .rep .amt { grid-column: 1 / 2; text-align: left; }
  }
  .totals { position: sticky; bottom: 0; background: #fff; border-top: 2px solid var(--navy); box-shadow: 0 -4px 16px rgba(50,50,100,.08); padding: 12px 16px; z-index: 10; }
  .totals .in { max-width: 920px; margin: 0 auto; display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .totals .nums { display: flex; gap: 18px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
  .totals .nums div { font-size: 12px; color: var(--muted); }
  .totals .nums b { display: block; font-size: 17px; color: var(--navy); }
  .totals .nums .com b { color: var(--ok); }

  /* ---------- job view ---------- */
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font-size: 14px; }
  .kv dt { color: var(--muted); }
  .lines .room-name { font-size: 13px; font-weight: 700; color: var(--navy-deep); background: #f3f4fa; padding: 6px 10px; border-radius: 6px; margin: 12px 0 2px; }
  .lines .line { display: flex; justify-content: space-between; gap: 12px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .lines .line .d { font-size: 12px; color: var(--muted); }
  .lines .line .a { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tot .r { display: flex; justify-content: space-between; padding: 3px 10px; font-size: 14px; font-variant-numeric: tabular-nums; }
  .tot .r.g { border-top: 2px solid var(--navy); margin-top: 6px; padding-top: 8px; font-size: 17px; font-weight: 800; color: var(--navy); }
  .tot .r.c { color: var(--ok); font-weight: 700; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .timeline { list-style: none; }
  .timeline li { position: relative; padding: 0 0 12px 22px; font-size: 14px; }
  .timeline li::before { content: ''; position: absolute; left: 5px; top: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
  .timeline li.done::before { background: var(--ok); }
  .timeline li.now::before { background: var(--pink); box-shadow: 0 0 0 4px rgba(200,27,85,.15); }
  .timeline li::after { content: ''; position: absolute; left: 9px; top: 16px; bottom: 0; width: 1px; background: var(--line); }
  .timeline li:last-child::after { display: none; }
  .timeline .when { color: var(--muted); font-size: 12.5px; }

  /* ---------- inspection ---------- */
  .chk-group { margin-bottom: 12px; }
  .chk-group h4 { font-size: 13.5px; color: var(--navy); margin-bottom: 6px; }
  .chk { display: grid; grid-template-columns: minmax(150px, 1fr) 2fr; gap: 8px; align-items: center; padding: 4px 0; }
  .chk label { display: flex; gap: 7px; align-items: center; font-size: 14px; cursor: pointer; }
  .chk input[type=text] { padding: 6px 8px; font-size: 13.5px; }
  @media (max-width: 520px) { .chk { grid-template-columns: 1fr; } }
  .score { display: flex; gap: 10px; align-items: center; }
  .score input { flex: 1; accent-color: var(--navy); }
  .score b { min-width: 26px; text-align: center; color: var(--navy); }
  .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .photo { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: #eceef5; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--muted); }
  .photo img { width: 100%; height: 100%; object-fit: cover; }
  .photo .del { position: absolute; top: 3px; right: 3px; background: rgba(0,0,0,.6); color: #fff; border: none; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; font-size: 14px; line-height: 1; }
  .photo.add { border: 2px dashed var(--line); background: #fff; cursor: pointer; flex-direction: column; font-size: 12px; }
  .photo.add b { font-size: 24px; color: var(--navy); }

  /* ---------- onboarding ---------- */
  .welcome { background: linear-gradient(135deg, var(--navy) 0%, #44447e 100%); color: #fff; border-radius: var(--r); padding: 24px 22px; margin-bottom: 14px; }
  .welcome h1 { color: #fff; font-size: 23px; }
  .welcome p { color: rgba(255,255,255,.85); margin-top: 6px; }
  .welcome .rates { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .welcome .rate { background: rgba(255,255,255,.12); border-radius: var(--r-sm); padding: 10px 14px; flex: 1 1 200px; }
  .welcome .rate b { display: block; font-size: 24px; }
  .welcome .rate span { font-size: 13px; color: rgba(255,255,255,.8); }
  .steps3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
  .steps3 div { font-size: 13px; color: rgba(255,255,255,.85); }
  .steps3 b { display: inline-flex; width: 22px; height: 22px; border-radius: 50%; background: var(--pink); color: #fff; align-items: center; justify-content: center; font-size: 12px; margin-right: 6px; }
  @media (max-width: 600px) { .steps3 { grid-template-columns: 1fr; } }
  .logo-box { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .logo-prev { width: 220px; height: 90px; border: 2px dashed var(--line); border-radius: var(--r-sm); display: flex; align-items: center; justify-content: center; background: #fff; color: var(--muted); font-size: 13px; padding: 8px; }
  .logo-prev img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .grid4 { display: grid; grid-template-columns: 2fr 1fr 90px 110px; gap: 12px; }
  @media (max-width: 600px) { .grid4 { grid-template-columns: 1fr 1fr; } .grid4 .f-street { grid-column: 1 / -1; } }

  /* ---------- modal + toast ---------- */
  .modal-bg { position: fixed; inset: 0; background: rgba(20,20,40,.45); display: flex; align-items: flex-start; justify-content: center; padding: 40px 12px; z-index: 50; overflow-y: auto; }
  .modal { background: #fff; border-radius: var(--r); width: 100%; max-width: 520px; padding: 20px; }
  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--navy-deep); color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 60; max-width: 90vw; }
  .loading { text-align: center; color: var(--muted); padding: 40px 0; }
</style>
</head>

  async function call(action, payload = {}, { anon = false } = {}) {
    let token = SUPABASE_ANON_KEY;
    if (!anon) {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { showSignIn(); throw new Error('Please sign in again'); }
      token = session.access_token;
    }
    const res = await fetch(FN, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${token}` },
      body: JSON.stringify({ action, ...payload }),
    });
    const out = await res.json().catch(() => ({}));
    if (res.status === 401 && !anon) { await sb.auth.signOut(); showSignIn('Your session ended. Please sign in again.'); throw new Error('signed out'); }
    if (!res.ok || out.error) throw new Error(out.error || `Error ${res.status}`);
    return out;
  }

    bg.addEventListener('click', (e) => { if (e.target === bg) close(); });
    $$('[data-close]', bg).forEach((b) => b.addEventListener('click', close));
    wire?.(bg, close);
    return close;
  }

  // Logos arrive any size. Fit inside 600×240 and keep transparency; fall back
  // to JPEG on white if a busy logo is still too heavy as PNG.
  function logoDataUrl(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, 600 / img.width, 240 / img.height);
        const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
        const g = c.getContext('2d'); g.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(img.src);
        let out = c.toDataURL('image/png');
        if (out.length > 350000) {
          const j = document.createElement('canvas'); j.width = c.width; j.height = c.height;
          const jg = j.getContext('2d'); jg.fillStyle = '#fff'; jg.fillRect(0, 0, j.width, j.height); jg.drawImage(c, 0, 0);
          out = j.toDataURL('image/jpeg', 0.85);
        }
        resolve(out);
      };
      img.onerror = reject;
      img.src = URL.createObjectURL(file);
    });
  }

    const st = {
      customer: { name: job?.customer_name || '', phone: job?.customer_phone || '', email: job?.customer_email || '', address: job?.site_address || '' },
      reference: job?.reference || '',
      install_by: job?.partner.install_by || 'drdrapes',
      invoice_to: job?.partner.invoice_to || a.invoice_default || 'partner',
      quote: {
        rooms: job ? job.quote.rooms.map((r) => ({
          name: r.name,
          items: (r.items || []).filter((i) => i.cat !== 'custom').map((i) => ({ cat: i.cat, width: i.width, drop: i.drop, mould: !!i.mould, item_note: i.item_note || '' })),
          repairs: (r.repairs || []).map((x) => ({ key: x.key, qty: x.qty })),
        })) : [{ name: 'Lounge', items: [blankItem()], repairs: [] }],
        notes: job?.quote.notes || '', insurer_name: job?.quote.insurer_name || '', claim_number: job?.quote.claim_number || '',
      },
      priced: null,
    };

    const catOpts = (sel) => Object.entries(ME.catalog).map(([k, v]) => `<option value="${k}" ${sel === k ? 'selected' : ''}>${esc(v.label)}</option>`).join('');
    const repOpts = (sel) => ME.repairs.map(([k, l]) => `<option value="${k}" ${sel === k ? 'selected' : ''}>${esc(l)}</option>`).join('');
    const needsDrop = (cat) => ['curtain', 'sheer', 'velvet', 'blind'].includes(ME.catalog[cat]?.mode);

    const roomsHtml = () => st.quote.rooms.map((r, ri) => `
      <div class="room" data-ri="${ri}">
        <div class="room-head">
          <input type="text" class="r-name" value="${esc(r.name)}" placeholder="Room name, e.g. Lounge" />
          ${st.quote.rooms.length > 1 ? `<button class="btn-x r-del" title="Remove room">×</button>` : ''}
        </div>
        ${r.items.map((it, ii) => `
          <div class="item" data-ii="${ii}">
            <div class="field f-type"><label>Item</label><select class="i-cat">${catOpts(it.cat)}</select></div>
            <div class="field"><label>Width</label><input type="text" inputmode="decimal" class="i-w" value="${esc(it.width)}" placeholder="m or mm" /></div>
            <div class="field ${needsDrop(it.cat) ? '' : 'hidden'}"><label>Drop</label><input type="text" inputmode="decimal" class="i-d" value="${esc(it.drop)}" placeholder="m or mm" /></div>
            <div class="amt" data-amt="${ri}-${ii}">—</div>
            <button class="btn-x i-del" title="Remove item">×</button>
            <div class="opts">
              <label><input type="checkbox" class="i-mould" ${it.mould ? 'checked' : ''}/> Mould treatment</label>
              <input type="text" class="i-note" value="${esc(it.item_note)}" placeholder="Note, e.g. left window, pinch pleat" />
              <span class="basis" data-basis="${ri}-${ii}"></span>
            </div>
          </div>`).join('')}
        ${r.repairs.map((rp, pi) => `
          <div class="rep" data-pi="${pi}">
            <select class="p-key">${repOpts(rp.key)}</select>
            <input type="number" min="1" class="p-qty" value="${esc(rp.qty)}" />
            <div class="amt" data-ramt="${ri}-${pi}">—</div>
            <button class="btn-x p-del" title="Remove">×</button>
          </div>`).join('')}
        <div class="row" style="margin-top:8px">
          <button class="btn btn-ghost btn-sm i-add">+ Curtain / blind</button>
          <button class="btn btn-ghost btn-sm p-add">+ Repair / hardware</button>
        </div>
      </div>`).join('');

    app.innerHTML = `
      <div class="wrap" style="padding-bottom:110px">
        <div class="spread" style="margin-bottom:12px">
          <div><h1>${job ? 'Edit quote ' + esc(job.quote_number) : 'New quote'}</h1><div class="sub">Priced on Dr Drapes' current price list. Widths and drops in metres (2.4) or millimetres (2400).</div></div>
          <a class="btn btn-ghost btn-sm" href="${job ? '#/job/' + job.id : '#/'}">Cancel</a>
        </div>
        <div id="qe-err"></div>

        <div class="card">
          <h2>Customer</h2>
          <div class="grid2">
            <div class="field"><label>Name *</label><input type="text" id="c-name" value="${esc(st.customer.name)}" autocomplete="off" /></div>
            <div class="field"><label>Phone</label><input type="tel" id="c-phone" value="${esc(st.customer.phone)}" /></div>
            <div class="field"><label>Email</label><input type="email" id="c-email" value="${esc(st.customer.email)}" /><div class="hint">Needed to email the quote from here.</div></div>
            <div class="field"><label>${esc(a.reference_label || 'Your reference')}</label><input type="text" id="c-ref" value="${esc(st.reference)}" /></div>
          </div>
          <div class="field"><label>Site address</label><input type="text" id="c-addr" value="${esc(st.customer.address)}" placeholder="Street, suburb, postcode" /></div>
        </div>

        <div class="card">
          <h2>Who does the takedown and rehang?</h2>
          <div class="choice" id="ch-install">
            <label class="${st.install_by === 'drdrapes' ? 'on' : ''}"><input type="radio" name="install" value="drdrapes" ${st.install_by === 'drdrapes' ? 'checked' : ''}/><span>Dr Drapes<small>We take down, clean and rehang.${ratesSet() ? ` Your commission: ${pctTxt(a.commission_referral_pct)}` : ''}${a.rehang_fee ? ` · rehang charge ${money(a.rehang_fee)} added` : ''}</small></span></label>
            <label class="${st.install_by === 'partner' ? 'on' : ''}"><input type="radio" name="install" value="partner" ${st.install_by === 'partner' ? 'checked' : ''}/><span>${esc(a.name)}<small>You take down and rehang, we clean.${ratesSet() ? ` Your commission: ${pctTxt(a.commission_install_pct)}` : ''}</small></span></label>
          </div>
          <h2 style="margin-top:16px">Who bills the customer?</h2>
          <div class="choice" id="ch-invoice">
            <label class="${st.invoice_to === 'partner' ? 'on' : ''}"><input type="radio" name="invoice" value="partner" ${st.invoice_to === 'partner' ? 'checked' : ''}/><span>${esc(a.name)}<small>You bill your customer, alongside any of your own work. We invoice you our price less your commission.</small></span></label>
            <label class="${st.invoice_to === 'drdrapes' ? 'on' : ''}"><input type="radio" name="invoice" value="drdrapes" ${st.invoice_to === 'drdrapes' ? 'checked' : ''}/><span>Dr Drapes<small>We invoice the customer directly and pay your commission monthly.</small></span></label>
          </div>
        </div>

        <div class="card">
          <h2>Items</h2>
          <div id="rooms">${roomsHtml()}</div>
          <button class="btn btn-ghost" id="room-add">+ Add another room</button>
        </div>

        <div class="card">
          <h2>Notes</h2>
          <div class="field"><label>Notes for the customer (printed on the quote)</label><textarea id="q-notes">${esc(st.quote.notes)}</textarea></div>
          <details ${st.quote.insurer_name || st.quote.claim_number ? 'open' : ''}><summary class="sub" style="cursor:pointer">Insurance claim?</summary>
            <div class="grid2" style="margin-top:10px">
              <div class="field"><label>Insurer</label><input type="text" id="q-ins" value="${esc(st.quote.insurer_name)}" /></div>
              <div class="field"><label>Claim number</label><input type="text" id="q-claim" value="${esc(st.quote.claim_number)}" /></div>
            </div>
          </details>
        </div>
      </div>`;

    $('#totals-mount').innerHTML = `
      <div class="totals"><div class="in">
        <div class="nums">
          <div>Ex GST<b id="t-sub">—</b></div>
          <div>Total inc GST<b id="t-total">—</b></div>
          <div class="com">Your commission<b id="t-com">—</b></div>
        </div>
        <button class="btn btn-primary" id="q-save">${job ? 'Save changes' : 'Save quote'}</button>
      </div></div>`;

    // ---- pricing (server is the source of truth; debounced)
    let priceTimer = null, priceSeq = 0;
    const reprice = () => {
      clearTimeout(priceTimer);
      priceTimer = setTimeout(async () => {
        const seq = ++priceSeq;
        try {
          const r = await call('price', { quote: st.quote, install_by: st.install_by });
          if (seq !== priceSeq) return;
          st.priced = r;
          $('#t-sub').textContent = money(r.totals.subtotal);
          $('#t-total').textContent = money(r.totals.total);
          $('#t-com').textContent = r.commission_pct > 0 ? `${money(r.commission)} (${r.commission_pct}%)` : 'to be agreed';
          // map priced lines back onto the inputs; the server drops lines with
          // no type, so walk both lists in step
          r.quote.rooms.forEach((room, ri) => {
            room.items.forEach((it, ii) => {
              const el = $(`[data-amt="${ri}-${ii}"]`); if (el) el.textContent = it.amount ? money(it.amount) : '—';
              const b = $(`[data-basis="${ri}-${ii}"]`);
              if (b && it.calc) {
                const c = it.calc;
                b.textContent = !c.widthM ? '' : ME.catalog[it.cat]?.mode === 'blind'
                  ? `${c.sqm} m² × $${c.rateUsed}/m²` : `${c.widthM.toFixed(2)} m × $${c.rateUsed}/m`;
              }
            });
            room.repairs.forEach((rp, pi) => { const el = $(`[data-ramt="${ri}-${pi}"]`); if (el) el.textContent = money(rp.amount); });
          });
        } catch (e) { /* totals just stay as they were */ }
      }, 350);
    };

    const redrawRooms = () => { $('#rooms').innerHTML = roomsHtml(); wireRooms(); reprice(); };
    const wireRooms = () => {
      $$('#rooms .room').forEach((rd) => {
        const ri = +rd.dataset.ri, room = st.quote.rooms[ri];
        $('.r-name', rd).addEventListener('input', (e) => { room.name = e.target.value; });
        $('.r-del', rd)?.addEventListener('click', () => {
          if ((room.items.length || room.repairs.length) && !confirm(`Remove ${room.name || 'this room'} and everything in it?`)) return;
          st.quote.rooms.splice(ri, 1); redrawRooms();
        });
        $$('.item', rd).forEach((row) => {
          const it = room.items[+row.dataset.ii];
          $('.i-cat', row).addEventListener('change', (e) => { it.cat = e.target.value; redrawRooms(); });
          $('.i-w', row).addEventListener('input', (e) => { it.width = e.target.value; reprice(); });
          $('.i-d', row).addEventListener('input', (e) => { it.drop = e.target.value; reprice(); });
          $('.i-mould', row).addEventListener('change', (e) => { it.mould = e.target.checked; reprice(); });
          $('.i-note', row).addEventListener('input', (e) => { it.item_note = e.target.value; });
          $('.i-del', row).addEventListener('click', () => { room.items.splice(+row.dataset.ii, 1); redrawRooms(); });
        });
        $$('.rep', rd).forEach((row) => {
          const rp = room.repairs[+row.dataset.pi];
          $('.p-key', row).addEventListener('change', (e) => { rp.key = e.target.value; reprice(); });
          $('.p-qty', row).addEventListener('input', (e) => { rp.qty = e.target.value; reprice(); });
          $('.p-del', row).addEventListener('click', () => { room.repairs.splice(+row.dataset.pi, 1); redrawRooms(); });
        });
        $('.i-add', rd).addEventListener('click', () => {
          const last = room.items[room.items.length - 1];
          room.items.push({ ...blankItem(), cat: last?.cat || 'curtain' }); redrawRooms();
          const rows = $$(`.room[data-ri="${ri}"] .item`); rows[rows.length - 1]?.querySelector('.i-w')?.focus();
        });
        $('.p-add', rd).addEventListener('click', () => { room.repairs.push({ key: ME.repairs[0][0], qty: '1' }); redrawRooms(); });
      });
    };
    wireRooms();
    $('#room-add').addEventListener('click', () => { st.quote.rooms.push({ name: '', items: [blankItem()], repairs: [] }); redrawRooms(); $$('.r-name').pop()?.focus(); });

    const radio = (box, key) => $$(`#${box} input`).forEach((r) => r.addEventListener('change', () => {
      st[key] = r.value;
      $$(`#${box} label`).forEach((l) => l.classList.toggle('on', $('input', l).checked));
      reprice();
    }));
    radio('ch-install', 'install_by'); radio('ch-invoice', 'invoice_to');

    $('#q-save').addEventListener('click', async () => {
      st.customer = { name: $('#c-name').value.trim(), phone: $('#c-phone').value.trim(), email: $('#c-email').value.trim(), address: $('#c-addr').value.trim() };
      st.reference = $('#c-ref').value.trim();
      st.quote.notes = $('#q-notes').value;
      st.quote.insurer_name = $('#q-ins').value.trim();
      st.quote.claim_number = $('#q-claim').value.trim();
      const err = (m) => { $('#qe-err').innerHTML = `<div class="msg err">${esc(m)}</div>`; window.scrollTo(0, 0); };
      if (st.customer.name.length < 2) return err('Enter the customer\'s name.');
      const missing = st.quote.rooms.some((r) => r.items.some((i) => !parseFloat(i.width) || (needsDrop(i.cat) && !parseFloat(i.drop))));
      if (missing) return err('Every curtain and blind needs a width, and a drop where asked. Remove any rows you don\'t need.');
      if (!st.quote.rooms.some((r) => r.items.length || r.repairs.length)) return err('Add at least one item.');
      const btn = $('#q-save'); btn.disabled = true; btn.textContent = 'Saving…';
      try {
        const r = await call('save_quote', { job_id: job?.id || null, customer: st.customer, reference: st.reference, install_by: st.install_by, invoice_to: st.invoice_to, quote: st.quote });
        toast(r.created ? `Quote ${r.quote_number} saved` : 'Changes saved');
        location.hash = '#/job/' + r.job_id;
      } catch (e) { err(e.message); btn.disabled = false; btn.textContent = job ? 'Save changes' : 'Save quote'; }
    });

    reprice();
  }

  // ================================================================ job view

  async function jobView(id) {
    window.scrollTo(0, 0);
    app.innerHTML = `<div class="wrap"><div class="loading">Loading…</div></div>`;
    let job;
    try { job = (await call('get_job', { job_id: id })).job; } catch (e) { app.innerHTML = `<div class="wrap"><a href="#/">← Back</a><div class="msg err" style="margin-top:12px">${esc(e.message)}</div></div>`; return; }
    const a = ME.account, t = job.totals, q = job.quote;
    const statusIdx = FLOW.indexOf(job.status);
    const when = {}; job.timeline.forEach((h) => { when[h.status] = h.at; });

    const linesHtml = q.rooms.map((r) => `
      <div class="room-name">${esc(r.name)}</div>
      ${r.items.map((it) => `<div class="line"><div><div>${esc(it.label)}</div><div class="d">${esc(detailFor(it))}</div></div><div class="a">${money(it.amount)}</div></div>`).join('')}
      ${r.repairs.map((rp) => `<div class="line"><div><div>${esc(rp.label)}</div><div class="d">qty ${esc(rp.qty)}</div></div><div class="a">${money(rp.amount)}</div></div>`).join('')}`).join('');
    const ex = q.extras || {};
    const extras = [['transport', 'Transport'], ['rehang', 'Takedown & rehang'], ['callout', 'Call-out'], ['storage', 'Storage']]
      .filter(([k]) => Number(ex[k])).map(([k, l]) => `<div class="line"><div>${l}</div><div class="a">${money(ex[k])}</div></div>`).join('');

    app.innerHTML = `
      <div class="wrap">
        <div style="margin-bottom:10px"><a href="#/">← All jobs</a></div>
        <div class="card">
          <div class="spread">
            <div><h1>${esc(job.customer_name || 'No name')}</h1><div class="sub">${esc(job.quote_number)}${job.reference ? ' · ' + esc(job.reference) : ''} · raised ${fmtDate(job.created_at)}${job.partner.submitted_by_name ? ' by ' + esc(job.partner.submitted_by_name) : ''}</div></div>
            <span class="pill ${job.status}" style="font-size:13px;padding:4px 12px">${esc(STATUS[job.status] || job.status)}</span>
          </div>
          <dl class="kv" style="margin-top:14px">
            ${job.site_address ? `<dt>Site</dt><dd>${esc(job.site_address)}</dd>` : ''}
            ${job.customer_phone ? `<dt>Phone</dt><dd><a href="tel:${esc(job.customer_phone)}">${esc(job.customer_phone)}</a></dd>` : ''}
            ${job.customer_email ? `<dt>Email</dt><dd>${esc(job.customer_email)}</dd>` : ''}
            <dt>Takedown & rehang</dt><dd>${job.partner.install_by === 'partner' ? esc(a.name) : 'Dr Drapes'}</dd>
            <dt>Customer billed by</dt><dd>${job.partner.invoice_to === 'partner' ? esc(a.name) + ' (we invoice you less commission)' : 'Dr Drapes'}</dd>
            ${job.sent.at ? `<dt>Emailed</dt><dd>${fmtWhen(job.sent.at)} to ${esc(job.sent.to)}</dd>` : ''}
          </dl>
          ${job.status === 'quoted' ? `
            <div class="actions" style="margin-top:16px">
              <button class="btn btn-primary" id="a-email">Email to customer</button>
              <button class="btn btn-navy" id="a-pdf">Download PDF</button>
              ${job.editable ? `<a class="btn btn-ghost" href="#/job/${job.id}/edit">Edit quote</a>` : ''}
            </div>
            <div class="actions" style="margin-top:8px">
              <button class="btn btn-ok btn-sm" id="a-accept">Customer has accepted</button>
              <button class="btn btn-ghost btn-sm" id="a-decline">Customer declined</button>
            </div>
            <p class="sub" style="margin-top:8px">Emailed quotes carry an <b>Accept online</b> button, so you won't need to tell us. If you sent the PDF yourself, press <b>Customer has accepted</b> when they say yes.</p>`
          : `<div class="actions" style="margin-top:16px"><button class="btn btn-ghost" id="a-pdf">Download quote PDF</button></div>`}
        </div>

        <div class="grid2" style="align-items:start">
          <div class="card">
            <h2>Quote</h2>
            <div class="lines">${linesHtml}${extras ? '<div class="room-name">Extras</div>' + extras : ''}</div>
            <div class="tot" style="margin-top:10px">
              ${t.discountAmt > 0 ? `<div class="r"><span>Discount</span><span>− ${money(t.discountAmt)}</span></div>` : ''}
              <div class="r"><span>Subtotal (ex GST)</span><span>${money(t.subtotal)}</span></div>
              <div class="r"><span>GST</span><span>${money(t.gst)}</span></div>
              <div class="r g"><span>Total</span><span>${money(t.total)}</span></div>
              <div class="r c" style="margin-top:8px">${job.commission_pct > 0 ? `<span>Your commission (${job.commission_pct}%, ex GST)</span><span>${money(job.commission)}</span>` : '<span>Your commission</span><span>to be agreed</span>'}</div>
              ${job.commission_paid_at ? `<div class="r" style="color:var(--ok)"><span>Paid</span><span>${fmtDate(job.commission_paid_at)}</span></div>` : ''}
            </div>
            ${q.notes ? `<div class="msg info" style="margin-top:12px;white-space:pre-wrap">${esc(q.notes)}</div>` : ''}
          </div>
          <div class="card">
            <h2>Progress</h2>
            ${job.status === 'declined' ? `<div class="msg err">Declined${job.declined?.at ? ' ' + fmtDate(job.declined.at) : ''}${job.declined?.reason ? ' — ' + esc((DECLINE.find(([k]) => k === job.declined.reason) || [, job.declined.reason])[1]) : ''}</div>` : `
            <ul class="timeline">
              ${FLOW.map((s, i) => `<li class="${i < statusIdx ? 'done' : i === statusIdx ? 'now' : ''}"><div>${esc(STATUS[s])}</div>${when[s] ? `<div class="when">${fmtWhen(when[s])}</div>` : ''}</li>`).join('')}
            </ul>
            <p class="sub">We email you at each step.</p>`}
          </div>
        </div>

        <div class="card" id="pre-card"></div>
      </div>`;

    $('#a-pdf')?.addEventListener('click', () => { buildPdf(job).save(`${job.quote_number}.pdf`); });
    $('#a-email')?.addEventListener('click', () => emailModal(job));
    $('#a-accept')?.addEventListener('click', () => acceptModal(job));
    $('#a-decline')?.addEventListener('click', () => declineModal(job));
    preInspection(job);
  }

  function detailFor(it) {
    const c = it.calc; if (!c) return it.item_note || '';
    const mode = ME.catalog[it.cat]?.mode;
    let d = mode === 'blind' ? `${c.widthM.toFixed(2)}m W × ${c.dropM.toFixed(2)}m H = ${c.sqm} m²`
      : ['curtain', 'sheer', 'velvet'].includes(mode) ? `${c.widthM.toFixed(2)}m W × ${c.dropM.toFixed(2)}m H` : `${c.widthM.toFixed(2)}m W`;
    if (it.item_note) d += ' · ' + it.item_note;
    if (it.mould) d += ' · incl. mould treatment';
    return d;
  }

  function emailModal(job) {
    const first = (job.customer_name || '').trim().split(/\s+/)[0] || '';
    const def = `Hi ${first},\n\nPlease find your quote for curtain and blind cleaning attached. ${ME.account.name} has partnered with Dr Drapes Curtain Clinic to look after your curtains.\n\nYou can accept it online using the button below, or just reply to this email with any questions.\n\nThanks,\n${ME.user.name}\n${ME.account.name}`;
    modal(`
      <div class="spread"><h2>Email quote ${esc(job.quote_number)}</h2><button class="btn-x" data-close>×</button></div>
      <div id="em-err"></div>
      <div class="field"><label>Customer email</label><input type="email" id="em-to" value="${esc(job.customer_email || '')}" /></div>
      <div class="field"><label>Message</label><textarea id="em-msg" rows="9">${esc(def)}</textarea><div class="hint">The quote PDF is attached and an <b>Accept online</b> button goes under your message. You're copied in, and replies come to you and to us.</div></div>
      <button class="btn btn-primary full" id="em-go">Send</button>`, (m, close) => {
      $('#em-go', m).addEventListener('click', async () => {
        const btn = $('#em-go', m); btn.disabled = true; btn.textContent = 'Sending…';
        try {
          const doc = buildPdf(job);
          const pdf_base64 = doc.output('datauristring').split(',')[1];
          await call('email_quote', { job_id: job.id, to: $('#em-to', m).value.trim(), message: $('#em-msg', m).value, pdf_base64 });
          close(); toast('Quote emailed'); jobView(job.id);
        } catch (e) { $('#em-err', m).innerHTML = `<div class="msg err">${esc(e.message)}</div>`; btn.disabled = false; btn.textContent = 'Send'; }
      });
    });
  }

  function acceptModal(job) {
    modal(`
      <div class="spread"><h2>Customer has accepted</h2><button class="btn-x" data-close>×</button></div>
      <p class="sub" style="margin-bottom:12px">This confirms the job with Dr Drapes${job.partner.install_by === 'partner' ? '' : ' and we\'ll contact the customer to book the takedown'}. Only press it once the customer has said yes to this quote and our terms.</p>
      <div id="ac-err"></div>
      <div class="field"><label>Who accepted</label><input type="text" id="ac-name" value="${esc(job.customer_name || '')}" /></div>
      <div class="field"><label>Anything we should know? (access, timing, parking)</label><textarea id="ac-note"></textarea></div>
      <button class="btn btn-ok full" id="ac-go">Confirm acceptance</button>`, (m, close) => {
      $('#ac-go', m).addEventListener('click', async () => {
        const btn = $('#ac-go', m); btn.disabled = true; btn.textContent = 'Confirming…';
        try { await call('customer_accepted', { job_id: job.id, accepted_by: $('#ac-name', m).value, note: $('#ac-note', m).value }); close(); toast('Confirmed — thanks. We\'ll take it from here.'); jobView(job.id); }
        catch (e) { $('#ac-err', m).innerHTML = `<div class="msg err">${esc(e.message)}</div>`; btn.disabled = false; btn.textContent = 'Confirm acceptance'; }
      });
    });
  }

  function declineModal(job) {
    modal(`
      <div class="spread"><h2>Customer declined</h2><button class="btn-x" data-close>×</button></div>
      <div id="dc-err"></div>
      <div class="field"><label>Reason</label><select id="dc-r">${DECLINE.map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select></div>
      <div class="field"><label>Note (optional)</label><textarea id="dc-note"></textarea></div>
      <button class="btn btn-navy full" id="dc-go">Mark declined</button>`, (m, close) => {
      $('#dc-go', m).addEventListener('click', async () => {
        try { await call('customer_declined', { job_id: job.id, reason: $('#dc-r', m).value, note: $('#dc-note', m).value }); close(); toast('Marked declined'); jobView(job.id); }
        catch (e) { $('#dc-err', m).innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }
      });
    });
  }

  // ================================================================ pre-inspection

  function preInspection(job) {
    const box = $('#pre-card');
    const locked = ['in_progress', 'complete', 'invoiced', 'rehung', 'declined'].includes(job.status);
    const saved = job.pre_inspection;
    const s = {
      date: saved?.date || new Date().toISOString().slice(0, 10),
      curt_checks: saved?.curt_checks || [], blind_checks: saved?.blind_checks || [], hw_checks: saved?.hw_checks || [],
      curt_na: !!saved?.curt_na, blind_na: !!saved?.blind_na,
      curt_score: saved?.curt_score ?? 5, blind_score: saved?.blind_score ?? 5,
      cust_notes: saved?.cust_notes || '', job_notes: saved?.job_notes || '',
      photos: saved?.photos || [], newPhotos: [], remove: [],
    };
    let open = false;

    const groupHtml = (key, title, arrKey, naKey) => {
      const arr = s[arrKey];
      const na = naKey ? `<label style="font-size:13px;display:flex;gap:6px;align-items:center;margin-bottom:6px"><input type="checkbox" data-na="${naKey}" ${s[naKey] ? 'checked' : ''}/> None on this job</label>` : '';
      if (naKey && s[naKey]) return `<div class="chk-group"><h4>${title}</h4>${na}</div>`;
      return `<div class="chk-group"><h4>${title}</h4>${na}${INSPECT[key].map(([id, label]) => {
        const on = arr.find((c) => c.id === id);
        return `<div class="chk" data-arr="${arrKey}" data-id="${id}" data-label="${esc(label)}">
          <label><input type="checkbox" ${on ? 'checked' : ''}/> ${esc(label)}</label>
          <input type="text" placeholder="note (optional)" value="${esc(on?.note || '')}" ${on ? '' : 'disabled'} /></div>`;
      }).join('')}</div>`;
    };

    const draw = () => {
      if (locked) {
        box.innerHTML = `<h2>Pre-inspection</h2>${saved ? `<p class="sub">Done ${fmtDate(saved.saved_at)} by ${esc(saved.inspector)}. The job is with our team now.</p>` : '<p class="sub">Not done from the portal. Our team does it at takedown.</p>'}`;
        return;
      }
      if (!open) {
        box.innerHTML = `<div class="spread"><div><h2 style="margin:0">Pre-inspection</h2><div class="sub">${saved ? 'Saved ' + fmtWhen(saved.saved_at) : 'Record the condition and take photos before anything is touched. It protects you, the customer and us.'}</div></div>
          <button class="btn btn-ghost" id="pi-open">${saved ? 'View / edit' : 'Start pre-inspection'}</button></div>`;
        $('#pi-open').addEventListener('click', () => { open = true; draw(); });
        return;
      }
      box.innerHTML = `
        <div class="spread"><h2 style="margin:0">Pre-inspection</h2>${saved ? `<span class="sub">Saved ${fmtWhen(saved.saved_at)}</span>` : ''}</div>
        <div id="pi-err" style="margin-top:10px"></div>
        <div class="field" style="max-width:220px;margin-top:10px"><label>Date</label><input type="date" id="pi-date" value="${esc(s.date)}" /></div>
        ${groupHtml('curtains', 'Curtains', 'curt_checks', 'curt_na')}
        ${groupHtml('blinds', 'Blinds', 'blind_checks', 'blind_na')}
        ${groupHtml('hardware', 'Hardware', 'hw_checks')}
        ${s.curt_na ? '' : `<div class="field"><label>Curtains overall condition (1 poor – 10 excellent)</label><div class="score"><input type="range" min="1" max="10" id="pi-cs" value="${s.curt_score}"/><b id="pi-csv">${s.curt_score}</b></div></div>`}
        ${s.blind_na ? '' : `<div class="field"><label>Blinds overall condition (1 poor – 10 excellent)</label><div class="score"><input type="range" min="1" max="10" id="pi-bs" value="${s.blind_score}"/><b id="pi-bsv">${s.blind_score}</b></div></div>`}
        <div class="field"><label>Notes for the customer (appear on the inspection report)</label><textarea id="pi-cust">${esc(s.cust_notes)}</textarea></div>
        <div class="field"><label>Notes for Dr Drapes (internal — access, fragile items, anything we should know)</label><textarea id="pi-job">${esc(s.job_notes)}</textarea></div>
        <h3>Photos (up to 8)</h3>
        <div class="photos" id="pi-photos"></div>
        <input type="file" id="pi-file" accept="image/*" multiple class="hidden" />
        <div class="actions" style="margin-top:14px"><button class="btn btn-primary" id="pi-save">Save pre-inspection</button><button class="btn btn-ghost" id="pi-cancel">Close</button></div>`;
      wire();
      drawPhotos();
    };

    const drawPhotos = async () => {
      const grid = $('#pi-photos'); if (!grid) return;
      const total = s.photos.length + s.newPhotos.length;
      grid.innerHTML = s.photos.map((p, i) => `<div class="photo" data-p="${esc(p.path)}"><span class="ph">loading…</span><button class="del" data-di="${i}">×</button></div>`).join('')
        + s.newPhotos.map((p, i) => `<div class="photo"><img src="data:image/jpeg;base64,${p.base64}"/><button class="del" data-ni="${i}">×</button></div>`).join('')
        + (total < 8 ? `<div class="photo add" id="pi-add"><b>+</b>Add photo</div>` : '');
      $('#pi-add')?.addEventListener('click', () => $('#pi-file').click());
      $$('[data-di]', grid).forEach((b) => b.addEventListener('click', () => { s.remove.push(s.photos[+b.dataset.di].path); s.photos.splice(+b.dataset.di, 1); drawPhotos(); }));
      $$('[data-ni]', grid).forEach((b) => b.addEventListener('click', () => { s.newPhotos.splice(+b.dataset.ni, 1); drawPhotos(); }));
      if (s.photos.length) {
        try {
          const { urls } = await call('photo_url', { job_id: job.id, paths: s.photos.map((p) => p.path) });
          $$('[data-p]', grid).forEach((el) => {
            const u = urls[el.dataset.p], ph = $('.ph', el);
            if (u && ph) ph.outerHTML = `<img src="${esc(u)}" alt="" />`;
          });
        } catch (_) { /* thumbnails stay as placeholders */ }
      }
    };

    const wire = () => {
      $('#pi-date').addEventListener('change', (e) => { s.date = e.target.value; });
      $$('[data-na]', box).forEach((cb) => cb.addEventListener('change', () => { collect(); s[cb.dataset.na] = cb.checked; draw(); }));
      $$('.chk', box).forEach((row) => {
        const cb = $('input[type=checkbox]', row), note = $('input[type=text]', row);
        cb.addEventListener('change', () => { note.disabled = !cb.checked; if (!cb.checked) note.value = ''; });
      });
      $('#pi-cs')?.addEventListener('input', (e) => { s.curt_score = +e.target.value; $('#pi-csv').textContent = e.target.value; });
      $('#pi-bs')?.addEventListener('input', (e) => { s.blind_score = +e.target.value; $('#pi-bsv').textContent = e.target.value; });
      $('#pi-file').addEventListener('change', async (e) => {
        const files = [...(e.target.files || [])].slice(0, 8 - s.photos.length - s.newPhotos.length);
        for (const f of files) { try { s.newPhotos.push({ name: f.name, base64: await shrink(f) }); } catch (_) { toast('Couldn\'t read ' + f.name); } }
        e.target.value = ''; drawPhotos();
      });
      $('#pi-cancel').addEventListener('click', () => { open = false; draw(); });
      $('#pi-save').addEventListener('click', async () => {
        collect();
        const btn = $('#pi-save'); btn.disabled = true; btn.textContent = s.newPhotos.length ? 'Uploading photos…' : 'Saving…';
        try {
          const r = await call('save_inspection', {
            job_id: job.id,
            pre_inspection: { date: s.date, curt_checks: s.curt_checks, blind_checks: s.blind_checks, hw_checks: s.hw_checks, curt_na: s.curt_na, blind_na: s.blind_na, curt_score: s.curt_score, blind_score: s.blind_score, cust_notes: s.cust_notes, job_notes: s.job_notes },
            new_photos: s.newPhotos, remove_photos: s.remove,
          });
          toast('Pre-inspection saved');
          jobView(job.id);
        } catch (e) { $('#pi-err').innerHTML = `<div class="msg err">${esc(e.message)}</div>`; btn.disabled = false; btn.textContent = 'Save pre-inspection'; }
      });
    };

    const collect = () => {
      ['curt_checks', 'blind_checks', 'hw_checks'].forEach((k) => {
        const rows = $$(`.chk[data-arr="${k}"]`, box);
        if (!rows.length) return;   // group hidden as N/A — keep what it had
        s[k] = rows.filter((r) => $('input[type=checkbox]', r).checked).map((r) => ({ id: r.dataset.id, label: r.dataset.label, note: $('input[type=text]', r).value }));
      });
      if ($('#pi-cust')) s.cust_notes = $('#pi-cust').value;
      if ($('#pi-job')) s.job_notes = $('#pi-job').value;
    };

    draw();
  }

  // Phone photos are 4–12MB. Shrink to 1600px JPEG before upload so a
  // pre-inspection saves in seconds on 4G.
  function shrink(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const max = 1600, k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(img.src);
        resolve(c.toDataURL('image/jpeg', 0.8).split(',')[1]);
      };
      img.onerror = reject;
      img.src = URL.createObjectURL(file);
    });
  }

  // ================================================================ quote PDF
  // The staff app's quote PDF, co-branded: our logo and terms, the partner's
  // name and contact under it. Amounts come from the server's pricing.

  function buildPdf(job) {
    const q = job.quote, t = job.totals, a = ME.account;
    const doc = new jsPDF({ unit: 'mm', format: 'a4' });
    const PW = 210, M = 16, CW = PW - M * 2;
    const grey = [110, 110, 120], ink = [40, 40, 55];
    let y = 16;
    const line = (x1, y1, x2, y2, col = [220, 222, 232], w = 0.3) => { doc.setDrawColor(...col); doc.setLineWidth(w); doc.line(x1, y1, x2, y2); };
    const ensure = (need) => { if (y + need > 270) { doc.addPage(); y = 20; } };

    let logoBottom = y;
    try { const w = 52, h = w / LOGO_ASPECT; doc.addImage(LOGO, 'PNG', M, y, w, h); logoBottom = y + h; } catch (_) {}
    doc.setFont('helvetica', 'bold'); doc.setFontSize(22); doc.setTextColor(...BLUE);
    doc.text('QUOTE', PW - M, y + 6, { align: 'right' });
    doc.setFontSize(11); doc.setTextColor(...ink); doc.text(job.quote_number || '', PW - M, y + 13, { align: 'right' });
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(...grey);
    doc.text(fmtDate(new Date()), PW - M, y + 18, { align: 'right' });
    if (job.reference) doc.text('Ref: ' + clip(job.reference, 28), PW - M, y + 23, { align: 'right' });

    let cy = logoBottom + 6;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(...BLUE);
    doc.text('1300 652 866   ·   drdrapes@hudsongroup.com.au', M, cy);
    cy += 5;
    const pc = [a.phone, a.email, a.website].filter(Boolean).join('   ·   ');
    const dims = ME.logoDims;
    if (a.logo && dims) {
      // "In partnership with" + their logo + their name and contact.
      const h = 11, w = Math.min(42, h * dims.w / dims.h);
      const hh = w < h * dims.w / dims.h ? w * dims.h / dims.w : h;
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(...PINK);
      doc.text('In partnership with', M, cy + 2.5);
      try { doc.addImage(a.logo, a.logo.startsWith('data:image/jpeg') ? 'JPEG' : 'PNG', M + 30, cy - 2, w, hh, 'partnerlogo', 'FAST'); } catch (_) {}
      const tx = M + 30 + w + 4;
      doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(...ink); doc.text(a.name, tx, cy + 1.5);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(...grey); if (pc) doc.text(pc, tx, cy + 6);
      cy += Math.max(hh, 8) + 1;
    } else {
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(...PINK);
      doc.text(`In partnership with ${a.name}${pc ? '   ·   ' + pc : ''}`, M, cy);
    }
    y = cy + 5; line(M, y, PW - M, y, PINK, 0.8); y += 9;

    doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(...BLUE); doc.text('QUOTE FOR', M, y);
    doc.setFont('helvetica', 'normal'); doc.setTextColor(...ink); doc.text(job.customer_name || '', M, y + 5);
    let yy = y + 5; doc.setFontSize(9); doc.setTextColor(...grey);
    if (job.site_address) { yy += 4.5; doc.text(clip(job.site_address, 70), M, yy); }
    if (job.customer_phone) { yy += 4.5; doc.text(job.customer_phone, M, yy); }
    y = yy + 9;

    if (q.insurer_name || q.claim_number) {
      doc.setFillColor(245, 246, 250); doc.rect(M, y - 4, CW, 10, 'F');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(...BLUE); doc.text('INSURANCE', M + 3, y + 2);
      doc.setFont('helvetica', 'normal'); doc.setTextColor(...ink);
      doc.text([q.insurer_name && 'Insurer: ' + q.insurer_name, q.claim_number && 'Claim: ' + q.claim_number].filter(Boolean).join('     '), M + 28, y + 2);
      y += 12;
    }
    if (ME.pdf.intro) {
      doc.setFontSize(9.5); doc.setTextColor(...ink);
      const l = doc.splitTextToSize(ME.pdf.intro, CW); doc.text(l, M, y); y += l.length * 4.6 + 4;
    }

    const col = { item: M, detail: M + 64, rate: PW - M - 52, amt: PW - M };
    const head = () => {
      doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); doc.setTextColor(...grey);
      doc.text('ITEM', col.item, y); doc.text('DETAIL', col.detail, y); doc.text('RATE', col.rate, y, { align: 'right' }); doc.text('AMOUNT', col.amt, y, { align: 'right' });
      y += 2; line(M, y, PW - M, y); y += 4.5;
    };
    const row = (label, detail, rateStr, amt) => {
      doc.setFontSize(8.5);
      const dl = doc.splitTextToSize(detail || '', col.rate - 14 - col.detail);
      const h = Math.max(6, dl.length * 4 + 2); ensure(h);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(...ink); doc.text(clip(label, 32), col.item, y);
      doc.setFontSize(8.5); doc.setTextColor(...grey); doc.text(dl, col.detail, y);
      doc.setFontSize(9.5); doc.setTextColor(...ink);
      if (rateStr) doc.text(rateStr, col.rate, y, { align: 'right' });
      doc.text(money(amt), col.amt, y, { align: 'right' }); y += h;
    };
    q.rooms.forEach((r) => {
      ensure(18);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(...BLUE); doc.text(r.name || 'Room', M, y); y += 5; head();
      r.items.forEach((it) => {
        const mode = ME.catalog[it.cat]?.mode;
        const rateStr = !it.calc ? '' : mode === 'blind' ? `$${it.calc.rateUsed}/m²` : `$${it.calc.rateUsed}/m`;
        row(it.label, detailFor(it), rateStr, it.amount);
      });
      r.repairs.forEach((rp) => row(rp.label, `qty ${rp.qty}`, '$' + (rp.calc?.rateUsed ?? ''), rp.amount));
      y += 3;
    });
    const ex = q.extras || {};
    const exRows = [['transport', 'Transport'], ['rehang', 'Takedown & rehang'], ['callout', 'Call-out'], ['storage', 'Storage']].filter(([k]) => Number(ex[k]));
    if (ex.fuel_on && Number(ex.fuel_amt)) exRows.unshift(['fuel_amt', 'Fuel levy']);
    if (Number(ex.other_amt)) exRows.push(['other_amt', ex.other_desc || 'Other']);
    if (exRows.length) {
      ensure(10 + exRows.length * 6);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(...BLUE); doc.text('Extras', M, y); y += 5; line(M, y, PW - M, y); y += 4.5;
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(...ink);
      exRows.forEach(([k, l]) => { doc.text(l, col.item, y); doc.text(money(ex[k]), col.amt, y, { align: 'right' }); y += 6; });
      y += 3;
    }

    ensure(34);
    const bx = PW - M - 78;
    line(bx, y, PW - M, y); y += 6; doc.setFontSize(10); doc.setTextColor(...ink);
    const tl = (l, v, b) => { doc.setFont('helvetica', b ? 'bold' : 'normal'); doc.text(l, bx, y); doc.text(v, PW - M, y, { align: 'right' }); y += 6; };
    if (t.discountAmt > 0) { tl('Subtotal', money(t.preDiscount)); doc.setTextColor(...PINK); tl('Discount', '- ' + money(t.discountAmt)); doc.setTextColor(...ink); }
    tl('Subtotal (ex GST)', money(t.subtotal)); tl('GST (10%)', money(t.gst));
    doc.setDrawColor(...BLUE); doc.setLineWidth(0.5); doc.line(bx, y - 1, PW - M, y - 1); y += 3;
    doc.setFontSize(13); doc.setTextColor(...BLUE); tl('TOTAL (inc GST)', money(t.total), true);

    if (q.notes) {
      ensure(20); y += 2;
      doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(...BLUE); doc.text('Notes', M, y); y += 5;
      doc.setFont('helvetica', 'normal'); doc.setTextColor(...ink);
      const nl = doc.splitTextToSize(q.notes, CW); doc.text(nl, M, y); y += nl.length * 4.6;
    }
    if (ME.pdf.outro) {
      ensure(24); y += 4; doc.setFontSize(9); doc.setTextColor(...grey);
      const ol = doc.splitTextToSize(ME.pdf.outro, CW); doc.text(ol, M, y); y += ol.length * 4.2;
    }

    if (ME.pdf.terms) {
      doc.addPage();
      let ty = 18;
      doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(...BLUE); doc.text('Terms of Trade & Cleaning Disclaimer', M, ty); ty += 6;
      line(M, ty, PW - M, ty, PINK, 0.6); ty += 5;
      const gap = 8, colW = (CW - gap) / 2, colX = [M, M + colW + gap], startY = ty, avail = 286 - startY;
      const paras = ME.pdf.terms.split(/\n/);
      let chosen = null;
      for (let fs = 9.5; fs >= 6.5; fs -= 0.1) {
        doc.setFontSize(fs); const lh = fs * 0.42, w = [];
        paras.forEach((p) => { if (!p.trim()) { w.push(''); return; } doc.splitTextToSize(p, colW).forEach((l) => w.push(l)); });
        if (w.length <= Math.floor(avail / lh) * 2) { chosen = { fs, lh, lines: w }; break; }
      }
      if (!chosen) { doc.setFontSize(6.5); const w = []; paras.forEach((p) => { if (!p.trim()) { w.push(''); return; } doc.splitTextToSize(p, colW).forEach((l) => w.push(l)); }); chosen = { fs: 6.5, lh: 6.5 * 0.42, lines: w }; }
      const half = Math.ceil(chosen.lines.length / 2);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(chosen.fs); doc.setTextColor(...ink);
      let py = startY, ci = 0;
      chosen.lines.forEach((l, i) => { if (i === half) { ci = 1; py = startY; } doc.text(l, colX[ci], py); py += chosen.lh; });
    }

    const pages = doc.getNumberOfPages();
    for (let p = 1; p <= pages; p++) {
      doc.setPage(p); doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(...grey);
      doc.text(`Dr Drapes Curtain Clinic  ·  1300 652 866  ·  drdrapes.com.au  ·  in partnership with ${a.name}`, M, 290);
      doc.text(`Page ${p} of ${pages}`, PW - M, 290, { align: 'right' });
    }
    return doc;
  }

  // ================================================================ start
  if (INVITE) redeemInvite(); else boot();
</script>
