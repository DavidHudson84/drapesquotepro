<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Drapr demo studio</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --teal:#0F6E63; --deep:#0A4A43; --tint:#DCEDEA; --ink:#12211F; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1600px; height: 900px; overflow: hidden; background: var(--deep); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }

  /* Desktop: the app at 1280×624, scaled 1.25 into 1600×780, with a caption band under it. */
  #desk { position: absolute; left: 0; top: 0; width: 1600px; height: 780px; overflow: hidden; background: #F1F4F3; transition: opacity .5s; }
  #app { width: 1280px; height: 624px; border: 0; transform: scale(1.25); transform-origin: 0 0; background: #F1F4F3; }
  #band { position: absolute; left: 0; top: 780px; width: 1600px; height: 120px; background: var(--deep); color: #fff;
    display: flex; align-items: center; gap: 26px; padding: 0 48px; }
  #band .n { flex: none; width: 58px; height: 58px; border-radius: 50%; background: var(--teal); color: #fff; font: 600 20px Poppins, sans-serif;
    display: flex; align-items: center; justify-content: center; border: 2px solid rgba(255,255,255,.25); }
  #band .t { font: 600 27px/1.2 Poppins, sans-serif; letter-spacing: -.01em; }
  #band .s { font-size: 19px; color: rgba(255,255,255,.78); margin-top: 5px; line-height: 1.35; }
  #band .logo { margin-left: auto; height: 30px; opacity: .9; flex: none; }
  #band .txt { transition: opacity .35s, transform .35s; }
  #band .txt.out { opacity: 0; transform: translateY(8px); }

  /* Phone: a handset on the left, the caption large on the right. */
  #phonestage { position: absolute; inset: 0; display: none; align-items: center; gap: 90px; padding: 0 120px 0 190px;
    background: radial-gradient(900px 600px at 25% 30%, rgba(15,110,99,.55), transparent 70%), linear-gradient(160deg, #0A4A43, #072f2b); }
  #phonestage.on { display: flex; }
  .handset { flex: none; width: 392px; height: 812px; border-radius: 52px; background: #0b1110; padding: 14px; box-shadow: 0 40px 90px rgba(0,0,0,.45), inset 0 0 0 2px #2a3533; position: relative; }
  .handset::before { content: ''; position: absolute; top: 24px; left: 50%; transform: translateX(-50%); width: 110px; height: 30px; background: #0b1110; border-radius: 20px; z-index: 3; }
  .screen { width: 364px; height: 784px; border-radius: 40px; overflow: hidden; background: #fff; position: relative; }
  #phone { width: 390px; height: 840px; border: 0; transform: scale(.9333); transform-origin: 0 0; background: #fff; }
  .pcap { color: #fff; max-width: 640px; }
  .pcap .k { font: 600 15px Poppins, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: #9fd8cf; margin-bottom: 18px; display: flex; align-items: center; gap: 14px; }
  .pcap .k b { width: 44px; height: 44px; border-radius: 50%; background: var(--teal); display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 17px; letter-spacing: 0; border: 2px solid rgba(255,255,255,.25); }
  .pcap .t { font: 600 46px/1.12 Poppins, sans-serif; letter-spacing: -.02em; }
  .pcap .s { font-size: 23px; line-height: 1.45; color: rgba(255,255,255,.8); margin-top: 20px; }
  .pcap .txt { transition: opacity .35s, transform .35s; }
  .pcap .txt.out { opacity: 0; transform: translateY(10px); }

  /* Title cards */
  #card { position: absolute; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #fff;
    background: radial-gradient(1000px 600px at 70% 10%, rgba(15,110,99,.7), transparent 65%), linear-gradient(160deg, #0A4A43, #062a26); transition: opacity .7s; }
  #card.hide { opacity: 0; pointer-events: none; }
  #card img { height: 96px; margin-bottom: 34px; }
  #card h1 { font: 600 60px/1.1 Poppins, sans-serif; letter-spacing: -.02em; max-width: 1100px; }
  #card p { font-size: 26px; color: rgba(255,255,255,.8); margin-top: 22px; max-width: 900px; line-height: 1.45; }
  #card .url { margin-top: 40px; font: 600 22px Poppins, sans-serif; color: #9fd8cf; letter-spacing: .02em; }

  /* Pointer */
  #cur { position: absolute; left: 0; top: 0; z-index: 40; width: 30px; height: 30px; pointer-events: none; transform: translate(800px, 450px);
    transition: transform .75s cubic-bezier(.45,.05,.25,1); filter: drop-shadow(0 3px 5px rgba(0,0,0,.35)); }
  #cur.hide { opacity: 0; }
  .ripple { position: absolute; z-index: 39; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; border: 3px solid #0F6E63; background: rgba(15,110,99,.18);
    pointer-events: none; animation: rip .6s ease-out forwards; }
  @keyframes rip { from { transform: scale(.3); opacity: 1; } to { transform: scale(1.3); opacity: 0; } }
</style>
</head>
<body>
  <div id="desk"><iframe id="app" name="app" src="about:blank"></iframe></div>
  <div id="band">
    <div class="n" id="bn">1</div>
    <div class="txt" id="btxt"><div class="t" id="bt"></div><div class="s" id="bs"></div></div>
    <img class="logo" src="/brand/drapr-lockup-horizontal-white.svg" alt="">
  </div>
  <div id="phonestage">
    <div class="handset"><div class="screen"><iframe id="phone" name="phone" src="about:blank"></iframe></div></div>
    <div class="pcap"><div class="txt" id="ptxt"><div class="k"><b id="pn">1</b><span id="pk"></span></div><div class="t" id="pt"></div><div class="s" id="ps"></div></div></div>
  </div>
  <div id="card"><img src="/brand/drapr-lockup-horizontal-white.svg" alt=""><h1 id="ch"></h1><p id="cp"></p><div class="url" id="cu"></div></div>
  <svg id="cur" class="hide" viewBox="0 0 24 24"><path d="M4 2 L4 20 L9 15.5 L12.5 23 L15.5 21.6 L12 14.3 L19 14 Z" fill="#fff" stroke="#12211F" stroke-width="1.4" stroke-linejoin="round"/></svg>
<script>
  const $ = (id) => document.getElementById(id);
  let cx = 800, cy = 450;
  window.studio = {
    async caption(n, t, s, phone) {
      const box = phone ? $('ptxt') : $('btxt');
      box.classList.add('out');
      await new Promise((r) => setTimeout(r, 350));
      if (phone) { $('pn').textContent = n; $('pk').textContent = phone; $('pt').textContent = t; $('ps').textContent = s || ''; }
      else { $('bn').textContent = n; $('bt').textContent = t; $('bs').textContent = s || ''; }
      box.classList.remove('out');
    },
    mode(m) { $('phonestage').classList.toggle('on', m === 'phone'); },
    card(h, p, u) { $('ch').textContent = h; $('cp').textContent = p || ''; $('cu').textContent = u || ''; $('card').classList.remove('hide'); },
    hideCard() { $('card').classList.add('hide'); },
    cursor(show) { $('cur').classList.toggle('hide', !show); },
    move(x, y, ms) {
      const c = $('cur'); c.style.transitionDuration = (ms || 750) + 'ms';
      c.style.transform = `translate(${x - 4}px, ${y - 2}px)`; cx = x; cy = y;
    },
    ripple(x, y) { const r = document.createElement('div'); r.className = 'ripple'; r.style.left = x + 'px'; r.style.top = y + 'px'; document.body.appendChild(r); setTimeout(() => r.remove(), 700); },
  };
</script>
</body>
</html>
