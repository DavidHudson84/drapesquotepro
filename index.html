      async createJob(fields) {
        // fields: { customer_name, customer_phone, customer_email, site_address, job_type, insurer_name, claim_number }
        const ref = await db.nextQuoteNumber();
        const data = {
          job_type: fields.job_type || 'fast_quote',   // stored in data (no column)
          created_by: session.profile.name,            // stored in data (no column)
        };
        if (fields.insurer_name || fields.claim_number) {
          data.quote = {
            insurer_name: fields.insurer_name || '',
            claim_number: fields.claim_number || '',
          };
        }
        data.status_history = [{
          status: 'quoted',
          changed_by: session.profile.name,
          changed_at: new Date().toISOString(),
          note: 'Job created',
        }];

        // Attach to a customer + site record. If this fails the job must
        // still be created — an unlinked job is recoverable, a lost job isn't.
        let link = { customer_id: null, site_id: null };
        try {
          link = await db.resolveCustomerAndSite(fields, fields.customer_id || null);
        } catch (err) {
          console.error('Customer link failed, job created unlinked:', err);
        }

        const row = {
          company_id: session.profile.company_id,
          quote_number: ref,                 // customer-facing reference
          status: 'quoted',
          customer_name: fields.customer_name || null,
          customer_phone: fields.customer_phone || null,
          customer_email: fields.customer_email || null,
          site_address: composeAddress(fields.address || splitAddress(fields.site_address)) || null,
          customer_id: link.customer_id,
          site_id: link.site_id,
          data,
        };
        const { data: created, error } = await sb.from('jobs').insert(row).select().single();
        if (error) throw error;
        return created;
      },

      // ---------- THE SINGLE SAVE FUNCTION ----------
      // saveJob(jobId, patch): deep-merges patch into jobs.data (jsonb),
      // bumps updated_at. The ONLY path that writes to a job's data.
      // Flat-column patches (customer_name etc) pass through `columns`.
      async saveJob(jobId, patch = {}, columns = {}) {
        // Read current data, merge, write back.
        const current = await db.getJob(jobId);
        const merged = deepMerge(current.data || {}, patch);
        const update = { data: merged, updated_at: new Date().toISOString(), ...columns };
        const { data, error } = await sb.from('jobs').update(update).eq('id', jobId).select().single();
        if (error) throw error;
        return data;
      },

      async advanceStatus(jobId, newStatus) {
        const current = await db.getJob(jobId);
        const history = (current.data?.status_history) || [];
        history.push({
          status: newStatus,
          changed_by: session.profile.name,
          changed_at: new Date().toISOString(),
          note: 'Status changed',
        });
        return db.saveJob(jobId, { status_history: history }, { status: newStatus });
      },

      // ---------- PHOTOS (Supabase Storage: job-photos bucket) ----------
      // Path: {company_id}/{job_id}/{phase}/{filename}
      async uploadPhoto(jobId, phase, file) {
        const cid = session.profile.company_id;
        const safe = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
        const key = `${Date.now()}_${safe}`;
        const path = `${cid}/${jobId}/${phase}/${key}`;
        const { error } = await sb.storage.from('job-photos').upload(path, file, {
          cacheControl: '3600', upsert: false,
        });
        if (error) throw error;
        return { key, path, name: file.name };
      },

        // Private bucket → signed URL (valid 1 hour) for display/download.
        const { data, error } = await sb.storage.from('job-photos').createSignedUrl(path, 3600);
        if (error) throw error;
        return data.signedUrl;
      },

      async deletePhoto(path) {
        const { error } = await sb.storage.from('job-photos').remove([path]);
        if (error) throw error;
      },
    };

        el.textContent = msg;
        el.classList.remove('hidden');
      },

      loginNote(msg) {
        const el = $('#login-note');
        if (!msg) { el.classList.add('hidden'); return; }
        el.textContent = msg;
        el.classList.remove('hidden');
      },

      resetError(msg) {
        const el = $('#reset-error');
        if (!msg) { el.classList.add('hidden'); return; }
        el.textContent = msg;
        el.classList.remove('hidden');
      },

      toast(msg) {
        const t = $('#toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(ui._toastTimer);
        ui._toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
      },
    };

    /* ============================================================
       ROUTER
       Job-first navigation. Routes: dashboard | jobs | enquiries |
       job (single). State held in `route`. Each screen renders into
       #main. New screens (quote builder, inspections) slot into the
       job page sections in later build steps.
       ============================================================ */
    const STATUSES = ['quoted', 'confirmed', 'in_progress', 'complete', 'invoiced', 'rehung'];
    // Everything from acceptance onward — the point a job should exist in Fergus.
    const ACCEPTED_STATUSES = ['confirmed', 'in_progress', 'complete', 'invoiced', 'rehung'];
    const STATUS_LABEL = {
      quoted: 'Quoted', confirmed: 'Confirmed', in_progress: 'In Progress',
      complete: 'Clean / Ready', invoiced: 'Invoiced', rehung: 'Rehung / Completed',
      declined: 'Declined',
    };
    const DECLINE_REASONS = [
      ['price', 'Price / too expensive'], ['elsewhere', 'Went elsewhere'],
      ['timing', 'Timing / not now'], ['no_response', 'No response'], ['other', 'Other'],
    ];

    /* ---------- FOLLOW-UP LADDER ----------
       Chasing an open quote before it is written off. Three rungs, then the
       job is marked declined with reason `no_response` — there is deliberately
       no separate "lost" status: it would ripple through the funnel, the
       filter chips, the pills, the win-rate maths and both report renderers
       for no information the decline reason doesn't already carry.
       Day thresholds are settings so the cadence can be retuned without a
       deploy. Nothing here ages a quote on its own — every email is sent by a
       person, so a customer can never be chased by a timer no one saw. */
    const FOLLOWUP_STAGES = [
      { n: 1, label: 'Nudge', setting: 'followup-days-1', days: 7, tplKey: 'followup-1-body', subjKey: 'followup-1-subject' },
      { n: 2, label: 'Check-in', setting: 'followup-days-2', days: 14, tplKey: 'followup-2-body', subjKey: 'followup-2-subject' },
      { n: 3, label: 'Last chance', setting: 'followup-days-3', days: 21, tplKey: 'followup-3-body', subjKey: 'followup-3-subject' },
    ];
    // Days after the last-chance email before the job is offered up as lost.
    const LOST_AFTER_LAST_DAYS = 7;

    const followUpDays = (st) => {
      const v = Number(session.settings[st.setting]);
      return Number.isFinite(v) && v > 0 ? v : st.days;
    };
    const followUpStage = (n) => FOLLOWUP_STAGES.find((s) => s.n === Number(n)) || FOLLOWUP_STAGES[0];

    // When the quote itself reached the customer. Ageing an open quote off job
    // creation chases people who have never been sent anything — the job can be
    // raised weeks before the quote goes out.
    // Follow-ups are excluded deliberately: chasing someone must not reset the
    // clock, or every rung of the ladder pushes the next one further away.
    // Re-sending an actual quote does restart it, which is right — new price,
    // new wait.
    // A follow-up appears in both records, stamped by the Edge Function in one
    // and copied into the other. Pair them on a tolerance rather than an exact
    // string: if that stamp is ever missing, a clock reset here would quietly
    // stall the whole ladder.
    const SAME_SEND_MS = 60000;
    const nearAny = (t, list) => list.some((x) => Math.abs(new Date(t) - new Date(x)) < SAME_SEND_MS);

    function quoteSentAt(job) {
      const chased = (job.data?.follow_ups || []).map((f) => f.sent_at).filter(Boolean);
      const log = (job.data?.quote?.email_log || []).filter((e) => e.sent_at && !nearAny(e.sent_at, chased));
      if (!log.length) return null;
      return new Date(log[log.length - 1].sent_at);
    }
    const daysSince = (d) => (d ? Math.floor((Date.now() - new Date(d).getTime()) / 86400000) : null);
    const followUpsOf = (job) => job.data?.follow_ups || [];
    const lastFollowUp = (job) => { const f = followUpsOf(job); return f.length ? f[f.length - 1] : null; };
    // Highest rung reached, not the last one recorded — a rung re-sent by hand
    // must not walk the ladder backwards.
    const followUpsSent = (job) => followUpsOf(job).reduce((m, f) => Math.max(m, Number(f.stage) || 0), 0);

    // The rung this quote is due for: the highest threshold it has passed that
    // hasn't been sent yet. A quote left for a month gets the last-chance
    // email, not a "just checking it arrived" nudge. null = nothing due.
    function followUpDue(job) {
      if (job.status !== 'quoted') return null;
      const age = daysSince(quoteSentAt(job));
      if (age == null) return null;
      const sent = followUpsSent(job);
      let due = null;
      FOLLOWUP_STAGES.forEach((st) => { if (st.n > sent && age >= followUpDays(st)) due = st; });
      return due;
    }

    // Last chance sent, silence since — the point to close the file.
    function lostDue(job) {
      if (job.status !== 'quoted') return false;
      const last = followUpsOf(job).filter((f) => Number(f.stage) === 3).pop();
      if (!last) return false;
      return (daysSince(last.sent_at) || 0) >= LOST_AFTER_LAST_DAYS;
    }

    const route = { name: 'dashboard', jobId: null, filter: 'all', search: '', sortKey: 'date', sortDir: 'desc' };

    const router = {
      async go(name, opts = {}) {
        route.name = name;
        if (opts.jobId !== undefined) route.jobId = opts.jobId;
        // sync nav highlight
        document.querySelectorAll('#navbar a').forEach((a) => {
          a.classList.toggle('active', a.dataset.route === name);
        });
        await router.render();
      },

      async render() {
        const main = $('#main');
        try {
          if (route.name === 'run') return await runSheet.view(main);
          if (route.name === 'dashboard') return await router.dashboard(main);
          if (route.name === 'jobs') return await router.jobsList(main);
          if (route.name === 'job') return await router.jobPage(main);
          if (route.name === 'reports') return await router.reports(main);
          if (route.name === 'enquiries') return await router.enquiries(main);
          if (route.name === 'admin') {
            if (!isAdmin()) { route.name = 'dashboard'; return await router.dashboard(main); }
            return await router.admin(main);
          }
        } catch (err) {
          console.error(err);
          main.innerHTML = `<div class="empty-card"><h3>Something went wrong</h3><p>${escapeHtml(err.message || 'Error loading view')}</p></div>`;
        }
      },

      /* ---------- DASHBOARD ---------- */
      async dashboard(main) {
        main.innerHTML = `
          <div class="page-head"><h1>Dashboard</h1><p>Welcome back, ${escapeHtml(firstName(session.profile.name))} — ${escapeHtml(session.company.name)}</p></div>
          <div class="empty-card"><div class="spin" style="margin:0 auto;border-top-color:var(--navy-mid);border-color:#ddd"></div></div>`;

        const jobs = await db.listJobsForStats();
        const s = computeDashStats(jobs);

        // Targets (seeded; editable in Admin later — read from settings if present)
        const tgt = {
          quoted: Number(session.settings['target-quoted'] || 60000),
          confirmed: Number(session.settings['target-confirmed'] || 60000),
          invoiced: Number(session.settings['target-invoiced'] || 60000),
          newjobs: Number(session.settings['target-newjobs'] || 36),
        };

        const bar = (val, target, cls) => {
          const pct = target > 0 ? Math.min(100, Math.round(val / target * 100)) : 0;
          const over = target > 0 && val >= target;
          return `<div class="progress ${cls} ${over ? 'over' : ''}">
            <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
            <div class="progress-label"><span>${pct}% of target</span><strong>${money(target)}</strong></div>
          </div>`;
        };
        const barCount = (val, target, cls) => {
          const pct = target > 0 ? Math.min(100, Math.round(val / target * 100)) : 0;
          const over = target > 0 && val >= target;
          return `<div class="progress ${cls} ${over ? 'over' : ''}">
            <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
            <div class="progress-label"><span>${pct}% of target</span><strong>${target}</strong></div>
          </div>`;
        };

        // ---- the chase list: every open quote that wants an action today ----
        const CHASE_SHOWN = 8;
        const chaseRows = s.chase.slice(0, CHASE_SHOWN).map((c) => {
          const badge = c.unsent
            ? `<span class="fu-badge none">Quote not sent</span>`
            : (c.sent
              ? `<span class="fu-badge ${c.sent >= 3 ? 'last' : ''}">${c.sent} follow-up${c.sent === 1 ? '' : 's'} sent</span>`
              : `<span class="fu-badge none">Not chased yet</span>`);
          const ageTxt = c.unsent
            ? `raised ${c.age} day${c.age === 1 ? '' : 's'} ago`
            : `${c.age} day${c.age === 1 ? '' : 's'} since sent`;
          const hot = !c.unsent && (c.lost || c.due?.n === 3);
          // Once the last chance has been sent and gone quiet, closing the file
          // is the action — chasing again is the afterthought, not the default.
          const actions = c.unsent
            ? `<button class="btn-mini ghost" data-open="${c.id}">Open quote</button>`
            : (c.lost
              ? `<button class="btn-mini ghost" data-fu="${c.id}">Chase again</button><button class="btn-mini" data-lost="${c.id}">Mark lost</button>`
              : `<button class="btn-mini" data-fu="${c.id}">${escapeHtml(c.due ? c.due.label : 'Follow up')}</button>`);
          return `<div class="chase-row" data-chase="${c.id}">
            <div class="c-cust">${escapeHtml(c.customer_name || 'No name')}<small>${escapeHtml(c.quote_number || '—')}${c.total ? `<span class="c-amt-inline"> · ${money(c.total)}</span>` : ''}</small></div>
            <div class="c-amt">${c.total ? money(c.total) : '—'}</div>
            <div class="c-age"><span class="${hot ? 'hot' : ''}">${ageTxt}</span><br/>${badge}</div>
            <div class="chase-actions">${actions}</div>
          </div>`;
        }).join('');
        const extra = s.chase.length - CHASE_SHOWN;
        const chasePanel = s.chase.length
          ? `<div class="chase-panel">${chaseRows}${extra > 0 ? `<div class="chase-more">+ ${extra} more open quote${extra === 1 ? '' : 's'} waiting — open Jobs → Quoted for the full list.</div>` : ''}</div>`
          : '';

        main.innerHTML = `
          <div class="page-head"><h1>Dashboard</h1><p>Welcome back, ${escapeHtml(firstName(session.profile.name))} — ${escapeHtml(session.company.name)}</p></div>

          <div class="dash-band">
            <div class="dash-band-title">This month at a glance</div>
            <div class="dash-grid">
              <div class="metric">
                <div class="m-label">Quoted</div>
                <div class="m-value">${money(s.month.quotedVal)}</div>
                <div class="m-sub"><span class="m-count">${s.month.quotedCount}</span> quote${s.month.quotedCount === 1 ? '' : 's'}</div>
                ${bar(s.month.quotedVal, tgt.quoted, '')}
              </div>
              <div class="metric teal">
                <div class="m-label">Confirmed</div>
                <div class="m-value">${money(s.month.confirmedVal)}</div>
                <div class="m-sub"><span class="m-count">${s.month.confirmedCount}</span> job${s.month.confirmedCount === 1 ? '' : 's'}</div>
                ${bar(s.month.confirmedVal, tgt.confirmed, 'teal')}
              </div>
              <div class="metric green">
                <div class="m-label">Invoiced</div>
                <div class="m-value">${money(s.month.invoicedVal)}</div>
                <div class="m-sub"><span class="m-count">${s.month.invoicedCount}</span> job${s.month.invoicedCount === 1 ? '' : 's'}</div>
                ${bar(s.month.invoicedVal, tgt.invoiced, 'green')}
              </div>
              <div class="metric red">
                <div class="m-label">New Jobs (month)</div>
                <div class="m-value">${s.month.newJobs}</div>
                <div class="m-sub">${s.week.newJobs} this week</div>
                ${barCount(s.month.newJobs, tgt.newjobs, '')}
              </div>
            </div>
          </div>

          <div class="dash-band">
            <div class="dash-band-title">Health</div>
            <div class="dash-grid">
              <div class="metric"><div class="m-label">Win rate</div><div class="m-value">${s.winRate}%</div><div class="m-sub">${s.wonCount} won · ${s.declinedCount} declined · ${s.pendingCount} pending</div></div>
              <div class="metric"><div class="m-label">Average job size</div><div class="m-value">${money(s.avgJobSize)}</div><div class="m-sub">confirmed jobs</div></div>
              <div class="metric teal"><div class="m-label">Pipeline value</div><div class="m-value">${money(s.pipelineVal)}</div><div class="m-sub">${s.pipelineCount} open quote${s.pipelineCount === 1 ? '' : 's'}</div></div>
              <div class="metric"><div class="m-label">Invoiced this week</div><div class="m-value">${money(s.week.invoicedVal)}</div><div class="m-sub"><span class="m-count">${s.week.invoicedCount}</span> job${s.week.invoicedCount === 1 ? '' : 's'}</div></div>
            </div>
          </div>

          <div class="dash-band">
            <div class="dash-band-title">Needs attention</div>
            <div class="attention-grid">
              <div class="attn-card ${s.toChase ? '' : 'ok'}" id="attn-chase">
                <div class="a-count">${s.toChase}</div>
                <div class="a-label">Quotes to chase</div>
                <div class="a-hint">Follow-up due — measured from when the quote was emailed${s.quotesUnsent ? ` · ${s.quotesUnsent} quote${s.quotesUnsent === 1 ? '' : 's'} never sent` : ''}</div>
              </div>
              <div class="attn-card ${s.lastChance ? '' : 'ok'}" id="attn-lastchance">
                <div class="a-count">${s.lastChance}</div>
                <div class="a-label">Last chance</div>
                <div class="a-hint">Final follow-up due, or silent since one was sent</div>
              </div>
              <div class="attn-card ${s.toSchedule ? '' : 'ok'}" id="attn-schedule">
                <div class="a-count">${s.toSchedule}</div>
                <div class="a-label">To schedule</div>
                <div class="a-hint">Confirmed, no pre-inspection yet</div>
              </div>
            </div>
            ${chasePanel}
          </div>

          <div class="dash-band">
            <div class="dash-band-title">Pipeline</div>
            <div class="funnel">
              ${STATUSES.map((st) => `<div class="funnel-step" data-fstatus="${st}"><div class="f-count">${s.byStatus[st] || 0}</div><div class="f-label">${STATUS_LABEL[st]}</div></div>`).join('')}
            </div>
          </div>
        `;

        // wire clickable cards → jobs list filtered
        const goFiltered = (filter) => { route.filter = filter; router.go('jobs'); };
        const chaseCard = $('#attn-chase'); if (chaseCard && s.toChase) chaseCard.addEventListener('click', () => goFiltered('quoted'));
        const lastCard = $('#attn-lastchance'); if (lastCard && s.lastChance) lastCard.addEventListener('click', () => goFiltered('quoted'));
        const sched = $('#attn-schedule'); if (sched && s.toSchedule) sched.addEventListener('click', () => goFiltered('confirmed'));
        document.querySelectorAll('.funnel-step[data-fstatus]').forEach((f) =>
          f.addEventListener('click', () => goFiltered(f.dataset.fstatus)));

        // ---- chase panel: act on a quote without leaving the dashboard ----
        const openJob = (id) => { route.jobId = id; router.go('job'); };
        document.querySelectorAll('.chase-row[data-chase]').forEach((r) =>
          r.addEventListener('click', (e) => { if (!e.target.closest('button')) openJob(r.dataset.chase); }));
        document.querySelectorAll('[data-open]').forEach((b) =>
          b.addEventListener('click', (e) => { e.stopPropagation(); openJob(b.dataset.open); }));
        // The row carries a trimmed job (stats query); the email needs the full
        // record — address, phone, the whole quote — so re-fetch on click.
        document.querySelectorAll('[data-fu]').forEach((b) =>
          b.addEventListener('click', async (e) => {
            e.stopPropagation();
            b.disabled = true;
            try {
              const full = await db.getJob(b.dataset.fu);
              followUpEmail.open(full, () => router.dashboard(main));
            } catch (err) {
              ui.toast('Could not open follow-up: ' + (err.message || 'error'));
            } finally { b.disabled = false; }
          }));
        document.querySelectorAll('[data-lost]').forEach((b) =>
          b.addEventListener('click', async (e) => {
            e.stopPropagation();
            b.disabled = true;
            try {
              const full = await db.getJob(b.dataset.lost);
              acceptance.openDeclineModal(full, { reason: 'no_response', after: () => router.dashboard(main) });
            } catch (err) {
              ui.toast('Could not open: ' + (err.message || 'error'));
            } finally { b.disabled = false; }
          }));
      },

      /* ---------- JOBS LIST ---------- */
      // opts.rowsOnly repaints just the table from jobs already in memory.
      // Searching used to blank the page to a spinner and refetch every job on
      // each keystroke, which destroyed the very input being typed into. The
      // search box and chips are now left alone and only the table is rebuilt.
      async jobsList(main, opts = {}) {
        const archivedView = route.filter === 'archived';
        const viewKey = 'jobs-' + archivedView;
        const repaint = !!opts.rowsOnly
          && main.dataset.view === viewKey
          && !!jobsCache && jobsCache.key === viewKey
          && !!$('#jobs-table');

        let jobs;
        if (repaint) {
          jobs = jobsCache.jobs;
        } else {
          main.innerHTML = `<div class="empty-card"><div class="spin" style="margin:0 auto;border-top-color:var(--navy-mid);border-color:#ddd;border-top-color:var(--navy-mid)"></div></div>`;
          jobs = await db.listJobs(archivedView);
          jobsCache = { key: viewKey, jobs };
        }

        const filtered = jobs.filter((j) => {
          if (!archivedView && route.filter !== 'all' && j.status !== route.filter) return false;
          if (route.search) {
            const q = route.search.toLowerCase();
            return (j.quote_number || '').toLowerCase().includes(q)
              || (j.drd_number || '').toLowerCase().includes(q)
              || (j.legacy_reference || '').toLowerCase().includes(q)
              || (j.data?.po_number || '').toLowerCase().includes(q)
              || (j.customer_name || '').toLowerCase().includes(q)
              || (j.site_address || '').toLowerCase().includes(q);
          }
          return true;
        });

        // chips: all + statuses + declined + archived
        const chipKeys = ['all', ...STATUSES, 'declined', 'archived'];
        const chips = chipKeys.map((s) =>
          `<span class="chip ${route.filter === s ? 'active' : ''}" data-filter="${s}">${s === 'all' ? 'All' : (s === 'archived' ? 'Archived' : STATUS_LABEL[s])}</span>`
        ).join('');

        // ---- sorting (click headers to toggle asc/desc) ----
        const sortKey = route.sortKey || 'date';
        const sortDir = route.sortDir || 'desc';
        const jobDate = (j) => new Date(j.created_at || j.updated_at || 0).getTime();
        const SORT_VAL = {
          dq: (j) => (j.quote_number || '').toLowerCase(),
          // Sort on the numeric part so DRD-3092 sits before DRD-3160b.
          // Jobs with no Fergus number sort to the bottom either way.
          fergus: (j) => {
            const m = String(j.drd_number || '').match(/([0-9]+)/);
            return m ? Number(m[1]) : Number.MAX_SAFE_INTEGER;
          },
          customer: (j) => (j.customer_name || '').toLowerCase(),
          address: (j) => (j.site_address || '').toLowerCase(),
          date: (j) => jobDate(j),
          status: (j) => { const i = STATUSES.indexOf(j.status); return i < 0 ? 99 : i; },
          total: (j) => Number(j.data?.quote?.total || 0),
        };
        const getVal = SORT_VAL[sortKey] || SORT_VAL.date;
        const sorted = filtered.slice().sort((a, b) => {
          const va = getVal(a), vb = getVal(b);
          let c;
          if (typeof va === 'string' || typeof vb === 'string') c = String(va).localeCompare(String(vb));
          else c = va - vb;
          if (c === 0) c = jobDate(b) - jobDate(a); // stable tie-break: newest first
          return sortDir === 'asc' ? c : -c;
        });

        const hdr = (key, label, extraStyle = '') => {
          const on = sortKey === key;
          const arrow = on ? (sortDir === 'asc' ? '▲' : '▼') : '▲';
          return `<div class="hdr ${on ? 'sorted' : ''}" data-sort="${key}" style="${extraStyle}">${label}<span class="sort-arrow">${arrow}</span></div>`;
        };

        const fmtRowDate = (j) => {
          const t = j.created_at || j.updated_at;
          if (!t) return '—';
          return new Date(t).toLocaleDateString('en-AU', { day: '2-digit', month: 'short', year: '2-digit' });
        };

        const rows = sorted.length ? sorted.map((j) => {
          const total = j.data?.quote?.total;
          const amt = total ? '$' + Number(total).toLocaleString('en-AU', { minimumFractionDigits: 2 }) : '—';
          const archBtn = archivedView
            ? `<span class="row-arch" data-unarch="${j.id}" title="Restore">↩︎ Restore</span>`
            : `<span class="row-arch" data-arch="${j.id}" title="Archive">Archive</span>`;
          return `
            <div class="job-row" data-job="${j.id}">
              <div class="dq">${escapeHtml(j.quote_number || '—')}</div>
              <div class="fergus">${escapeHtml(j.drd_number || '—')}</div>
              <div class="cust">${escapeHtml(j.customer_name || 'No name')}<small>${escapeHtml(j.customer_phone || '')}</small></div>
              <div class="addr">${escapeHtml(j.site_address || '—')}</div>
              <div class="date">${fmtRowDate(j)}</div>
              <div><span class="status-pill s-${j.status}">${STATUS_LABEL[j.status] || j.status}</span></div>
              <div class="amt">${amt} <span class="row-arch-wrap">${archBtn}</span></div>
            </div>`;
        }).join('') : `<div style="padding:40px;text-align:center;color:var(--muted)">No jobs ${archivedView ? 'archived' : (route.filter !== 'all' ? 'with this status' : 'yet')}. ${archivedView ? '' : 'Tap <strong>+ New Job</strong> to create one.'}</div>`;

        const countText = `${filtered.length} ${archivedView ? 'archived' : 'of ' + jobs.length} job${jobs.length === 1 ? '' : 's'}`;
        const headRow = `<div class="job-row head">
              ${hdr('dq', 'DRQ')}${hdr('fergus', 'DRD')}${hdr('customer', 'Customer')}${hdr('address', 'Address')}${hdr('date', 'Date')}${hdr('status', 'Status')}${hdr('total', 'Total', 'text-align:right')}
            </div>`;

        // Everything inside the table, rewired whenever the table is rebuilt.
        // Sorting and searching both go through the rows-only path, so neither
        // touches the search box or costs a round trip to the database.
        const wireTable = () => {
          document.querySelectorAll('.hdr[data-sort]').forEach((h) =>
            h.addEventListener('click', () => {
              const k = h.dataset.sort;
              if (route.sortKey === k) route.sortDir = (route.sortDir === 'asc' ? 'desc' : 'asc');
              else { route.sortKey = k; route.sortDir = (k === 'date' || k === 'total') ? 'desc' : 'asc'; }
              router.jobsList(main, { rowsOnly: true });
            }));
          document.querySelectorAll('.job-row[data-job]').forEach((r) =>
            r.addEventListener('click', (e) => {
              if (e.target.closest('.row-arch')) return; // don't open when clicking archive
              router.go('job', { jobId: r.dataset.job });
            }));
          // Archiving changes the data itself, so those reload properly.
          document.querySelectorAll('[data-arch]').forEach((b) =>
            b.addEventListener('click', async (e) => {

      /* ---------- REPORTS ---------- */
      async reports(main) {
        main.innerHTML = `
          <div class="page-head"><h1>Reports</h1><p>Loading job data…</p></div>
          <div class="empty-card"><div class="spin" style="margin:0 auto;border-top-color:var(--navy-mid);border-color:#ddd"></div></div>`;

        let allJobs;
        try { allJobs = await db.listJobsAll(); }
        catch (e) {
          main.innerHTML = `<div class="empty-card"><h3>Couldn't load reports</h3><p>${escapeHtml(e.message || 'Error')}</p></div>`;
          return;
        }

        const today = new Date();
        const monthStart = (y, m) => new Date(y, m, 1, 0, 0, 0, 0);
        const monthEnd = (y, m) => new Date(y, m + 1, 0, 23, 59, 59, 999);
        const fmtLocal = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

        // persisted report state across re-renders
        const state = route._rep || (route._rep = {
          preset: 'this_month',
          from: monthStart(today.getFullYear(), today.getMonth()),
          to: monthEnd(today.getFullYear(), today.getMonth()),
          exclArchived: false,
        });

        function applyPreset(p) {
          const n = new Date();
          const y = n.getFullYear(), m = n.getMonth();
          if (p === 'this_week') {
            const ws = new Date(n); ws.setDate(n.getDate() - n.getDay()); ws.setHours(0, 0, 0, 0);
            const we = new Date(ws); we.setDate(ws.getDate() + 6); we.setHours(23, 59, 59, 999);
            state.from = ws; state.to = we;
          }
          else if (p === 'last_week') {
            const ws = new Date(n); ws.setDate(n.getDate() - n.getDay() - 7); ws.setHours(0, 0, 0, 0);
            const we = new Date(ws); we.setDate(ws.getDate() + 6); we.setHours(23, 59, 59, 999);
            state.from = ws; state.to = we;
          }
          else if (p === 'this_month') { state.from = monthStart(y, m); state.to = monthEnd(y, m); }
          else if (p === 'last_month') { state.from = monthStart(y, m - 1); state.to = monthEnd(y, m - 1); }
          else if (p === 'this_quarter') { const qs = Math.floor(m / 3) * 3; state.from = monthStart(y, qs); state.to = monthEnd(y, qs + 2); }
          else if (p === 'this_year') { state.from = new Date(y, 0, 1, 0, 0, 0, 0); state.to = new Date(y, 11, 31, 23, 59, 59, 999); }
          else if (p === 'all_time') { state.from = new Date(2000, 0, 1); state.to = new Date(y, 11, 31, 23, 59, 59, 999); }
          state.preset = p;
        }

        const PRESET_LABEL = {
          this_week: 'This week', last_week: 'Last week', this_month: 'This month',
          last_month: 'Last month', this_quarter: 'This quarter', this_year: 'This year',
          all_time: 'All time', custom: 'Custom range',
        };
        const dshort = (d) => d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' });
        const rangeLabel = () => state.preset === 'all_time'
          ? 'All time'
          : `${PRESET_LABEL[state.preset] || 'Custom range'}: ${dshort(state.from)} – ${dshort(state.to)}`;

        let chart = null;
        const money0 = (n) => '$' + Math.round(Number(n || 0)).toLocaleString('en-AU');

        const render = () => {
          const includeArchived = !state.exclArchived;
          const rep = computeReport(allJobs, state.from, state.to, includeArchived);
          const trend = computeReportTrend(allJobs, includeArchived, 12);

          const presetBtn = (id, label) =>
            `<button class="rep-preset ${state.preset === id ? 'on' : ''}" data-preset="${id}">${label}</button>`;

          const rangeLabel = state.preset === 'all_time'
            ? 'All time'
            : `${dshort(state.from)} – ${dshort(state.to)}`;

          // Every status in the known order, plus any status found in the data
          // that isn't in the list (e.g. draft) so the table ties back to the
          // quote count instead of silently dropping rows.
          const knownSt = STATUSES.concat(['declined']);
          const extraSt = Object.keys(rep.byStatus).filter((st) => !knownSt.includes(st)).sort();
          const statusRows = knownSt.concat(extraSt).map((st) =>
            `<tr><td>${STATUS_LABEL[st] || (st.charAt(0).toUpperCase() + st.slice(1))}</td><td style="text-align:right">${rep.byStatus[st] || 0}</td></tr>`)
            .join('') + `<tr style="font-weight:700"><td>Total</td><td style="text-align:right">${rep.cohortCount}</td></tr>`;

          const flagHtml = rep.act.noInvoiceEvent
            ? `<div class="rep-flag"><strong>Data check:</strong> ${rep.act.noInvoiceEvent} job${rep.act.noInvoiceEvent === 1 ? ' is' : 's are'} sitting at Invoiced or Rehung with no Invoiced step ever recorded, so ${rep.act.noInvoiceEvent === 1 ? 'it' : 'they'} can't be dated to a period. Open the job and step it through Invoiced to fix.</div>`
            : '';

          const staffRowsHtml = rep.staffRows.length ? rep.staffRows.map(([who, s]) => {
            const decided = s.wonCount + s.declinedCount;
            const conv = decided > 0 ? Math.round(s.wonCount / decided * 100) : 0;
            return `<tr>
              <td>${escapeHtml(firstName(who))}</td>
              <td style="text-align:right">${s.count}</td>
              <td style="text-align:right">${money0(s.quotedVal)}</td>
              <td style="text-align:right">${money0(s.confirmedVal)}</td>
              <td style="text-align:right">${conv}%</td>
            </tr>`;
          }).join('') : `<tr><td colspan="5" style="color:var(--muted)">No jobs in range</td></tr>`;

          const custRowsHtml = rep.topCustomers.length ? rep.topCustomers.map(([name, val]) =>
            `<tr><td>${escapeHtml(name)}</td><td style="text-align:right">${money0(val)}</td></tr>`).join('')
            : `<tr><td colspan="2" style="color:var(--muted)">No jobs in range</td></tr>`;

          const REASON_LABEL = Object.fromEntries(DECLINE_REASONS);
          const reasonRowsHtml = rep.reasonRows.length ? rep.reasonRows.map(([r, o]) =>
            `<tr><td>${escapeHtml(REASON_LABEL[r] || r)}</td><td style="text-align:right">${o.count}</td><td style="text-align:right">${money0(o.val)}</td></tr>`).join('')
            : `<tr><td colspan="3" style="color:var(--muted)">No declines in range</td></tr>`;

          main.innerHTML = `

    function adminStatusBar(saveFn) {
      // Renders a Save button + status, and returns helpers to mark dirty/saved.
      const html = `
        <div class="save-bar">
          <button class="btn btn-confirm" id="adm-save">Save changes</button>
          <span class="save-status" id="adm-status">No changes</span>
        </div>`;
      const wire = () => {
        const status = $('#adm-status');
        const btn = $('#adm-save');
        btn.addEventListener('click', async () => {
          btn.disabled = true; btn.textContent = 'Saving…';
          try { await saveFn(); status.textContent = 'Saved ✓'; status.className = 'save-status saved'; }
          catch (err) { ui.toast('Save failed: ' + (err.message || 'error')); status.textContent = 'Save failed'; }
          finally { btn.disabled = false; btn.textContent = 'Save changes'; }
        });
        return {
          markDirty: () => { status.textContent = 'Unsaved changes'; status.className = 'save-status dirty'; },
        };
      };
      return { html, wire };
    }

    /* ---------- job page section + field templates ---------- */

    /* ============================================================
       ADDRESSES
       Held as parts on the site record and composed into the one line that
       every PDF, job card, list and email already renders. A single composer
       keeps the format identical everywhere, and splitting the entry stops a
       bare suburb being stored as though it were an address, which is what
       once attached a job to a stranger's property in Fergus.
       ============================================================ */
    const AU_STATES = ['VIC', 'NSW', 'QLD', 'SA', 'WA', 'TAS', 'NT', 'ACT'];

    function composeAddress(p) {
      const street = (p.street || '').trim();
      const suburb = (p.suburb || '').trim();
      const state = (p.state || '').trim().toUpperCase();
      const postcode = (p.postcode || '').trim();
      // The state only means anything next to a suburb or postcode. Without one
      // it would render as a bare "VIC" on a quote PDF.
      const locality = (suburb || postcode)
        ? [suburb, state, postcode].filter(Boolean).join(' ')
        : '';
      return [street, locality].filter(Boolean).join(', ');
    }

    // Older jobs hold one typed line. Pull it apart so the edit form opens
    // populated, and so old records improve quietly as they get touched.
    function splitAddress(line) {
      let s = String(line || '').trim();
      const out = { street: '', suburb: '', state: '', postcode: '' };
      if (!s) { out.state = 'VIC'; return out; }
      const pc = s.match(/\b(\d{4})\b\s*$/);
      if (pc) { out.postcode = pc[1]; s = s.slice(0, pc.index).trim(); }
      const st = s.match(/[,\s]+(VIC|VICTORIA|NSW|QLD|SA|WA|TAS|NT|ACT)\.?\s*$/i);
      if (st) {
        const raw = st[1].toUpperCase();
        out.state = raw === 'VICTORIA' ? 'VIC' : raw;
        s = s.slice(0, st.index).trim();
      }
      s = s.replace(/,\s*$/, '').trim();
      const parts = s.split(',').map((x) => x.trim()).filter(Boolean);
      if (parts.length >= 2) { out.suburb = parts.pop(); out.street = parts.join(', '); }
      else if (/^\s*\d/.test(s)) { out.street = s; }   // starts with a number, so it is a street
      else { out.suburb = s; }                          // no number: it was only ever a suburb
      if (!out.state) out.state = 'VIC';
      return out;
    }

    }

    /* ============================================================
       QUOTE BUILDER
       Holds an in-memory working copy of the job's quote while editing,
       re-renders totals live, and saves the whole thing into
       data.quote via the single saveJob(). Editing an existing quote
       loads data.quote back in with identical field names — the v1
       "edit reloads everything" requirement.
       ============================================================ */
    const quoteBuilder = {
      jobId: null,
      q: null,   // working quote object

      init(job) {
        this.jobId = job.id;
        // Kept whole: the follow-up button needs the job's status and email
        // history, neither of which lives on the working quote object.
        this.job = job;
        this.enquirySource = job.data?.enquiry_source || null;
        const existing = job.data?.quote || {};
        this.q = {
          type: existing.type || 'fast_quote',
          rooms: this.migrateRooms(existing),
          repairs: deepClone(existing.repairs || []),   // whole-job repairs
          extras: Object.assign(
            { fuel_on: false, fuel_amt: '', transport: '', rehang: '', callout: '', storage: '', other_amt: '', other_desc: '' },
            existing.extras || {}
          ),
          discount: Object.assign({ type: 'none', value: '' }, existing.discount || {}),
          insurer_name: existing.insurer_name || '',
          claim_number: existing.claim_number || '',
          notes: existing.notes || '',
          show_rates: existing.show_rates !== false, // default ON
          sent_at: existing.sent_at, sent_to: existing.sent_to, sent_by: existing.sent_by,
          email_log: existing.email_log || [],
        };
        this.render();
      },

      // Migrate old flat {lines:[...]} into room structure. Groups old lines
      // by their per-line `desc` (used as room name) so nothing is lost.
      migrateRooms(existing) {
        if (Array.isArray(existing.rooms)) return deepClone(existing.rooms);
        const lines = existing.lines || [];
        if (!lines.length) return [];
        const byRoom = {};
        lines.forEach((l) => {
          const rn = (l.desc && l.desc.trim()) || 'Room 1';
          if (!byRoom[rn]) byRoom[rn] = [];
          // drop the old per-line room text; item keeps its own fields
          const { desc, ...rest } = l;
          byRoom[rn].push({ ...rest, item_note: '' });
        });
        return Object.keys(byRoom).map((name) => ({ name, items: byRoom[name], repairs: [] }));
      },

      // Read-only panel showing the original customer enquiry (when a job
      // was converted from one) — description, customer observations, rating,
      // and all photos. Photos load via signed URLs once the panel renders.
      enquirySourceHtml() {
        const es = this.enquirySource;
        if (!es) return '';
        const TYPE_LABEL = {
          curtain: 'Curtains', sheer: 'Sheer curtains', velvet: 'Velvet / heavy curtains',
          'roller-block': 'Roller blinds (blockout)', 'roller-sun': 'Roller blinds (sunscreen)',
          roman: 'Roman blinds', pelmet: 'Pelmets', swags: 'Swags & tails',
          valance: 'Valance', unsure: 'Not sure / other',
        };
        const TIER_LABEL = { short: 'under 2.4m', medium: '2.4–3.8m', tall: 'over 3.8m' };
        const OBS_LABEL = {
          mould: 'Mould', smoke: 'Smoke damage', water: 'Water marks / stains',
          sun: 'Sun damage / fading', pet_hair: 'Pet hair', heavily_stained: 'Heavily stained',
          fraying: 'Fraying / wear', other: 'Other',
        };
        const fields = [];
        if (es.property_type) fields.push(`<span><strong>Property:</strong> ${escapeHtml(es.property_type)}</span>`);
        if (es.contact_time) fields.push(`<span><strong>Best time:</strong> ${escapeHtml(es.contact_time)}</span>`);
        if (es.contact_method) fields.push(`<span><strong>Prefers:</strong> ${escapeHtml(es.contact_method)}</span>`);

        const obs = (es.observation_ticks || []).map((k) => OBS_LABEL[k] || k);
        const rating = (es.customer_rating != null) ? es.customer_rating : null;

        // Hardware requests
        const HW_LABEL = {
          'track-replace': 'Track replacement', 'track-service': 'Service track',
          'track-parts': 'Track part replacements', 'cord-replace': 'Replace cord',
          'blind-parts': 'Blind parts replacement',
        };
        const hwItems = (es.hardware || []).map((hw) => {
          if (hw.key === 'other') return escapeHtml(hw.note || 'Other');
          const parts = [HW_LABEL[hw.key] || hw.key];
          if (hw.width) parts.push('width ' + escapeHtml(hw.width));
          if (hw.note) parts.push(escapeHtml(hw.note));
          return parts.join(' — ');
        });
        const hwHtml = hwItems.length
          ? `<div class="es-room"><div class="es-room-name">Hardware requests</div><ul class="es-items">${hwItems.map((s) => '<li>' + s + '</li>').join('')}</ul></div>` : '';

        const roomsHtml = (es.rooms || []).map((r, ri) => {
          const items = (r.items || []).map((it) => {
            const dims = [];
            if (it.width) dims.push(`W ${escapeHtml(it.width)}`);
            if (it.heightMode === 'tier' && it.tier) dims.push(`H ${TIER_LABEL[it.tier] || it.tier} (est)`);
            else if (it.height) dims.push(`H ${escapeHtml(it.height)}`);
            const extras = [];
            if (it.mould) extras.push('mould treatment');
            if (it.note) extras.push(it.note);
            return `<li><strong>${escapeHtml(TYPE_LABEL[it.type] || it.type)}</strong>${dims.length ? ' — ' + dims.join(' × ') : ''}${extras.length ? ' <span style="color:var(--muted)">(' + extras.join('; ') + ')</span>' : ''}</li>`;
          }).join('');
          const ph = (r.photos || []);
          return `
            <div class="es-room">
              <div class="es-room-name">${escapeHtml(r.name || 'Room ' + (ri + 1))}</div>
              ${items ? `<ul class="es-items">${items}</ul>` : ''}
              ${ph.length ? `<div class="es-photos" data-espaths='${escapeAttr(JSON.stringify(ph))}'>${ph.map((_, i) => `<div class="es-thumb" data-esi="${ri}-${i}">photo</div>`).join('')}</div>` : ''}
            </div>`;
        }).join('');
        const overall = (es.photos || []);
        const overallHtml = overall.length ? `
          <div class="es-room">
            <div class="es-room-name">Overall photos</div>
            <div class="es-photos" data-espaths='${escapeAttr(JSON.stringify(overall))}'>${overall.map((_, i) => `<div class="es-thumb" data-esi="overall-${i}">photo</div>`).join('')}</div>
          </div>` : '';

        const submitted = es.submitted_at ? new Date(es.submitted_at).toLocaleString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
        return `
          <details class="es-panel" open>
            <summary>📋 Customer enquiry${submitted ? ' · submitted ' + escapeHtml(submitted) : ''}</summary>
            <div class="es-body">
              ${fields.length ? `<div class="es-fields">${fields.join('')}</div>` : ''}
              ${rating != null ? `<div class="es-rating">Customer's condition rating: <strong>${rating}/10</strong></div>` : ''}
              ${obs.length ? `<div class="es-obs"><strong>Customer observations:</strong> ${obs.map(escapeHtml).join(', ')}</div>` : ''}
              ${es.description ? `<div class="es-desc">${escapeHtml(es.description)}</div>` : ''}
              ${hwHtml}
              ${roomsHtml}
              ${overallHtml}
            </div>
          </details>`;
      },

      // Load signed URLs for the enquiry-source photo thumbnails.
      async loadEnquirySourcePhotos() {
        if (!this.enquirySource) return;
        document.querySelectorAll('.es-photos[data-espaths]').forEach(async (wrap) => {
          let photos = [];
          try { photos = JSON.parse(wrap.dataset.espaths); } catch (_) { return; }
          const thumbs = wrap.querySelectorAll('.es-thumb');
          photos.forEach(async (p, i) => {
            try {
              const url = await db.photoUrl(p.path || p);
              if (thumbs[i]) {
                const img = document.createElement('img');
                img.src = url; img.className = 'es-thumb';
                img.style.cursor = 'pointer';
                img.addEventListener('click', () => window.open(url, '_blank'));
                thumbs[i].replaceWith(img);
              }
            } catch (_) {}
          });
        });
      },

      render() {
        const mount = $('#qb-mount');
        if (!mount) return;
        const q = this.q;
        const totals = computeQuote(q);

        const roomsHtml = q.rooms.map((room, ri) => this.roomHtml(room, ri)).join('');
        const jobRepairs = q.repairs.map((r, i) => this.repairRowHtml(r, i, null)).join('');

        mount.innerHTML = `
          ${this.enquirySourceHtml()}
          <div class="qb-insurer">
            <div class="field"><label>Insurer (optional)</label><input id="qb-insurer" value="${escapeAttr(q.insurer_name)}" placeholder="e.g. AAMI" /></div>
            <div class="field"><label>Claim number (optional)</label><input id="qb-claim" value="${escapeAttr(q.claim_number)}" placeholder="CLM-…" /></div>
          </div>

          <div class="qb-block-title">Rooms & items</div>

          <div class="qb-add-row"><button class="qb-add" data-addjobrepair="1">+ Whole-job repair</button></div>

          <div class="qb-block-title">Extras</div>
          <label class="qb-fuel-toggle"><input type="checkbox" id="qb-fuel-on" ${q.extras.fuel_on ? 'checked' : ''}/> Apply fuel levy</label>
          <div class="qb-extras">
            <div class="field"><label>Fuel ($)</label><input id="qb-fuel_amt" type="number" step="0.01" value="${escapeAttr(q.extras.fuel_amt)}" ${q.extras.fuel_on ? '' : 'disabled'} /></div>
            <div class="field"><label>Transport ($)</label><input id="qb-transport" type="number" step="0.01" value="${escapeAttr(q.extras.transport)}" /></div>
            <div class="field"><label>Rehang ($)</label><input id="qb-rehang" type="number" step="0.01" value="${escapeAttr(q.extras.rehang)}" /></div>
            <div class="field"><label>Call-out ($)</label><input id="qb-callout" type="number" step="0.01" value="${escapeAttr(q.extras.callout)}" /></div>
