            <div class="field" style="grid-column:span 2"><label>Other description</label><input id="qb-other_desc" value="${escapeAttr(q.extras.other_desc)}" placeholder="What the 'other' charge is for" /></div>
          </div>

          <div class="qb-block-title">Discount</div>
          <div class="qb-discount">
            <div class="field"><label>Type</label>
              <select id="qb-disc-type">
                <option value="none" ${q.discount.type === 'none' ? 'selected' : ''}>None</option>
                <option value="percent" ${q.discount.type === 'percent' ? 'selected' : ''}>Percent (%)</option>
                <option value="fixed" ${q.discount.type === 'fixed' ? 'selected' : ''}>Fixed ($)</option>
              </select>
            </div>
            <div class="field"><label>Value</label><input id="qb-disc-value" type="number" step="0.01" value="${escapeAttr(q.discount.value)}" ${q.discount.type === 'none' ? 'disabled' : ''} /></div>
          </div>

          <div class="qb-block-title">Quote notes (appear on the quote)</div>
          <div class="field"><textarea id="qb-notes" rows="2">${escapeHtml(q.notes)}</textarea></div>

          <div class="qb-totals" id="qb-totals">${this.totalsHtml(totals)}</div>

          <label class="qb-fuel-toggle" style="margin-top:16px"><input type="checkbox" id="qb-show-rates" ${q.show_rates ? 'checked' : ''}/> Show rates on quote PDF (off = line prices only)</label>
          <div class="qb-actions"><button class="btn btn-save-quote" id="qb-save">Save Quote</button><button class="btn btn-secondary" id="qb-pdf">Download PDF</button><button class="btn btn-email" id="qb-email">Send Quote Email</button>${this.followUpBtnHtml()}</div>
          <div id="qb-emaillog">${this.emailLogHtml()}</div>
        `;
        this.wire();
        this.loadEnquirySourcePhotos();
      },

      totalsHtml(t) {
        return `
          ${t.discountAmt > 0 ? `<div class="row"><span class="lbl">Subtotal (pre-discount)</span><span class="val">${money(t.preDiscount)}</span></div>
          <div class="row disc"><span class="lbl">Discount</span><span class="val">− ${money(t.discountAmt)}</span></div>` : ''}
          <div class="row"><span class="lbl">Subtotal (ex GST)</span><span class="val">${money(t.subtotal)}</span></div>
          <div class="row"><span class="lbl">GST (10%)</span><span class="val">${money(t.gst)}</span></div>
          <div class="row grand"><span>Total (inc GST)</span><span>${money(t.total)}</span></div>`;
      },

      roomHtml(room, ri) {
        let roomSub = 0;
        (room.items || []).forEach((l) => { roomSub += computeLine(l).amount; });
        (room.repairs || []).forEach((r) => { roomSub += computeRepair(r).amount; });
        const items = (room.items || []).map((l, i) => this.lineRowHtml(l, i, ri)).join('');
        const reps = (room.repairs || []).map((r, i) => this.repairRowHtml(r, i, ri)).join('');
        return `
          <div class="qb-room" data-room="${ri}">
            <div class="qb-room-head">
              <input class="room-name" value="${escapeAttr(room.name)}" placeholder="Room name (e.g. Lounge)" />
              <span class="qb-room-subtotal">${money(roomSub)}</span>
              <button class="qb-room-del" data-delroom="${ri}">Remove room</button>
            </div>
            <div class="qb-room-body">
              <div class="qb-lines">${items || '<div class="placeholder-note">No items in this room yet.</div>'}</div>
              ${reps ? `<div class="qb-lines">${reps}</div>` : ''}
              <div class="qb-room-add">
                <button class="qb-add" data-roomadd="${ri}" data-cat="curtain">+ Curtain</button>
                <button class="qb-add" data-roomadd="${ri}" data-cat="sheer">+ Sheer</button>
                <button class="qb-add" data-roomadd="${ri}" data-cat="velvet">+ Velvet/Silk</button>
                <button class="qb-add" data-roomadd="${ri}" data-cat="roman">+ Blind</button>
                <button class="qb-add" data-roomadd="${ri}" data-cat="pelmet">+ Pelmet/Swag/Valance</button>
                <button class="qb-add" data-roomadd="${ri}" data-cat="custom">+ Custom</button>
                <button class="qb-add" data-roomrepair="${ri}">+ Repair</button>
              </div>
            </div>
          </div>`;
      },

      // line within a room (roomIdx set) — custom items render differently
      lineRowHtml(line, i, roomIdx) {
        const di = `data-i="${i}" data-room="${roomIdx}"`;
        if (line.cat === 'custom') {
          const calc = computeLine(line);
          return `
            <div class="qb-line" style="grid-template-columns:2fr 1fr auto auto" ${di}>
              <div><span class="mini-label">Custom item — description</span><input class="qb-clabel" value="${escapeAttr(line.label)}" placeholder="e.g. Oversized specialty blind" /></div>
              <div><span class="mini-label">Amount ($ ex GST)</span><input class="qb-camount" type="number" step="0.01" value="${escapeAttr(line.amount)}" /></div>
              <div><div class="line-amt">${money(calc.amount)}</div><div class="line-basis">Custom</div></div>
              <button class="qb-del" data-del="${i}" data-room="${roomIdx}" title="Remove">×</button>
            </div>`;
        }
        const calc = computeLine(line);
        const catOpts = Object.keys(CATALOG).map((k) =>
          `<option value="${k}" ${line.cat === k ? 'selected' : ''}>${CATALOG[k].label}</option>`).join('');
        const cat = CATALOG[line.cat] || {};
        const isBlind = cat.mode === 'blind';
        const needsDrop = ['curtain', 'sheer', 'velvet', 'blind'].includes(cat.mode);
        const rateLabel = isBlind ? 'Rate ($/m²)' : 'Rate ($/m)';
        // Field shows the effective rate (override if set, else standard tier rate).
        const rateVal = calc.isOverride ? line.rate_override : calc.stdRate;
        return `
          <div class="qb-line" style="grid-template-columns:1.4fr 1fr 0.85fr 0.85fr 0.8fr auto auto auto" ${di}>
            <div><span class="mini-label">Item</span><select class="qb-cat">${catOpts}</select></div>
            <div><span class="mini-label">Note (optional)</span><input class="qb-note" value="${escapeAttr(line.item_note)}" placeholder="e.g. heavy soiling" /></div>
            <div><span class="mini-label">Width (m/mm)</span><input class="qb-width" value="${escapeAttr(line.width)}" placeholder="2.4 or 2400" />${line.customer_measured ? '<small class="cm-tag">customer-measured</small>' : ''}</div>
            <div><span class="mini-label">${needsDrop ? 'Drop (m/mm)' : '—'}</span><input class="qb-drop" value="${escapeAttr(line.drop)}" placeholder="2.4 or 2400" ${needsDrop ? '' : 'disabled'} />${line.customer_tier ? '<small class="cm-tag">tier estimate</small>' : ''}</div>
            <div class="qb-rate-wrap"><span class="mini-label">${rateLabel}</span>
              <input class="qb-rate ${calc.isOverride ? 'override' : ''}" type="number" step="0.01" value="${escapeAttr(rateVal)}" />
              ${calc.isOverride ? '<span class="qb-rate-reset" data-resetrate>reset</span>' : ''}
            </div>
            <label class="qb-mould"><input type="checkbox" class="qb-mould-cb" ${line.mould ? 'checked' : ''}/> Mould Treatment</label>
            <div><div class="line-amt">${money(calc.amount)}</div><div class="line-basis">${calc.basis || ''}${calc.mouldAmt ? ' + mould treatment ' + money(calc.mouldAmt) : ''}</div></div>
            <button class="qb-del" data-del="${i}" data-room="${roomIdx}" title="Remove">×</button>
          </div>`;
      },

      // repair row; roomIdx null = whole-job repair, else inside that room
      repairRowHtml(r, i, roomIdx) {
        const calc = computeRepair(r);
        const opts = REPAIRS.map(([k, lbl]) =>
          `<option value="${k}" ${r.key === k ? 'selected' : ''}>${lbl}</option>`).join('');
        const scope = roomIdx === null ? 'data-jr="1"' : `data-rr="${roomIdx}"`;
        const rateVal = calc.isOverride ? r.rate_override : calc.stdRate;
        return `
          <div class="qb-line repair" style="grid-template-columns:1.6fr 0.7fr 0.9fr 1fr auto" data-ri="${i}" ${scope}>
            <div><span class="mini-label">Repair / hardware</span><select class="qb-rkey">${opts}</select></div>
            <div><span class="mini-label">Qty</span><input class="qb-rqty" type="number" min="0" value="${escapeAttr(r.qty)}" /></div>
            <div class="qb-rate-wrap"><span class="mini-label">Rate ($)</span>
              <input class="qb-rrate ${calc.isOverride ? 'override' : ''}" type="number" step="0.01" value="${escapeAttr(rateVal)}" />
              ${calc.isOverride ? '<span class="qb-rate-reset" data-resetrrate>reset</span>' : ''}
            </div>
            <div><div class="line-amt">${money(calc.amount)}</div><div class="line-basis">${calc.qty} × $${calc.rateUsed}</div></div>
            <button class="qb-del" ${roomIdx === null ? `data-deljr="${i}"` : `data-delrr="${roomIdx}" data-rri="${i}"`} title="Remove">×</button>
          </div>`;
      },

      wire() {
        const q = this.q;

        // add room
        $('#qb-add-room').addEventListener('click', () => {
          q.rooms.push({ name: 'Room ' + (q.rooms.length + 1), items: [], repairs: [] });
          this.render();
        });

        // room name edits + remove room
        document.querySelectorAll('.qb-room').forEach((rd) => {
          const ri = +rd.dataset.room;
          rd.querySelector('.room-name').addEventListener('input', (e) => { q.rooms[ri].name = e.target.value; });
          rd.querySelector('[data-delroom]').addEventListener('click', () => {
            if (!confirm('Remove this room and its items?')) return;
            q.rooms.splice(ri, 1); this.render();
          });
        });

        // add item to a room
        document.querySelectorAll('.qb-add[data-roomadd]').forEach((b) =>
          b.addEventListener('click', () => {
            const ri = +b.dataset.roomadd, cat = b.dataset.cat;
            if (cat === 'custom') q.rooms[ri].items.push({ cat: 'custom', label: '', amount: '' });
            else q.rooms[ri].items.push({ cat, item_note: '', width: '', drop: '', mould: false });
            this.render();
          }));

        // add repair to a room
        document.querySelectorAll('.qb-add[data-roomrepair]').forEach((b) =>
          b.addEventListener('click', () => {
            const ri = +b.dataset.roomrepair;
            q.rooms[ri].repairs.push({ key: REPAIRS[0][0], qty: 1 });
            this.render();
          }));

        // add whole-job repair
        const addJR = document.querySelector('[data-addjobrepair]');
        if (addJR) addJR.addEventListener('click', () => { q.repairs.push({ key: REPAIRS[0][0], qty: 1 }); this.render(); });

        // line edits inside rooms
        document.querySelectorAll('.qb-line[data-i]').forEach((row) => {
          const i = +row.dataset.i, ri = +row.dataset.room;
          const item = q.rooms[ri].items[i];
          const catSel = row.querySelector('.qb-cat');
          if (catSel) catSel.addEventListener('change', (e) => { q.rooms[ri].items[i].cat = e.target.value; this.render(); });
          const note = row.querySelector('.qb-note');
          if (note) note.addEventListener('input', (e) => { item.item_note = e.target.value; });
          const w = row.querySelector('.qb-width');
          if (w) w.addEventListener('input', (e) => { item.width = e.target.value; item.customer_measured = false; this.recalcRow(row, item); });
          const d = row.querySelector('.qb-drop');
          if (d) d.addEventListener('input', (e) => { item.drop = e.target.value; item.customer_measured = false; item.customer_tier = null; this.recalcRow(row, item); });
          const mc = row.querySelector('.qb-mould-cb');
          if (mc) mc.addEventListener('change', (e) => { item.mould = e.target.checked; this.recalcRow(row, item); });
          // rate override: typing sets a sticky override on this line only
          const rt = row.querySelector('.qb-rate');
          if (rt) rt.addEventListener('input', (e) => {
            item.rate_override = e.target.value;
            e.target.classList.add('override');
            this.recalcRow(row, item);
          });
          const rrst = row.querySelector('[data-resetrate]');
          if (rrst) rrst.addEventListener('click', () => { delete item.rate_override; this.render(); });
          // custom item fields
          const cl = row.querySelector('.qb-clabel');
          if (cl) cl.addEventListener('input', (e) => { item.label = e.target.value; });
          const ca = row.querySelector('.qb-camount');
          if (ca) ca.addEventListener('input', (e) => { item.amount = e.target.value; this.recalcRow(row, item); });
        });

        // room repair edits
        document.querySelectorAll('.qb-line.repair[data-rr]').forEach((row) => {
          const ri = +row.dataset.rr, i = +row.dataset.ri;
          row.querySelector('.qb-rkey').addEventListener('change', (e) => { q.rooms[ri].repairs[i].key = e.target.value; this.render(); });
          row.querySelector('.qb-rqty').addEventListener('input', (e) => { q.rooms[ri].repairs[i].qty = e.target.value; this.recalcTotalsOnly(); this.recalcRoomSubtotals(); });
          const rr = row.querySelector('.qb-rrate');
          if (rr) rr.addEventListener('input', (e) => { q.rooms[ri].repairs[i].rate_override = e.target.value; e.target.classList.add('override'); this.recalcRepairRow(row, q.rooms[ri].repairs[i]); this.recalcRoomSubtotals(); });
          const rst = row.querySelector('[data-resetrrate]');
          if (rst) rst.addEventListener('click', () => { delete q.rooms[ri].repairs[i].rate_override; this.render(); });
        });

        // whole-job repair edits
        document.querySelectorAll('.qb-line.repair[data-jr]').forEach((row) => {
          const i = +row.dataset.ri;
          row.querySelector('.qb-rkey').addEventListener('change', (e) => { q.repairs[i].key = e.target.value; this.render(); });
          row.querySelector('.qb-rqty').addEventListener('input', (e) => { q.repairs[i].qty = e.target.value; this.recalcTotalsOnly(); });
          const rr = row.querySelector('.qb-rrate');
          if (rr) rr.addEventListener('input', (e) => { q.repairs[i].rate_override = e.target.value; e.target.classList.add('override'); this.recalcRepairRow(row, q.repairs[i]); });
          const rst = row.querySelector('[data-resetrrate]');
          if (rst) rst.addEventListener('click', () => { delete q.repairs[i].rate_override; this.render(); });
        });

        // deletes
        document.querySelectorAll('[data-del]').forEach((b) =>
          b.addEventListener('click', () => { const ri = +b.dataset.room; q.rooms[ri].items.splice(+b.dataset.del, 1); this.render(); }));
        document.querySelectorAll('[data-delrr]').forEach((b) =>
          b.addEventListener('click', () => { q.rooms[+b.dataset.delrr].repairs.splice(+b.dataset.rri, 1); this.render(); }));
        document.querySelectorAll('[data-deljr]').forEach((b) =>
          b.addEventListener('click', () => { q.repairs.splice(+b.dataset.deljr, 1); this.render(); }));

        // extras
        const fuelOn = $('#qb-fuel-on');
        fuelOn.addEventListener('change', (e) => { q.extras.fuel_on = e.target.checked; this.render(); });
        ['fuel_amt', 'transport', 'rehang', 'callout', 'storage', 'other_amt', 'other_desc'].forEach((k) => {
          const el = $('#qb-' + k);
          if (el) el.addEventListener('input', (e) => { q.extras[k] = e.target.value; if (k !== 'other_desc') this.recalcTotalsOnly(); });
        });

        // discount
        $('#qb-disc-type').addEventListener('change', (e) => { q.discount.type = e.target.value; this.render(); });
        $('#qb-disc-value').addEventListener('input', (e) => { q.discount.value = e.target.value; this.recalcTotalsOnly(); });

        // meta
        $('#qb-insurer').addEventListener('input', (e) => { q.insurer_name = e.target.value; });
        $('#qb-claim').addEventListener('input', (e) => { q.claim_number = e.target.value; });
        $('#qb-notes').addEventListener('input', (e) => { q.notes = e.target.value; });
        $('#qb-show-rates').addEventListener('change', (e) => { q.show_rates = e.target.checked; });

        // save
        $('#qb-save').addEventListener('click', () => this.save());

        // download PDF (saves current state first so PDF matches what's on screen)
        $('#qb-pdf').addEventListener('click', async () => {
          const btn = $('#qb-pdf');
          btn.disabled = true; btn.textContent = 'Generating…';
          try {
            await this.save();
            const job = await db.getJob(this.jobId);
            quotePdf.download(job);
          } catch (err) {
            ui.toast('PDF failed: ' + (err.message || 'error'));
            console.error(err);
          } finally {
            btn.disabled = false; btn.textContent = 'Download PDF';
          }
        });

        // send quote email — saves first, then opens compose window
        $('#qb-email').addEventListener('click', async () => {
          const btn = $('#qb-email');
          btn.disabled = true; btn.textContent = 'Preparing…';
          try {
            await this.save();
            const job = await db.getJob(this.jobId);
            composeEmail.open(job, async () => { const fresh = await db.getJob(this.jobId); this.init(fresh); }); // re-fetch so the new log entry shows
          } catch (err) {
            ui.toast('Could not prepare email: ' + (err.message || 'error'));
            console.error(err);
          } finally {
            btn.disabled = false; btn.textContent = 'Send Quote Email';
          }
        });

        // follow up on an open quote — no save first, nothing here changes it
        const fuBtn = $('#qb-followup');
        if (fuBtn) fuBtn.addEventListener('click', async () => {
          fuBtn.disabled = true;
          try {
            const job = await db.getJob(this.jobId);
            followUpEmail.open(job, async () => { this.init(await db.getJob(this.jobId)); });
          } catch (err) {
            ui.toast('Could not prepare follow-up: ' + (err.message || 'error'));
            console.error(err);
          } finally { fuBtn.disabled = false; }
        });
      },

      recalcRow(row, item) {
        const calc = computeLine(item);
        row.querySelector('.line-amt').textContent = money(calc.amount);
        const basisEl = row.querySelector('.line-basis');
        if (basisEl) basisEl.textContent = item.cat === 'custom' ? 'Custom' : ((calc.basis || '') + (calc.mouldAmt ? ' + mould treatment ' + money(calc.mouldAmt) : ''));
        this.recalcTotalsOnly();
        this.recalcRoomSubtotals();
      },

      recalcRepairRow(row, r) {
        const calc = computeRepair(r);
        row.querySelector('.line-amt').textContent = money(calc.amount);
        const b = row.querySelector('.line-basis');
        if (b) b.textContent = `${calc.qty} × $${calc.rateUsed}`;
        this.recalcTotalsOnly();
      },

      recalcRoomSubtotals() {        document.querySelectorAll('.qb-room').forEach((rd) => {
          const ri = +rd.dataset.room;
          const room = this.q.rooms[ri];
          let s = 0;
          (room.items || []).forEach((l) => { s += computeLine(l).amount; });
          (room.repairs || []).forEach((r) => { s += computeRepair(r).amount; });
          const el = rd.querySelector('.qb-room-subtotal');
          if (el) el.textContent = money(s);
        });
      },

      recalcTotalsOnly() {
        const box = $('#qb-totals');
        if (box) box.innerHTML = this.totalsHtml(computeQuote(this.q));
      },

      // Follow-ups only make sense once the customer has something to respond
      // to, and only while the quote is still open.
      followUpBtnHtml() {
        const job = this.job;
        if (!job || job.status !== 'quoted' || !quoteSentAt(job)) return '';
        const due = followUpDue(job);
        return `<button class="btn btn-secondary" id="qb-followup">Send Follow-up${due ? ' · ' + escapeHtml(due.label) : ''}</button>`;
      },

      emailLogHtml() {
        const log = (this.q.email_log || []);
        if (!log.length) return '';
        const rows = log.slice().reverse().map((e) => {
          const when = e.sent_at ? new Date(e.sent_at).toLocaleString('en-AU', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
          return `<div class="log-row"><strong>${escapeHtml(when)}</strong> — sent to ${escapeHtml(e.to || '')}${e.cc ? ' (cc ' + escapeHtml(e.cc) + ')' : ''}</div>`;
        }).join('');
        // Every send lands in the log above, follow-ups included; this names
        // which of them were chases and how far up the ladder we've gone.
        const fu = followUpsOf(this.job || {});
        const fuLine = fu.length
          ? `<div class="log-row" style="margin-top:8px"><strong>Followed up ${fu.length}×</strong> — last was ${escapeHtml(followUpStage(fu[fu.length - 1].stage).label)}, ${escapeHtml(new Date(fu[fu.length - 1].sent_at).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' }))}${fu[fu.length - 1].sent_by ? ' by ' + escapeHtml(fu[fu.length - 1].sent_by) : ''}</div>`
          : '';
        return `<div class="email-log"><div class="qb-block-title" style="margin-top:0">Email history</div>${rows}${fuLine}</div>`;
      },

      async save() {
        const btn = $('#qb-save');
        btn.disabled = true; btn.textContent = 'Saving…';
        try {
          const totals = computeQuote(this.q);
          // persist computed amounts alongside inputs
          const rooms = this.q.rooms.map((room) => ({
            name: room.name,
            items: (room.items || []).map((l) => {
              if (l.cat === 'custom') return { ...l, amount: round2(l.amount) };
              const c = computeLine(l);
              return { ...l, amount: c.amount, sqm: c.sqm, rate_used: c.rateUsed, tier_label: c.tierLabel };
            }),
            repairs: (room.repairs || []).map((r) => { const c = computeRepair(r); return { ...r, amount: c.amount, rate_used: c.rateUsed }; }),
          }));
          const repairs = this.q.repairs.map((r) => { const c = computeRepair(r); return { ...r, amount: c.amount, rate_used: c.rateUsed }; });
          const quote = {
            ...this.q, rooms, repairs,
            subtotal: totals.subtotal, gst: totals.gst, total: totals.total,
            discount_amount: totals.discountAmt,
          };
          await db.saveJob(this.jobId, { quote });
          ui.toast('Quote saved · ' + money(totals.total));
        } catch (err) {
          ui.toast('Save failed: ' + (err.message || 'error'));
          console.error(err);
        } finally {
          btn.disabled = false; btn.textContent = 'Save Quote';
        }
      },
    };

    /* ============================================================
       REPORT PDF — branded summary for the chosen reporting period.
       ============================================================ */
    const reportPdf = {
      build(rep, meta) {
        const doc = new jsPDF({ unit: 'mm', format: 'a4' });
        const PW = 210, PH = 297, M = 16;
        const CW = PW - M * 2;
        let y = 16;
        const blue = BRAND.blue, pink = BRAND.pink, grey = [110, 110, 120], ink = [40, 40, 55];
        const line = (x1, y1, x2, y2, col = [220, 222, 232], w = 0.3) => {
          doc.setDrawColor(...col); doc.setLineWidth(w); doc.line(x1, y1, x2, y2);
        };
        const m0 = (n) => '$' + Math.round(Number(n || 0)).toLocaleString('en-AU');
        const pageBreak = (need) => {
          if (y + need > PH - 20) { doc.addPage(); y = 18; return true; }
          return false;
        };

        // ---------- HEADER ----------
        let logoBottom = y;
        try {
          const logoW = 52, logoH = logoW / BRAND.logoAspect;
          doc.addImage(BRAND.logo, 'PNG', M, y, logoW, logoH);
          logoBottom = y + logoH;
        } catch (_) {}
        doc.setFont('helvetica', 'bold'); doc.setFontSize(20); doc.setTextColor(...blue);
        doc.text('REPORT', PW - M, y + 6, { align: 'right' });
        doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(...grey);
        doc.text('Generated ' + fmtDate(new Date()), PW - M, y + 12, { align: 'right' });
        if (meta.generatedBy) doc.text(clip(meta.generatedBy, 34), PW - M, y + 16.5, { align: 'right' });

        y = logoBottom + 7;
        doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor(...blue);
        doc.text(meta.rangeLabel || '', M, y);
        y += 5;
        doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(...grey);
        doc.text(`${rep.cohortCount} quote${rep.cohortCount === 1 ? '' : 's'} raised in period   ·   ${meta.exclArchived ? 'archived excluded' : 'archived included'}`, M, y);
        y += 4;
        line(M, y, PW - M, y, pink, 0.8);
        y += 10;

        // ---------- SUMMARY TILES (two lenses) ----------
        const act = rep.act || { invoicedVal: 0, invoicedCount: 0, confirmedVal: 0, confirmedCount: 0, declinedVal: 0, declinedCount: 0 };
        const tileBand = (heading, note, tiles) => {
          doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(...blue);
          doc.text(heading, M, y);
          doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(...grey);
          doc.text(note, M + doc.getTextWidth(heading) * 1.02 + 3, y);
          y += 4.5;
          const n = tiles.length;
          const tw = (CW - (n - 1) * 3) / n, th = 22;
          tiles.forEach((t, i) => {
            const x = M + i * (tw + 3);
            doc.setFillColor(246, 247, 251); doc.rect(x, y, tw, th, 'F');
            doc.setDrawColor(...blue); doc.setLineWidth(0.7); doc.line(x, y, x + tw, y);
            doc.setFont('helvetica', 'bold'); doc.setFontSize(6.5); doc.setTextColor(...grey);
            doc.text(t[0], x + 2.5, y + 5.5);
            doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(...blue);
            doc.text(clip(t[1], 12), x + 2.5, y + 13.5);
            doc.setFont('helvetica', 'normal'); doc.setFontSize(6.5); doc.setTextColor(...grey);
            doc.text(clip(t[2], 30), x + 2.5, y + 18.5);
          });
          y += th + 9;
        };

        tileBand('MONEY IN THIS PERIOD', '(dated to when it happened)', [
          ['INVOICED', m0(act.invoicedVal), `${act.invoicedCount} job${act.invoicedCount === 1 ? '' : 's'} invoiced`],
          ['CONFIRMED', m0(act.confirmedVal), `${act.confirmedCount} job${act.confirmedCount === 1 ? '' : 's'} accepted`],
          ['LOST', m0(act.declinedVal), `${act.declinedCount} quote${act.declinedCount === 1 ? '' : 's'} declined`],
        ]);

        tileBand('QUOTES RAISED IN THIS PERIOD', '(dated to the quote)', [
          ['QUOTED', m0(rep.quotedVal), `${rep.quotedCount} quote${rep.quotedCount === 1 ? '' : 's'} raised`],
          ['WIN RATE', rep.winRate + '%', `${rep.wonCount} won / ${rep.declinedCount} lost`],
          ['AVG QUOTE', m0(rep.avgQuote), 'per quote raised'],
        ]);
        y += 3;

        // ---------- generic table renderer ----------
        const table = (title, headers, aligns, widths, rows, emptyMsg) => {
          pageBreak(26);
          doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(...blue);
          doc.text(title, M, y); y += 4.5;
          line(M, y, PW - M, y, blue, 0.5); y += 5;

          const xs = []; let acc = M;
          widths.forEach((w) => { xs.push(acc); acc += w; });

          doc.setFont('helvetica', 'bold'); doc.setFontSize(7.5); doc.setTextColor(...grey);
          headers.forEach((h, i) => {
            const x = aligns[i] === 'right' ? xs[i] + widths[i] : xs[i];
            doc.text(h, x, y, { align: aligns[i] === 'right' ? 'right' : 'left' });
          });
          y += 2; line(M, y, PW - M, y); y += 4.5;

          if (!rows.length) {
            doc.setFont('helvetica', 'italic'); doc.setFontSize(8.5); doc.setTextColor(...grey);
            doc.text(emptyMsg || 'No data in this period', M, y);
            y += 11; return;
          }
          doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(...ink);
          rows.forEach((r) => {
            if (pageBreak(10)) {
              doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(...ink);
            }
            r.forEach((cell, i) => {
              const x = aligns[i] === 'right' ? xs[i] + widths[i] : xs[i];
              doc.text(String(cell), x, y, { align: aligns[i] === 'right' ? 'right' : 'left' });
            });
            y += 3.5; line(M, y, PW - M, y, [238, 239, 246], 0.2); y += 4;
          });
          y += 6;
        };

        // ---------- BY STAFF ----------
        table('By staff', ['STAFF', 'QUOTES', 'QUOTED', 'CONFIRMED', 'CONV.'],
          ['left', 'right', 'right', 'right', 'right'], [58, 24, 34, 34, 28],
          rep.staffRows.map(([who, s]) => {
            const decided = s.wonCount + s.declinedCount;
            const conv = decided > 0 ? Math.round(s.wonCount / decided * 100) : 0;
            return [clip(firstName(who), 22), s.count, m0(s.quotedVal), m0(s.confirmedVal), conv + '%'];
          }), 'No jobs in this period');

        // ---------- BY STATUS ----------
        const stKnown = STATUSES.concat(['declined']);
        const stAll = stKnown.concat(Object.keys(rep.byStatus).filter((s) => !stKnown.includes(s)).sort());
        table('By status (quotes raised in period)', ['STATUS', 'JOBS'], ['left', 'right'], [140, 38],
          stAll.filter((st) => rep.byStatus[st])
            .map((st) => [STATUS_LABEL[st] || (st.charAt(0).toUpperCase() + st.slice(1)), rep.byStatus[st]])
            .concat([['Total', rep.cohortCount]]),
          'No jobs in this period');

        // ---------- TOP CUSTOMERS ----------
        table('Top customers by quoted value', ['CUSTOMER', 'QUOTED'], ['left', 'right'], [140, 38],
          rep.topCustomers.map(([n, v]) => [clip(n, 52), m0(v)]),
          'No jobs in this period');

        // ---------- DECLINE REASONS ----------
        const REASON_LABEL = Object.fromEntries(DECLINE_REASONS);
        table('Decline reasons', ['REASON', 'COUNT', '$ LOST'], ['left', 'right', 'right'], [110, 30, 38],
          rep.reasonRows.map(([r, o]) => [REASON_LABEL[r] || r, o.count, m0(o.val)]),
          'No declines in this period');

        // ---------- FOOTER on every page ----------
        const pages = doc.getNumberOfPages();
        for (let p = 1; p <= pages; p++) {
          doc.setPage(p);
          doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(...grey);
          doc.text('Dr Drapes Curtain Clinic   ·   1300 652 866   ·   drdrapes@hudsongroup.com.au', M, PH - 10);
          doc.text(`Page ${p} of ${pages}`, PW - M, PH - 10, { align: 'right' });
        }
        return doc;
      },

      download(rep, meta) {
        this.build(rep, meta).save(meta.filename || 'Drapr_Report.pdf');
      },
    };

    /* ============================================================
       QUOTE PDF  (jsPDF, real text — sharp & selectable)
       Layout: header (logo + DRD ref) → customer/site → insurer
       (if any) → quote grouped by room → repairs → extras →
       totals → notes → page 2: full terms of trade.
       Prints only the final rate used per line (no standard rate).
       ============================================================ */
    const quotePdf = {
      build(job) {
        const d = job.data || {};
        const q = d.quote || {};
        const doc = new jsPDF({ unit: 'mm', format: 'a4' });
        const PW = 210, M = 16;          // page width, margin
        const CW = PW - M * 2;           // content width
        let y = 16;

        const blue = BRAND.blue, pink = BRAND.pink, grey = [110, 110, 120], ink = [40, 40, 55];
        const line = (x1, y1, x2, y2, col = [220, 222, 232], w = 0.3) => {
          doc.setDrawColor(...col); doc.setLineWidth(w); doc.line(x1, y1, x2, y2);
        };

        // ---------- HEADER ----------
        let logoBottom = y;
        try {
          const logoW = 52, logoH = logoW / BRAND.logoAspect;
          doc.addImage(BRAND.logo, 'PNG', M, y, logoW, logoH);
          logoBottom = y + logoH;
        } catch (_) { /* if image fails, skip silently */ }
        // Right-aligned quote meta
        doc.setFont('helvetica', 'bold'); doc.setFontSize(22); doc.setTextColor(...blue);
        doc.text('QUOTE', PW - M, y + 6, { align: 'right' });
        doc.setFontSize(11); doc.setTextColor(...ink);
        doc.text(job.quote_number || '', PW - M, y + 13, { align: 'right' });
        doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(...grey);
        doc.text(fmtDate(new Date()), PW - M, y + 18, { align: 'right' });
        if (job.data?.po_number) { doc.text('PO: ' + clip(job.data.po_number, 28), PW - M, y + 23, { align: 'right' }); }

        // Contact line — bold, under the logo, above the divider (logo already shows the name)
        let cinfoY = logoBottom + 6;
        doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(...blue);
        doc.text('1300 652 866   ·   drdrapes@hudsongroup.com.au', M, cinfoY);

        y = cinfoY + 5;
        line(M, y, PW - M, y, pink, 0.8);
        y += 9;

        // ---------- CUSTOMER ----------
        doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(...blue);
        doc.text('QUOTE FOR', M, y);
        doc.setFont('helvetica', 'normal'); doc.setTextColor(...ink); doc.setFontSize(10);
        doc.text(job.customer_name || '', M, y + 5);
        let cy = y + 5;
        if (job.site_address) { cy += 4.5; doc.setFontSize(9); doc.setTextColor(...grey); doc.text(clip(job.site_address, 70), M, cy); }
        if (job.customer_phone) { cy += 4.5; doc.text(job.customer_phone, M, cy); }

        y = cy + 9;

        // ---------- INSURER (if present) ----------
        if (q.insurer_name || q.claim_number) {
          doc.setFillColor(245, 246, 250); doc.rect(M, y - 4, CW, 10, 'F');
          doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(...blue);
          doc.text('INSURANCE', M + 3, y + 2);
          doc.setFont('helvetica', 'normal'); doc.setTextColor(...ink);
          const parts = [];
          if (q.insurer_name) parts.push('Insurer: ' + q.insurer_name);
          if (q.claim_number) parts.push('Claim: ' + q.claim_number);
          doc.text(parts.join('     '), M + 28, y + 2);
          y += 12;
        }

        // ---------- INTRO ----------
        const intro = session.settings['email-intro'];
        if (intro) {
          doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(...ink);
          const lines = doc.splitTextToSize(intro, CW);
          doc.text(lines, M, y); y += lines.length * 4.6 + 4;
        }

        // ---------- LINE ITEMS BY ROOM ----------
        const showRates = q.show_rates !== false;
        const col = { item: M, detail: M + 64, rate: PW - M - 52, amt: PW - M };
        const headerRow = () => {
          doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); doc.setTextColor(...grey);
          doc.text('ITEM', col.item, y);
          doc.text('DETAIL', col.detail, y);
          if (showRates) doc.text('RATE', col.rate, y, { align: 'right' });
          doc.text('AMOUNT', col.amt, y, { align: 'right' });
          y += 2; line(M, y, PW - M, y); y += 4.5;

        const ensureSpace = (need) => {
          if (y + need > 270) { doc.addPage(); y = 20; }

          doc.text(room.name || 'Room', M, y); y += 5;

          doc.setFont('helvetica', 'normal'); doc.setTextColor(...ink); doc.setFontSize(9.5);

          (room.items || []).forEach((it) => {
            ensureSpace(8);
            const label = it.cat === 'custom' ? (it.label || 'Custom item') : (CATALOG[it.cat]?.label || it.cat);
            const calc = computeLine(it);
            // detail + rate strings (final rate only — never the standard rate)
            let detail = '', rateStr = '';
            if (it.cat === 'custom') { detail = it.item_note || ''; rateStr = ''; }
            else {
              const isBlind = CATALOG[it.cat]?.mode === 'blind';
              const needsDrop = ['curtain', 'sheer', 'velvet', 'blind'].includes(CATALOG[it.cat]?.mode);
              if (isBlind) {
                detail = `${calc.widthM.toFixed(2)}m W × ${calc.dropM.toFixed(2)}m H = ${calc.sqm} m²`;
                rateStr = '$' + calc.rateUsed + '/m²';
              } else if (needsDrop) {
                detail = `${calc.widthM.toFixed(2)}m W × ${calc.dropM.toFixed(2)}m H`;
                rateStr = '$' + calc.rateUsed + '/m';
              } else {
                detail = `${calc.widthM.toFixed(2)}m W`;
                rateStr = '$' + calc.rateUsed + '/m';
              }
              if (it.item_note) detail += '  ·  ' + it.item_note;
              if (it.mould) detail += '  ·  incl. mould treatment';
            }
            // Detail wraps within the space before the RATE column (or AMOUNT if rates hidden).
            const detailRight = showRates ? (col.rate - 14) : (col.amt - 14);
            const detailMaxW = detailRight - col.detail;
            doc.setFontSize(8.5);
            const detailLines = doc.splitTextToSize(detail, detailMaxW);
            const rowH = Math.max(6, detailLines.length * 4 + 2);
            ensureSpace(rowH);

            doc.setFontSize(9.5); doc.setTextColor(...ink);
            doc.text(clip(label, 32), col.item, y);
            doc.setFontSize(8.5); doc.setTextColor(...grey);
            doc.text(detailLines, col.detail, y);
            doc.setFontSize(9.5); doc.setTextColor(...ink);
            if (showRates && rateStr) doc.text(rateStr, col.rate, y, { align: 'right' });
            doc.text(money(calc.amount), col.amt, y, { align: 'right' });
            y += rowH;
          });

          (room.repairs || []).forEach((r) => {
            ensureSpace(8);
            const calc = computeRepair(r);
            const lbl = (REPAIRS.find(([k]) => k === r.key) || [null, r.key])[1];
            doc.text(clip(lbl, 34), col.item, y);
            doc.setFontSize(8.5); doc.setTextColor(...grey);
            doc.text(`qty ${calc.qty}`, col.detail, y);
            doc.setFontSize(9.5); doc.setTextColor(...ink);
            if (showRates) doc.text('$' + calc.rateUsed, col.rate, y, { align: 'right' });
            doc.text(money(calc.amount), col.amt, y, { align: 'right' });
            y += 6;
          });
          y += 3;
        });

        // whole-job repairs
        if ((q.repairs || []).length) {
          ensureSpace(16);
          doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(...blue);
          doc.text('Repairs & Hardware', M, y); y += 5;
          headerRow();
          doc.setFont('helvetica', 'normal'); doc.setTextColor(...ink); doc.setFontSize(9.5);
          (q.repairs || []).forEach((r) => {
            ensureSpace(8);
            const calc = computeRepair(r);
            const lbl = (REPAIRS.find(([k]) => k === r.key) || [null, r.key])[1];
            doc.text(clip(lbl, 34), col.item, y);
            doc.setFontSize(8.5); doc.setTextColor(...grey);
            doc.text(`qty ${calc.qty}`, col.detail, y);
            doc.setFontSize(9.5); doc.setTextColor(...ink);
            if (showRates) doc.text('$' + calc.rateUsed, col.rate, y, { align: 'right' });
            doc.text(money(calc.amount), col.amt, y, { align: 'right' });
            y += 6;
          });
          y += 3;
        }

        // ---------- EXTRAS ----------
        const ex = q.extras || {};
        const extraRows = [];
        if (ex.fuel_on && Number(ex.fuel_amt)) extraRows.push(['Fuel levy', ex.fuel_amt]);
        [['transport', 'Transport'], ['rehang', 'Rehang'], ['callout', 'Call-out'], ['storage', 'Storage']].forEach(([k, l]) => {
          if (Number(ex[k])) extraRows.push([l, ex[k]]);
        });
        if (Number(ex.other_amt)) extraRows.push([ex.other_desc || 'Other', ex.other_amt]);
        if (extraRows.length) {
          ensureSpace(10 + extraRows.length * 6);
          doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(...blue);
          doc.text('Extras', M, y); y += 5; line(M, y, PW - M, y); y += 4.5;
          doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(...ink);
          extraRows.forEach(([l, v]) => {
            doc.text(clip(l, 50), col.item, y);
            doc.text(money(v), col.amt, y, { align: 'right' });
            y += 6;
          });
          y += 3;
        }

        // ---------- TOTALS ----------
        const t = computeQuote(q);
        ensureSpace(34);
        const boxX = PW - M - 78, boxW = 78;
        line(boxX, y, PW - M, y); y += 6;
        doc.setFontSize(10); doc.setTextColor(...ink);
        const totLine = (lbl, val, bold) => {
          doc.setFont('helvetica', bold ? 'bold' : 'normal');
          doc.text(lbl, boxX, y); doc.text(val, PW - M, y, { align: 'right' }); y += 6;
        };
        if (t.discountAmt > 0) {
          totLine('Subtotal', money(t.preDiscount));
          doc.setTextColor(...pink); totLine('Discount', '- ' + money(t.discountAmt)); doc.setTextColor(...ink);
        }
        totLine('Subtotal (ex GST)', money(t.subtotal));
        totLine('GST (10%)', money(t.gst));
        // divider sits cleanly between GST and the total, full width of the totals box
        doc.setDrawColor(...blue); doc.setLineWidth(0.5);
        doc.line(boxX, y - 1, PW - M, y - 1);
        y += 3;
        doc.setFontSize(13); doc.setTextColor(...blue);
        totLine('TOTAL (inc GST)', money(t.total), true);

        // ---------- NOTES ----------
        if (q.notes) {
          ensureSpace(20); y += 2;
          doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(...blue);
          doc.text('Notes', M, y); y += 5;
          doc.setFont('helvetica', 'normal'); doc.setTextColor(...ink); doc.setFontSize(9.5);
          const nl = doc.splitTextToSize(q.notes, CW);
          doc.text(nl, M, y); y += nl.length * 4.6;
        }

        // ---------- OUTRO ----------
        const outro = session.settings['email-outro'];
        if (outro) {
          ensureSpace(24); y += 4;
          doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(...grey);
          const ol = doc.splitTextToSize(outro, CW);
          doc.text(ol, M, y); y += ol.length * 4.2;
        }

        // ---------- PAGE 2: TERMS (two balanced columns, sized to fill) ----------
        const terms = session.settings['terms-text'];
        if (terms) {
          doc.addPage();
          let ty = 18;
          doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(...blue);
          doc.text('Terms of Trade & Cleaning Disclaimer', M, ty); ty += 6;
          line(M, ty, PW - M, ty, pink, 0.6); ty += 5;

          const gap = 8;
          const colW = (CW - gap) / 2;
          const colX = [M, M + colW + gap];
          const startY = ty;
          const colBottom = 286;
          const available = colBottom - startY;     // mm of vertical space per column
          const paras = terms.split(/\n/);

          // Find the largest font size where the text fits in two balanced columns.
          // lineH scales with font size; we want total lines × lineH ≈ 2 × available.
          let chosen = { fs: 6.6, lineH: 2.9, lines: [] };
          for (let fs = 9.5; fs >= 6.5; fs -= 0.1) {
            doc.setFontSize(fs);
            const lineH = fs * 0.42;               // mm per line (≈ leading)
            const wrapped = [];
            paras.forEach((p) => {
              if (p.trim() === '') { wrapped.push(''); return; }
              doc.splitTextToSize(p, colW).forEach((l) => wrapped.push(l));
            });
            const linesPerCol = Math.floor(available / lineH);
            if (wrapped.length <= linesPerCol * 2) {
              chosen = { fs, lineH, lines: wrapped, linesPerCol };
              break;
            }
          }
          if (!chosen.lines.length) {
            // fallback at min size
            doc.setFontSize(6.5);
            const lineH = 6.5 * 0.42;
            const wrapped = [];
            paras.forEach((p) => { if (p.trim() === '') { wrapped.push(''); return; } doc.splitTextToSize(p, colW).forEach((l) => wrapped.push(l)); });
            chosen = { fs: 6.5, lineH, lines: wrapped, linesPerCol: Math.floor(available / lineH) };
          }

          // Balance: split at the midpoint so both columns are equal height.
          const half = Math.ceil(chosen.lines.length / 2);
          doc.setFont('helvetica', 'normal'); doc.setFontSize(chosen.fs); doc.setTextColor(...ink);
          let yy = startY, colIdx = 0;
          for (let i = 0; i < chosen.lines.length; i++) {
            if (i === half) { colIdx = 1; yy = startY; }
            doc.text(chosen.lines[i], colX[colIdx], yy);
            yy += chosen.lineH;
          }
          // faint centre divider matching column height
          const colHeight = half * chosen.lineH;
          line(M + colW + gap / 2, startY - 2, M + colW + gap / 2, startY + colHeight, [230, 230, 238], 0.2);
        }

        // ---------- FOOTERS ----------
        const pages = doc.getNumberOfPages();
        for (let p = 1; p <= pages; p++) {
          doc.setPage(p);
          doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(...grey);
          doc.text('Dr Drapes Curtain Clinic  ·  1300 652 866  ·  drdrapes.com.au', M, 290);
          doc.text(`Page ${p} of ${pages}`, PW - M, 290, { align: 'right' });
        }

        return doc;
      },

      download(job) {
        const doc = this.build(job);
        doc.save(`${job.quote_number || 'Quote'}.pdf`);
      },

      // returns base64 (no data: prefix) for emailing as an attachment
      base64(job) {
        const doc = this.build(job);
        return doc.output('datauristring').split(',')[1];
      },
    };

    function fmtDate(d) {
      return d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' });
    }
    function clip(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; }

    /* ============================================================
       PHOTO FETCH + RESIZE (for embedding in inspection report PDFs)
       Loads a signed URL, draws to a canvas at reduced size, returns
       a JPEG data URL. Keeps the PDF a sensible size for emailing.
       ============================================================ */
    async function fetchPhotoForPdf(path, maxPx = 600) {
      const url = await db.photoUrl(path);
      const img = await new Promise((res, rej) => {
        const im = new Image();
        im.crossOrigin = 'anonymous';
        im.onload = () => res(im);
        im.onerror = rej;
        im.src = url;
      });
      const scale = Math.min(1, maxPx / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      return { dataUrl: canvas.toDataURL('image/jpeg', 0.72), w, h };
    }

    /* ============================================================
       INSPECTION REPORT PDF  (pre | post | combined)
       Branded like the quote PDF; embeds reduced-size photos.
       ============================================================ */
    const inspectionPdf = {
      // phase: 'pre' | 'post' | 'combined'

        const blue = BRAND.blue, pink = BRAND.pink, grey = [110, 110, 120], ink = [40, 40, 55];

        const ensure = (need) => { if (y + need > 272) { doc.addPage(); y = 20; } };

        const title = phase === 'combined' ? 'INSPECTION REPORT' : (phase === 'pre' ? 'PRE-INSPECTION' : 'POST-INSPECTION');
        doc.setFont('helvetica', 'bold'); doc.setFontSize(18); doc.setTextColor(...blue);
        doc.text(title, PW - M, y + 6, { align: 'right' });
        doc.setFontSize(11); doc.setTextColor(...ink);
        doc.text(job.quote_number || '', PW - M, y + 13, { align: 'right' });
        doc.setFontSize(9); doc.setTextColor(...grey); doc.setFont('helvetica', 'normal');
        doc.text(fmtDate(new Date()), PW - M, y + 18, { align: 'right' });

        let cy = logoBottom + 6;
        doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(...blue);
        doc.text('1300 652 866   ·   drdrapes@hudsongroup.com.au', M, cy);
        y = cy + 5; line(M, y, PW - M, y, pink, 0.8); y += 9;

        // customer
        doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(...blue);
        doc.text('CUSTOMER', M, y);
        doc.setFont('helvetica', 'normal'); doc.setTextColor(...ink);
        doc.text(job.customer_name || '', M, y + 5);
        cy = y + 5;
        if (job.site_address) { cy += 4.5; doc.setFontSize(9); doc.setTextColor(...grey); doc.text(clip(job.site_address, 70), M, cy); }
        const dd = job.data?.quote || {};
        if (dd.insurer_name || dd.claim_number) { cy += 4.5; doc.text('Insurance: ' + [dd.insurer_name, dd.claim_number].filter(Boolean).join(' / '), M, cy); }
        y = cy + 9;

        // sections
        if (phase === 'pre' || phase === 'combined') { y = await this.preSection(doc, d.pre_inspection, y, { PW, M, CW, blue, pink, grey, ink, line, ensure: () => { if (y > 250) { doc.addPage(); y = 20; } }, getY: () => y, setY: (v) => { y = v; } }); }
        if (phase === 'combined') { if (y > 240) { doc.addPage(); y = 20; } else { y += 6; } }
        if (phase === 'post' || phase === 'combined') { y = await this.postSection(doc, d.post_inspection, y, { PW, M, CW, blue, pink, grey, ink, line }); }

        // footers
        const pages = doc.getNumberOfPages();
        for (let p = 1; p <= pages; p++) {
          doc.setPage(p);
          doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(...grey);
          doc.text('Dr Drapes Curtain Clinic  ·  1300 652 866  ·  drdrapes.com.au', M, 290);
          doc.text(`Page ${p} of ${pages}`, PW - M, 290, { align: 'right' });
        }
        return doc;
      },

      async preSection(doc, pre, y, ctx) {
        const { PW, M, CW, blue, grey, ink, line } = ctx;
        if (!pre || !pre.saved_at) {
          doc.setFont('helvetica', 'italic'); doc.setFontSize(10); doc.setTextColor(...grey);
          doc.text('No pre-inspection recorded.', M, y); return y + 8;
        }
        doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(...blue);
        doc.text('Pre-Inspection', M, y); y += 6;
        doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(...ink);
        doc.text(`Inspector: ${pre.inspector || ''}    Date: ${pre.date || ''}`, M, y); y += 7;

        y = this.checksBlock(doc, 'Curtains', pre.curt_checks, pre.curt_na, pre.curt_score, y, ctx);
        y = this.checksBlock(doc, 'Blinds', pre.blind_checks, pre.blind_na, pre.blind_score, y, ctx);
        y = this.checksBlock(doc, 'Hardware', pre.hw_checks, false, null, y, ctx);

        if (pre.cust_notes) y = this.notesBlock(doc, 'Notes', pre.cust_notes, y, ctx);
        y = await this.photoBlock(doc, pre.photos, y, ctx);
        return y;
      },

      async postSection(doc, post, y, ctx) {
        const { PW, M, CW, blue, grey, ink, line } = ctx;
        if (!post || !post.saved_at) {
          doc.setFont('helvetica', 'italic'); doc.setFontSize(10); doc.setTextColor(...grey);
          doc.text('No post-inspection recorded.', M, y); return y + 8;
        }
        if (y > 250) { doc.addPage(); y = 20; }
        doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(...blue);
        doc.text('Post-Inspection', M, y); y += 6;
        doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(...ink);
        doc.text(`Inspector: ${post.inspector || ''}    Date: ${post.date || ''}`, M, y); y += 6;

        const outcomeLabel = (OUTCOMES.find(([v]) => v === post.outcome) || [null, post.outcome])[1];
        doc.setFont('helvetica', 'bold'); doc.text(`Outcome: ${outcomeLabel || ''}`, M, y);
        if (post.post_score != null) doc.text(`Condition score: ${post.post_score}/10`, M + 80, y);
        y += 6;

        const treats = TREATMENTS.filter(([k]) => post.treatments?.[k]).map(([, l]) => l);
        if (treats.length) { doc.setFont('helvetica', 'normal'); doc.text('Treatments: ' + treats.join(', '), M, y); y += 6; }

        y = this.checksBlock(doc, 'Post-clean findings', post.post_checks, false, null, y, ctx);
        if (post.cust_notes) y = this.notesBlock(doc, 'Notes', post.cust_notes, y, ctx);
        y = await this.photoBlock(doc, post.photos, y, ctx);
        return y;
      },

      checksBlock(doc, title, checks, na, score, y, ctx) {
        const { M, PW, ink, grey, blue, line } = ctx;
        if (y > 258) { doc.addPage(); y = 20; }
        doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(...blue);
        let head = title;
        if (na) head += '  —  N/A (none on this job)';
        else if (score != null) head += `  —  condition ${score}/10`;
        doc.text(head, M, y); y += 5;
        if (na) return y + 2;
        const list = checks || [];
        if (!list.length) {
          doc.setFont('helvetica', 'italic'); doc.setFontSize(9); doc.setTextColor(...grey);
          doc.text('No issues noted.', M + 2, y); return y + 6;
        }
        doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(...ink);
        list.forEach((c) => {
          if (y > 280) { doc.addPage(); y = 20; }
          const label = c.id === 'other' ? c.label : c.label;
          let txt = '•  ' + label + (c.note ? ' — ' + c.note : '');
          const lines = doc.splitTextToSize(txt, PW - M * 2 - 4);
          doc.text(lines, M + 2, y); y += lines.length * 4.6;
        });
        return y + 3;
      },

      notesBlock(doc, title, text, y, ctx) {
        const { M, PW, blue, ink } = ctx;
        if (y > 260) { doc.addPage(); y = 20; }
        doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(...blue);
        doc.text(title, M, y); y += 5;
        doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(...ink);
        const lines = doc.splitTextToSize(text, PW - M * 2);
        doc.text(lines, M, y); return y + lines.length * 4.6 + 4;
      },

      async photoBlock(doc, photos, y, ctx) {
        const { M, PW, blue, grey } = ctx;
        if (!photos || !photos.length) return y;
        if (y > 240) { doc.addPage(); y = 20; }
        doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(...blue);
        doc.text('Photos', M, y); y += 5;
        // grid: 3 per row, reduced size
        const cols = 3, gap = 4;
        const cellW = (PW - M * 2 - gap * (cols - 1)) / cols;
        let col = 0, rowH = 0, rowY = y;
        for (const p of photos) {
          let pic;
          try { pic = await fetchPhotoForPdf(p.path, 600); } catch (_) { continue; }
          const ar = pic.h / pic.w;
          const imgH = cellW * ar;
          if (col === 0) {
            if (rowY + imgH > 280) { doc.addPage(); rowY = 20; }
          }
          const x = M + col * (cellW + gap);
          try { doc.addImage(pic.dataUrl, 'JPEG', x, rowY, cellW, imgH); } catch (_) {}
          rowH = Math.max(rowH, imgH);
          col++;
          if (col >= cols) { col = 0; rowY += rowH + gap; rowH = 0; }
        }
        if (col !== 0) rowY += rowH + gap;
        return rowY + 4;
      },

      async download(job, phase) {
        const doc = await this.build(job, phase);
        const suffix = phase === 'combined' ? 'Inspection' : (phase === 'pre' ? 'Pre-Inspection' : 'Post-Inspection');
        doc.save(`${job.quote_number || 'Report'}_${suffix}.pdf`);
      },

      async base64(job, phase) {
        const doc = await this.build(job, phase);
        return doc.output('datauristring').split(',')[1];
      },
    };

    /* ============================================================
       INSPECTION FORMS (global mode — pre & post)
       Checklists, 1–10 score, notes, photos to Supabase Storage.
       Pre saving advances job → In Progress; post → Complete.
       ============================================================ */
    const INSPECT_CHECKS = {
      curtains: [
        ['mould', 'Mould'], ['smoke', 'Smoke'], ['pet_hair', 'Pet hair'],
        ['fading', 'Fading'], ['fraying', 'Fraying'], ['shrinkage', 'Shrinkage risk'],
        ['water', 'Water damage'], ['chalky_backing', 'Chalky backing'],
        ['backing_sticking', 'Backing sticking together'], ['water_marks', 'Water marks/stains'],
        ['heavily_stained', 'Heavily stained'],
      ],
      blinds: [
        ['mould', 'Mould'], ['mechanism', 'Mechanism damage'],
        ['slat', 'Slat damage'], ['cord', 'Cord/chain issues'],
        ['sun_fading', 'Sun damage/fading'], ['water_stains', 'Water stains'],
        ['heavily_stained', 'Heavily stained'],
      ],
      hardware: [
        ['track', 'Track damage'], ['bracket', 'Bracket issues'], ['motor', 'Motor faults'],
        ['parts_missing', 'Parts missing'],
      ],
      post_findings: [
        ['remaining_staining', 'Any remaining staining'],
        ['pre_existing', 'Pre-existing damage'],
        ['repairs_required', 'Repairs or alterations required'],
        ['shrinking', 'Signs of shrinking'],
        ['colour_fastness', 'Colour fastness or fading'],
      ],
    };
    const TREATMENTS = [['standard', 'Standard Clean'], ['mould', 'Mould Treatment'], ['spot', 'Spot Treatment'], ['hand', 'Hand Clean'], ['restoration', 'Restoration Clean']];
    const OUTCOMES = [['fully', 'Fully Restored'], ['mostly', 'Mostly Restored'], ['partial', 'Partially Restored'], ['unable', 'Unable to Restore']];

    const inspection = {
      // one working state per phase
      state: { pre: null, post: null },
      mainEl: null,

      init(phase, job, main) {
        this.mainEl = main;
        const saved = job.data?.[phase === 'pre' ? 'pre_inspection' : 'post_inspection'] || {};
        const staffNames = (session.settings['staff-names'] || '').split(',').map((s) => s.trim()).filter(Boolean);
        this.state[phase] = {
          jobId: job.id,
          inspector: saved.inspector || (staffNames[0] || session.profile.name),
          date: saved.date || new Date().toISOString().slice(0, 10),
          curt_checks: saved.curt_checks || [],
          blind_checks: saved.blind_checks || [],
          hw_checks: saved.hw_checks || [],
          curt_na: !!saved.curt_na,
          blind_na: !!saved.blind_na,
          post_checks: saved.post_checks || [],
          curt_score: saved.curt_score ?? 5,
          blind_score: saved.blind_score ?? 5,
          post_score: saved.post_score ?? 5,
          outcome: saved.outcome || 'fully',
          treatments: saved.treatments || {},
          cust_notes: saved.cust_notes || '',
          job_notes: saved.job_notes || '',
          photos: saved.photos || [],
          saved_at: saved.saved_at,
          staffNames,
        };
        this.render(phase);
      },

      render(phase) {
        const mount = $(`#${phase}-mount`);
        if (!mount) return;
        const s = this.state[phase];
        const isPre = phase === 'pre';

        const checkLabel = (val) => val ? new Date(val).toLocaleString('en-AU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
        const staffOpts = (s.staffNames.length ? s.staffNames : [session.profile.name])
          .map((n) => `<option value="${escapeAttr(n)}" ${s.inspector === n ? 'selected' : ''}>${escapeHtml(n)}</option>`).join('');

        let html = '';
        if (s.saved_at) html += `<div class="insp-saved-banner">✓ Saved ${escapeHtml(checkLabel(s.saved_at))} by ${escapeHtml(s.inspector)}</div>`;

        html += `
          <div class="insp-row">
            <div class="field"><label>Inspector</label><select id="${phase}-inspector">${staffOpts}</select></div>
            <div class="field"><label>Date</label><input id="${phase}-date" type="date" value="${escapeAttr(s.date)}" /></div>
          </div>`;

        if (isPre) {
          html += this.checklistHtml(phase, 'curtains', 'Curtains', s.curt_checks, 'curt_na', s.curt_na);
          html += this.checklistHtml(phase, 'blinds', 'Blinds', s.blind_checks, 'blind_na', s.blind_na);
          html += this.checklistHtml(phase, 'hardware', 'Hardware', s.hw_checks);
          if (!s.curt_na) html += this.scoreHtml(phase, 'curt_score', 'Curtains condition (1–10)', s.curt_score);
          if (!s.blind_na) html += this.scoreHtml(phase, 'blind_score', 'Blinds condition (1–10)', s.blind_score);
        } else {
          // post: outcome + treatments + findings + single score
          html += `<div class="field outcome-sel" style="margin-bottom:16px"><label style="font-size:13px;font-weight:700;color:var(--navy-mid);display:block;margin-bottom:6px">Outcome</label>
            <select id="post-outcome">${OUTCOMES.map(([v, l]) => `<option value="${v}" ${s.outcome === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>`;
          html += `<div><label style="font-size:13px;font-weight:700;color:var(--navy-mid);display:block;margin-bottom:6px">Treatments applied</label>
            <div class="treatments">${TREATMENTS.map(([k, l]) => `<span class="treat-chip ${s.treatments[k] ? 'active' : ''}" data-treat="${k}">${l}</span>`).join('')}</div></div>`;
          html += this.checklistHtml(phase, 'post_findings', 'Post-clean findings', s.post_checks);
          html += this.scoreHtml(phase, 'post_score', 'Post-clean condition (1–10)', s.post_score);
        }

        // notes
        html += `<div class="insp-notes">
          <div class="field"><label>Customer notes (appear on report)</label><textarea id="${phase}-cust" rows="2">${escapeHtml(s.cust_notes)}</textarea></div>
          <div class="field"><label>Job notes (internal only)</label><textarea id="${phase}-job" rows="2">${escapeHtml(s.job_notes)}</textarea></div>
        </div>`;

        // photos
        html += `<div><label style="font-size:13px;font-weight:700;color:var(--navy-mid);display:block;margin-bottom:6px">Photos</label>
          <div class="photo-count">${s.photos.length} photo${s.photos.length === 1 ? '' : 's'}</div>
          <div class="photo-grid" id="${phase}-photos"></div>
          <input type="file" id="${phase}-fileinput" accept="image/*" multiple style="display:none" />
        </div>`;

        html += `<div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn btn-insp-save" id="${phase}-save">Save ${isPre ? 'Pre' : 'Post'}-Inspection</button>
          <button class="btn btn-secondary" id="${phase}-report">Download Report</button>
          <button class="btn btn-email" id="${phase}-email">Email Report</button>
          ${!isPre ? '<button class="btn btn-secondary" id="combined-report">Download Combined (Pre+Post)</button><button class="btn btn-email" id="combined-email">Email Combined</button>' : ''}
        </div>`;

        mount.innerHTML = html;
        this.renderPhotos(phase);
        this.wire(phase);
      },

      checklistHtml(phase, group, title, checks, naKey, naOn) {
        const hasNa = !!naKey;
        const naToggle = hasNa
          ? `<label class="acc-terms" style="margin:0 0 8px"><input type="checkbox" class="na-cb" data-na="${naKey}" ${naOn ? 'checked' : ''}/> N/A — none on this job</label>`
          : '';
        if (hasNa && naOn) {
          // collapsed: just the N/A toggle, conditions hidden
          return `<div class="check-group"><h4>${title}</h4>${naToggle}</div>`;
        }
        const items = INSPECT_CHECKS[group].map(([id, label]) => {
          const existing = checks.find((c) => c.id === id);
          const on = !!existing;
          return `
            <div class="check-item ${on ? 'checked' : ''}" data-group="${group}" data-id="${id}">
              <label><input type="checkbox" class="chk" ${on ? 'checked' : ''}/> ${label}</label>
              <input class="note-in" placeholder="note (optional)" value="${escapeAttr(existing?.note || '')}" ${on ? '' : 'disabled'} />
            </div>`;
        }).join('');
        const other = checks.find((c) => c.id === 'other');
        const otherRow = `
          <div class="check-item ${other ? 'checked' : ''}" data-group="${group}" data-id="other" data-other="1">
            <label style="min-width:60px">Other:</label>
            <input class="other-cond" placeholder="describe condition" value="${escapeAttr(other?.label || '')}" style="flex:1;padding:7px 10px;border:1.5px solid var(--line);border-radius:6px;font-size:13px" />
            <input class="note-in" placeholder="note (optional)" value="${escapeAttr(other?.note || '')}" style="flex:1" />
          </div>`;
        return `<div class="check-group"><h4>${title}</h4>${naToggle}<div class="check-items">${items}${otherRow}</div></div>`;
      },

      scoreHtml(phase, key, label, val) {
        return `<div class="score-wrap"><label>${label}</label>
          <div class="score-row"><input type="range" min="1" max="10" value="${val}" id="${phase}-${key}" /><span class="score-val" id="${phase}-${key}-v">${val}</span></div></div>`;
      },

      async renderPhotos(phase) {
        const grid = $(`#${phase}-photos`);
        if (!grid) return;
        const s = this.state[phase];
        grid.innerHTML = s.photos.map((p, i) =>
          `<div class="photo-thumb" data-i="${i}"><div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:11px;color:#888">loading…</div><span class="ph-del" data-delphoto="${i}">×</span></div>`
        ).join('') + `<div class="photo-add" id="${phase}-addphoto"><span class="plus">+</span>Add photo</div>`;

        // load signed URLs for thumbnails
        s.photos.forEach(async (p, i) => {
          try {
            const url = await db.photoUrl(p.path);
            const el = grid.querySelector(`.photo-thumb[data-i="${i}"]`);
            if (el) el.querySelector('div').outerHTML = `<img src="${url}" alt="${escapeAttr(p.name || '')}" />`;
          } catch (_) { /* leave placeholder */ }
        });

        // wire add + delete
        const add = $(`#${phase}-addphoto`);
        if (add) add.addEventListener('click', () => $(`#${phase}-fileinput`).click());
        grid.querySelectorAll('[data-delphoto]').forEach((b) =>
          b.addEventListener('click', async (e) => {
            e.stopPropagation();
            const i = +b.dataset.delphoto;
            const p = s.photos[i];
            if (!confirm('Remove this photo?')) return;
            try { await db.deletePhoto(p.path); } catch (_) { /* may already be gone */ }
            s.photos.splice(i, 1);
            // persist the removal immediately
            await this.persist(phase, { silent: true });
            this.renderPhotos(phase);
          }));
      },

      wire(phase) {
        const s = this.state[phase];
        $(`#${phase}-inspector`).addEventListener('change', (e) => { s.inspector = e.target.value; });
        $(`#${phase}-date`).addEventListener('change', (e) => { s.date = e.target.value; });
        $(`#${phase}-cust`).addEventListener('input', (e) => { s.cust_notes = e.target.value; });
        $(`#${phase}-job`).addEventListener('input', (e) => { s.job_notes = e.target.value; });

        // N/A toggles (curtains/blinds) — re-render to collapse/expand the group
        document.querySelectorAll(`#${phase}-mount .na-cb`).forEach((cb) =>
          cb.addEventListener('change', (e) => {
            s[cb.dataset.na] = e.target.checked;
            this.render(phase);
          }));

        // checklists
        const groupArr = (group) =>
          group === 'curtains' ? 'curt_checks'
          : group === 'blinds' ? 'blind_checks'
          : group === 'hardware' ? 'hw_checks'
          : 'post_checks'; // post_findings
        document.querySelectorAll(`#${phase}-mount .check-item`).forEach((row) => {
          const group = row.dataset.group, id = row.dataset.id;
          const arrKey = groupArr(group);

          // "Other" row: driven by the free-text condition input, no checkbox
          if (row.dataset.other) {
            const cond = row.querySelector('.other-cond');
            const note = row.querySelector('.note-in');
            const sync = () => {
              const arr = s[arrKey];
              const text = cond.value.trim();
              const idx = arr.findIndex((c) => c.id === 'other');
              if (text) {
                const obj = { id: 'other', label: text, note: note.value };
                if (idx >= 0) arr[idx] = obj; else arr.push(obj);
                row.classList.add('checked');
              } else {
                if (idx >= 0) arr.splice(idx, 1);
                row.classList.remove('checked');
              }
            };
            cond.addEventListener('input', sync);
            note.addEventListener('input', sync);
            return;
          }

          const cb = row.querySelector('.chk'), note = row.querySelector('.note-in');
          const label = (INSPECT_CHECKS[group].find(([i]) => i === id) || [null, id])[1];
          cb.addEventListener('change', (e) => {
            const arr = s[arrKey];
            if (e.target.checked) {
              if (!arr.find((c) => c.id === id)) arr.push({ id, label, note: note.value });
              note.disabled = false; row.classList.add('checked');
            } else {
              const idx = arr.findIndex((c) => c.id === id);
              if (idx >= 0) arr.splice(idx, 1);
              note.disabled = true; note.value = ''; row.classList.remove('checked');
            }
          });
          note.addEventListener('input', (e) => {
            const item = s[arrKey].find((c) => c.id === id);
            if (item) item.note = e.target.value;
          });
        });

        // scores
        ['curt_score', 'blind_score', 'post_score'].forEach((k) => {
          const el = $(`#${phase}-${k}`);
          if (el) el.addEventListener('input', (e) => { s[k] = +e.target.value; $(`#${phase}-${k}-v`).textContent = e.target.value; });
        });

        // treatments (post)
        document.querySelectorAll(`#${phase}-mount .treat-chip`).forEach((c) =>
          c.addEventListener('click', () => {
            const k = c.dataset.treat;
            s.treatments[k] = !s.treatments[k];
            c.classList.toggle('active', s.treatments[k]);
          }));

        // outcome (post)
        const oc = $('#post-outcome');
        if (oc && phase === 'post') oc.addEventListener('change', (e) => { s.outcome = e.target.value; });

        // photo file input
        const fi = $(`#${phase}-fileinput`);
        if (fi) fi.addEventListener('change', async (e) => {
          const files = Array.from(e.target.files || []);
          if (!files.length) return;
          const room = 8 - s.photos.length;
          if (room <= 0) { ui.toast('Max 8 photos per inspection'); return; }
          const toUpload = files.slice(0, room);
          ui.toast(`Uploading ${toUpload.length} photo${toUpload.length === 1 ? '' : 's'}…`);
          for (const f of toUpload) {
            try {
              const meta = await db.uploadPhoto(s.jobId, phase, f);
              s.photos.push(meta);
            } catch (err) {
              ui.toast('Upload failed: ' + (err.message || 'error'));
              console.error(err);
            }
          }
          await this.persist(phase, { silent: true });
          this.renderPhotos(phase);
          fi.value = '';
        });

        // save
        $(`#${phase}-save`).addEventListener('click', () => this.save(phase));

        // report download
        const rpt = $(`#${phase}-report`);
        if (rpt) rpt.addEventListener('click', async () => {
          rpt.disabled = true; rpt.textContent = 'Generating…';
          try { const job = await db.getJob(this.state[phase].jobId); await inspectionPdf.download(job, phase); }
          catch (err) { ui.toast('Report failed: ' + (err.message || 'error')); console.error(err); }
          finally { rpt.disabled = false; rpt.textContent = 'Download Report'; }
        });
        // report email
        const rem = $(`#${phase}-email`);
        if (rem) rem.addEventListener('click', async () => {
          rem.disabled = true; rem.textContent = 'Preparing…';
          try { const job = await db.getJob(this.state[phase].jobId); inspectionEmail.open(job, phase); }
          catch (err) { ui.toast('Could not prepare: ' + (err.message || 'error')); console.error(err); }
          finally { rem.disabled = false; rem.textContent = 'Email Report'; }
        });
        // combined (post form only)
        const cr = $('#combined-report');
        if (cr) cr.addEventListener('click', async () => {
          cr.disabled = true; cr.textContent = 'Generating…';
          try { const job = await db.getJob(this.state[phase].jobId); await inspectionPdf.download(job, 'combined'); }
          catch (err) { ui.toast('Report failed: ' + (err.message || 'error')); console.error(err); }
          finally { cr.disabled = false; cr.textContent = 'Download Combined (Pre+Post)'; }
        });
        const ce = $('#combined-email');
        if (ce) ce.addEventListener('click', async () => {
          ce.disabled = true; ce.textContent = 'Preparing…';
          try { const job = await db.getJob(this.state[phase].jobId); inspectionEmail.open(job, 'combined'); }
          catch (err) { ui.toast('Could not prepare: ' + (err.message || 'error')); console.error(err); }
          finally { ce.disabled = false; ce.textContent = 'Email Combined'; }
        });
      },

      // Build the data object for this phase from state.
      payload(phase) {
        const s = this.state[phase];
        if (phase === 'pre') {
          return {
            inspector: s.inspector, date: s.date, mode: 'global',
            curt_checks: s.curt_checks, blind_checks: s.blind_checks, hw_checks: s.hw_checks,
            curt_na: s.curt_na, blind_na: s.blind_na,
            curt_score: s.curt_score, blind_score: s.blind_score,
            cust_notes: s.cust_notes, job_notes: s.job_notes,
            photos: s.photos, saved_at: s.saved_at,
          };
        }
        return {
          inspector: s.inspector, date: s.date, mode: 'global',
          post_score: s.post_score, outcome: s.outcome, treatments: s.treatments,
          post_checks: s.post_checks,
          cust_notes: s.cust_notes, job_notes: s.job_notes,
          photos: s.photos, saved_at: s.saved_at,
        };
      },

      // Persist without changing status (used after photo add/remove).
      async persist(phase, { silent } = {}) {
        const key = phase === 'pre' ? 'pre_inspection' : 'post_inspection';
        await db.saveJob(this.state[phase].jobId, { [key]: this.payload(phase) });
        if (!silent) ui.toast('Saved');
      },

      async save(phase) {
        const btn = $(`#${phase}-save`);
        btn.disabled = true; btn.textContent = 'Saving…';
        try {
          const s = this.state[phase];
          s.saved_at = new Date().toISOString();
          const key = phase === 'pre' ? 'pre_inspection' : 'post_inspection';
          await db.saveJob(s.jobId, { [key]: this.payload(phase) });
          // advance status forward only
          const order = STATUSES;
          const fresh = await db.getJob(s.jobId);
          const target = phase === 'pre' ? 'in_progress' : 'complete';
          if (order.indexOf(fresh.status) < order.indexOf(target)) {
            await db.advanceStatus(s.jobId, target);
          }
          ui.toast(`${phase === 'pre' ? 'Pre' : 'Post'}-inspection saved`);
          router.jobPage(this.mainEl); // refresh status bar + banners
        } catch (err) {
          ui.toast('Save failed: ' + (err.message || 'error'));
          console.error(err);
          btn.disabled = false; btn.textContent = `Save ${phase === 'pre' ? 'Pre' : 'Post'}-Inspection`;
        }
      },
    };

    /* ============================================================
       ACCEPTANCE & TECHNICIAN JOB CARD
       Record how the customer accepted, optional terms tick, confirm
       (requires a saved quote with a total) → advances job to Confirmed
       and generates the plain-text job card for pasting into Fergus.
       ============================================================ */
    const acceptance = {
      jobId: null, main: null,
      draft: { how: 'verbal', terms_confirmed: false },

      init(job, main) {
        this.jobId = job.id; this.main = main;
        const a = job.data?.acceptance || {};
        this.draft = { how: a.how || 'verbal', terms_confirmed: !!a.terms_confirmed };
        this.render(job);
      },

      render(job) {
        const mount = $('#acc-mount');
        if (!mount) return;
        const a = job.data?.acceptance || {};
        const q = job.data?.quote || {};
        const hasQuote = q.total != null && Number(q.total) > 0;
        const isConfirmed = !!a.confirmed_at;

        const chips = ['verbal', 'email', 'text', 'other'].map((h) =>
          `<span class="acc-chip ${this.draft.how === h ? 'active' : ''}" data-how="${h}">${h.charAt(0).toUpperCase() + h.slice(1)}</span>`).join('');

        let html = '';
        const isDeclined = job.status === 'declined';
        if (isDeclined) {
          const dec = job.data?.declined || {};
          const reasonLabel = (DECLINE_REASONS.find(([v]) => v === dec.reason) || [null, dec.reason])[1] || '';
          const when = dec.at ? new Date(dec.at).toLocaleString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
          const prior = dec.prior_acceptance || null;
          const backTo = prior ? (dec.prior_status || 'confirmed') : 'quoted';
          const reversedNote = prior
            ? `<br/><span style="font-weight:400">Acceptance reversed — was ${escapeHtml(STATUS_LABEL[backTo] || backTo)}${dec.prior_acceptance.confirmed_by ? ', accepted by ' + escapeHtml(dec.prior_acceptance.confirmed_by) : ''}</span>`
            : '';
          html += `<div class="acc-confirmed-banner" style="background:#fee2e2;border-color:#fecaca;color:#991b1b">✕ <strong>Quote declined</strong>${reasonLabel ? ' — ' + escapeHtml(reasonLabel) : ''} · ${escapeHtml(when)}${dec.note ? '<br/><span style="font-weight:400">' + escapeHtml(dec.note) + '</span>' : ''}${reversedNote}</div>
            <button class="btn btn-secondary" id="acc-reopen">${prior ? 'Restore Acceptance' : 'Re-open Quote'}</button>`;
          mount.innerHTML = html;
          $('#acc-reopen').addEventListener('click', async () => {
            if (!confirm(prior
              ? `Restore this job? The previous acceptance is reinstated and status returns to ${STATUS_LABEL[backTo] || backTo}.`
              : 'Re-open this quote? It returns to Quoted status.')) return;
            try {
              const fresh = await db.getJob(this.jobId);
              const history = (fresh.data?.status_history) || [];
              history.push({
                status: backTo,
                changed_by: session.profile.name,
                changed_at: new Date().toISOString(),
                note: prior ? 'Decline reversed — acceptance restored' : 'Quote re-opened',
              });
              await db.saveJob(this.jobId, {
                declined: null,
                acceptance: prior,
