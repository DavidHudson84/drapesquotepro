<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drapr</title>
  <link rel="icon" type="image/svg+xml" href="brand/drapr-favicon.svg" />

  <!-- Fonts: Poppins (headings, matches the Drapr wordmark) + system stack (body), per drapr brand guidelines -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ============================================================
       BRAND TOKENS — Drapr
       App-chrome colours only. The BRAND object further down (PDF/quote
       output) carries the client's own brand and is separate on purpose.
       ============================================================ */
    :root {
      --navy-dark: #0A4A43;  /* drapr-teal-deep */
      --navy-mid:  #0F6E63;  /* drapr-teal */
      --red:       #B3261E;  /* drapr-danger */
      --teal:      #0F6E63;  /* drapr-teal */
      --teal-light:#DCEDEA;  /* drapr-teal-tint */
      --green:     #1E7A4B;  /* drapr-success */

      --ink:       #12211F;  /* drapr-ink */
      --muted:     #5A6866;  /* drapr-grey-600 */
      --line:      #C7D0CE;  /* drapr-grey-300 */
      --bg:        #F1F4F3;  /* drapr-grey-100 */
      --card:      #ffffff;  /* drapr-paper */
      --shadow:    0 1px 3px rgba(10,74,67,.08), 0 8px 24px rgba(10,74,67,.06);

      --r:         12px;
      --r-sm:      8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    h1, h2, h3, h4, .display {
      font-family: 'Poppins', sans-serif;
      color: var(--navy-dark);
      letter-spacing: -0.01em;
    }

    button { font-family: inherit; cursor: pointer; border: none; }
    input, select, textarea { font-family: inherit; font-size: 15px; }

    /* ============================================================
       APP ROOT — view switching
       ============================================================ */
    #app { min-height: 100%; display: flex; flex-direction: column; }

    .hidden { display: none !important; }

    /* ---------- Loading splash ---------- */
    #boot {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--navy-dark);
      z-index: 1000;
    }
    #boot .spin {
      width: 38px; height: 38px;
      border: 3px solid rgba(255,255,255,.2);
      border-top-color: var(--teal-light);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ============================================================
       LOGIN
       ============================================================ */
    #login-view {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      background:
        radial-gradient(1200px 600px at 70% -10%, rgba(43,45,126,.25), transparent),
        linear-gradient(160deg, var(--navy-dark), #12143d);
      padding: 24px;
    }
    .login-card {
      width: 100%; max-width: 400px;
      background: var(--card);
      border-radius: 16px;
      padding: 40px 36px;
      box-shadow: 0 24px 60px rgba(0,0,0,.35);
    }
    .login-brand { height: 34px; margin-bottom: 4px; }
    .login-sub { color: var(--muted); font-size: 14px; margin: 4px 0 28px; }

    .field { margin-bottom: 16px; }
    .field label {
      display: block; font-size: 13px; font-weight: 600;
      color: var(--navy-mid); margin-bottom: 6px;
    }
    .field input {
      width: 100%; padding: 12px 14px;
      border: 1.5px solid var(--line); border-radius: var(--r-sm);
      transition: border-color .15s, box-shadow .15s;
    }
    .field input:focus {
      outline: none; border-color: var(--navy-mid);
      box-shadow: 0 0 0 3px rgba(43,45,126,.12);
    }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 8px; font-weight: 700; font-size: 15px;
      padding: 12px 18px; border-radius: var(--r-sm);
      transition: transform .05s, filter .15s, background .15s;
    }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background: var(--navy-mid); color: #fff; width: 100%; }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-primary:disabled { opacity: .6; cursor: default; }

    .login-error {
      background: #fef2f2; color: var(--red);
      border: 1px solid #fecaca; border-radius: var(--r-sm);
      padding: 10px 12px; font-size: 13.5px; margin-bottom: 16px;
    }
    .login-note {
      background: #f0fdf4; color: #15803d;
      border: 1px solid #bbf7d0; border-radius: var(--r-sm);
      padding: 10px 12px; font-size: 13.5px; margin-bottom: 16px;
    }
    .login-alt { text-align: center; margin-top: 16px; }
    .login-alt a {
      color: var(--navy-mid); font-size: 13.5px;
      font-weight: 600; text-decoration: none; cursor: pointer;
    }
    .login-alt a:hover { text-decoration: underline; }

    /* ============================================================
       APP CHROME (top bar + main)
       ============================================================ */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--navy-dark);
      color: #fff;
      padding: 0 22px; height: 60px;
      box-shadow: var(--shadow);
    }
    .topbar .brand { display: flex; align-items: center; height: 26px; }
    .topbar .brand img { height: 100%; width: auto; display: block; }
    .topbar .right { display: flex; align-items: center; gap: 16px; }
    .who { text-align: right; line-height: 1.2; }
    .who .name { font-weight: 700; font-size: 14px; }
    .who .role { font-size: 11.5px; color: rgba(255,255,255,.6); text-transform: uppercase; letter-spacing: .06em; }
    .btn-ghost {
      background: rgba(255,255,255,.1); color: #fff;
      padding: 8px 14px; border-radius: var(--r-sm); font-size: 13px; font-weight: 600;
    }
    .btn-ghost:hover { background: rgba(255,255,255,.18); }

    main { flex: 1; padding: 28px; max-width: 1200px; width: 100%; margin: 0 auto; }

    .page-head { margin-bottom: 22px; }
    .page-head h1 { font-size: 26px; font-weight: 800; }
    .page-head p { color: var(--muted); font-size: 14.5px; margin-top: 2px; }

    /* ---------- Dashboard placeholder stat grid ---------- */
    .stat-grid {
      display: grid; gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      margin-bottom: 26px;
    }
    .stat {
      background: var(--card); border-radius: var(--r);
      padding: 20px; box-shadow: var(--shadow);
      border-left: 4px solid var(--navy-mid);
    }
    .stat .label { font-size: 12.5px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
    .stat .value { font-family: 'Montserrat'; font-weight: 800; font-size: 30px; margin-top: 6px; color: var(--navy-dark); }
    .stat.accent-teal { border-left-color: var(--teal); }
    .stat.accent-green { border-left-color: var(--green); }
    .stat.accent-red { border-left-color: var(--red); }

    .empty-card {
      background: var(--card); border-radius: var(--r);
      padding: 48px; text-align: center; box-shadow: var(--shadow);
      color: var(--muted);
    }
    .empty-card h3 { color: var(--navy-dark); font-size: 18px; margin-bottom: 8px; }

    /* ============================================================
       DASHBOARD
       ============================================================ */
    .dash-band { margin-bottom: 26px; }
    .dash-band-title { font-family: 'Montserrat'; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 12px; }
    .dash-band-title .bt-note { display: block; font-family: inherit; font-size: 11.5px; font-weight: 600; text-transform: none; letter-spacing: 0; color: var(--muted); opacity: .8; margin-top: 3px; }
    .rep-flag { display: flex; gap: 10px; align-items: flex-start; background: #fef3c7; border: 1px solid #fde68a; color: #92400e; border-radius: 8px; padding: 10px 14px; font-size: 13.5px; margin-bottom: 18px; }
    .dash-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }

    /* Reports */
    .rep-controls { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 14px; margin-bottom: 24px; align-items: center; }
    .rep-presets { display: flex; flex-wrap: wrap; gap: 8px; }
    .rep-preset { padding: 7px 13px; border: 1px solid var(--line); background: var(--card); border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; }
    .rep-preset.on { background: var(--navy-dark); color: #fff; border-color: var(--navy-dark); }
    .rep-custom { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .rep-custom label { font-size: 13px; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .rep-custom input[type="date"] { padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px; font-size: 13px; }
    .rep-check { cursor: pointer; }
    .rep-two { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
    @media (max-width: 760px) { .rep-two { grid-template-columns: 1fr; } .rep-controls { flex-direction: column; align-items: stretch; } }
    .rep-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    .rep-table th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 700; padding: 6px 8px; border-bottom: 2px solid var(--line); }
    .rep-table td { padding: 8px; border-bottom: 1px solid var(--line); }
    .rep-table tbody tr:last-child td { border-bottom: none; }

    .metric {
      background: var(--card); border-radius: var(--r); padding: 18px 20px;
      box-shadow: var(--shadow); border-top: 3px solid var(--navy-mid);
    }
    .metric.teal { border-top-color: var(--teal); }
    .metric.green { border-top-color: var(--green); }
    .metric.red { border-top-color: var(--red); }
    .metric .m-label { font-size: 12.5px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
    .metric .m-value { font-family: 'Montserrat'; font-weight: 800; font-size: 28px; color: var(--navy-dark); margin-top: 4px; line-height: 1.1; }
    .metric .m-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .metric .m-count { font-family: 'Montserrat'; font-weight: 700; font-size: 15px; color: var(--navy-mid); }

    .progress { margin-top: 10px; }
    .progress-track { height: 7px; background: #eef0f6; border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 999px; background: var(--navy-mid); transition: width .4s; }
    .progress.teal .progress-fill { background: var(--teal); }
    .progress.green .progress-fill { background: var(--green); }
    .progress.over .progress-fill { background: var(--green); }
    .progress-label { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-top: 4px; }
    .progress-label strong { color: var(--navy-dark); }

    .attention-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    .attn-card {
      background: var(--card); border-radius: var(--r); padding: 18px 20px; box-shadow: var(--shadow);
      cursor: pointer; border-left: 4px solid var(--red); transition: transform .08s, box-shadow .12s;
    }
    .attn-card:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(26,28,80,.12); }
    .attn-card.ok { border-left-color: var(--green); cursor: default; }
    .attn-card .a-count { font-family: 'Montserrat'; font-weight: 800; font-size: 30px; color: var(--navy-dark); }
    .attn-card .a-label { font-size: 13.5px; color: var(--ink); font-weight: 600; margin-top: 2px; }
    .attn-card .a-hint { font-size: 12px; color: var(--muted); margin-top: 4px; }

    .funnel { display: flex; gap: 8px; flex-wrap: wrap; }
    .funnel-step {
      flex: 1; min-width: 110px; background: var(--card); border-radius: var(--r); padding: 14px 16px; box-shadow: var(--shadow);
      text-align: center; cursor: pointer; transition: transform .08s;
    }
    .funnel-step:hover { transform: translateY(-1px); }
    .funnel-step .f-count { font-family: 'Montserrat'; font-weight: 800; font-size: 24px; color: var(--navy-dark); }
    .funnel-step .f-label { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; margin-top: 2px; }

    /* Quotes to chase — an actionable list, not just a number to click through.
       A count you have to navigate away from is why open quotes go cold. */
    .chase-panel { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); margin-top: 16px; overflow: hidden; }
    .chase-row {
      display: grid; grid-template-columns: 1.5fr 110px 155px auto; gap: 14px; align-items: center;
      padding: 12px 18px; border-top: 1px solid var(--line); font-size: 13.5px; cursor: pointer;
    }
    .chase-row:first-child { border-top: 0; }
    .chase-row:hover { background: #f7faf9; }
    .chase-row .c-cust { font-weight: 600; color: var(--ink); }
    .chase-row .c-cust small { display: block; font-weight: 400; font-size: 11.5px; color: var(--muted); }
    .chase-row .c-amt { font-weight: 700; color: var(--navy-dark); }
    .chase-row .c-age { font-size: 12px; color: var(--muted); }
    .chase-row .c-age .hot { color: var(--red); font-weight: 700; }
    .fu-badge { display: inline-block; margin-top: 3px; font-size: 11px; font-weight: 700; letter-spacing: .03em; padding: 2px 8px; border-radius: 999px; background: var(--teal-light); color: var(--navy-dark); }
    .fu-badge.none { background: #eef0f6; color: var(--muted); }
    .fu-badge.last { background: #fde8e6; color: var(--red); }
    .chase-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
    .btn-mini { font: 600 12px 'Montserrat', sans-serif; padding: 7px 13px; border-radius: 6px; background: var(--navy-mid); color: #fff; }
    .btn-mini:hover { filter: brightness(1.1); }
    .btn-mini:disabled { opacity: .5; cursor: default; }
    .btn-mini.ghost { background: #eef0f6; color: var(--navy-mid); }
    .chase-more { padding: 11px 18px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); }
    .c-amt-inline { display: none; }
    @media (max-width: 760px) {
      /* Two columns: the quote stacks on the left, the action holds the right.
         The value moves into the reference line rather than being dropped —
         it is the strongest signal for which quote to chase first. */
      .chase-row { grid-template-columns: 1fr auto; row-gap: 6px; align-items: start; }
      .chase-row .c-amt { display: none; }
      .chase-row .c-cust, .chase-row .c-age { grid-column: 1; }
      .chase-row .chase-actions { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
      .c-amt-inline { display: inline; }
    }

    /* ============================================================
       ENQUIRIES
       ============================================================ */
    .enq-card {
      background: var(--card); border-radius: var(--r); box-shadow: var(--shadow);
      padding: 18px 20px; margin-bottom: 14px; border-left: 4px solid var(--teal);
    }
    .enq-card.s-new { border-left-color: var(--red); }
    .enq-card.s-called { border-left-color: #d97706; }
    .enq-card.s-converted { border-left-color: var(--green); }
    .enq-card .e-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
    .enq-card .e-name { font-family: 'Montserrat'; font-weight: 700; font-size: 16px; color: var(--navy-dark); }
    .enq-card .e-meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .enq-card .e-when { font-size: 12px; color: var(--muted); }
    .enq-card .e-detail { margin-top: 12px; font-size: 14px; color: var(--ink); }
    .enq-card .e-fields { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 8px; font-size: 13px; color: var(--muted); }
    .enq-card .e-fields strong { color: var(--navy-mid); }
    .enq-card .e-desc { margin-top: 10px; padding: 10px 12px; background: #f8f9fc; border-radius: var(--r-sm); font-size: 13.5px; color: var(--ink); white-space: pre-wrap; }
    .enq-card .e-photos { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .enq-card .e-photos img { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); cursor: pointer; }
    .enq-card .e-actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    .btn-convert { background: var(--green); color: #fff; font-weight: 700; padding: 9px 16px; border-radius: var(--r-sm); }
    .btn-convert:hover { filter: brightness(1.08); }
    .e-pill { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
    .e-pill.new { background: #fee2e2; color: #991b1b; }
    .e-pill.called { background: #fef3c7; color: #92590a; }
    .e-pill.converted { background: #d1fae5; color: #065f46; }
    .enq-rooms { margin-top: 12px; }
    .enq-room { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; }
    .enq-room:first-child { border-top: none; padding-top: 0; }
    .enq-room-name { font-family: 'Montserrat', sans-serif; font-weight: 700; color: var(--navy-mid); font-size: 14px; margin-bottom: 4px; }
    .enq-items { list-style: none; padding: 0; margin: 0; }
    .enq-items li { font-size: 13.5px; color: var(--ink); padding: 2px 0; }
    .enq-items li small { display: inline-block; margin-left: 6px; font-size: 11px; font-style: italic; }

    /* ============================================================
       NAV BAR (secondary, under topbar)
       ============================================================ */
    .navbar {
      display: flex; align-items: center; gap: 4px;
      background: var(--card); border-bottom: 1px solid var(--line);
      padding: 0 22px; box-shadow: 0 1px 2px rgba(26,28,80,.04);
    }
    .navbar a {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 14px 16px; font-size: 14px; font-weight: 600;
      color: var(--muted); text-decoration: none;
      border-bottom: 2.5px solid transparent; cursor: pointer;
      transition: color .15s, border-color .15s;
    }
    .navbar a:hover { color: var(--navy-mid); }
    .navbar a.active { color: var(--navy-dark); border-bottom-color: var(--red); }
    /* Count of new enquiries, sitting on the Enquiries tab */
    .nav-badge {
      min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px;
      background: var(--red); color: #fff;
      font-size: 11.5px; font-weight: 700; line-height: 20px; text-align: center;
    }

    /* ============================================================
       JOBS LIST
       ============================================================ */
    .list-controls {
      display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
      margin-bottom: 18px;
    }
    .search-box {
      flex: 1; min-width: 220px;
      padding: 11px 14px; border: 1.5px solid var(--line);
      border-radius: var(--r-sm); background: var(--card);
    }
    .search-box:focus { outline: none; border-color: var(--navy-mid); box-shadow: 0 0 0 3px rgba(43,45,126,.12); }

    .filter-chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
      background: #eef0f6; color: var(--navy-mid); cursor: pointer;
      border: 1.5px solid transparent; transition: all .12s;
    }
    .chip:hover { background: #e3e6f1; }
    .chip.active { background: var(--navy-mid); color: #fff; }

    .btn-new {
      background: var(--red); color: #fff; font-weight: 700; font-size: 14px;
      padding: 11px 18px; border-radius: var(--r-sm); white-space: nowrap;
    }
    .btn-new:hover { filter: brightness(1.08); }

    .jobs-table { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
    .job-row {
      display: grid;
      grid-template-columns: 105px 105px 1fr 150px 100px 120px 130px;
      gap: 16px; align-items: center;
      padding: 16px 20px; border-bottom: 1px solid var(--line);
      cursor: pointer; transition: background .12s;
    }
    .job-row:last-child { border-bottom: none; }
    .job-row:hover { background: #f8f9fc; }
    .job-row .dq { font-family: 'Montserrat'; font-weight: 800; color: var(--navy-mid); font-size: 14px; }
    .job-row .fergus { font-family: 'Montserrat'; font-weight: 600; color: var(--muted); font-size: 13px; }
    .job-row .cust { font-weight: 600; }
    .job-row .cust small { display: block; color: var(--muted); font-weight: 400; font-size: 12.5px; }
    .job-row .addr { color: var(--muted); font-size: 13px; }
    .job-row .date { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
    .job-row .amt { font-family: 'Montserrat'; font-weight: 700; text-align: right; }
    .row-arch-wrap { display: inline-block; }
    .row-arch { font-family: 'Open Sans'; font-weight: 600; font-size: 11px; color: var(--muted); cursor: pointer; margin-left: 8px; padding: 2px 7px; border-radius: 5px; background: #eef0f6; white-space: nowrap; }
    .row-arch:hover { background: #e3e6f1; color: var(--navy-mid); }
    .job-row .hdr { font-weight: 700; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
    .job-row .hdr[data-sort] { cursor: pointer; user-select: none; }
    .job-row .hdr[data-sort]:hover { color: var(--navy-mid); }
    .job-row .hdr .sort-arrow { font-size: 9px; margin-left: 3px; opacity: .35; }
    .job-row .hdr.sorted { color: var(--navy-mid); }
    .job-row .hdr.sorted .sort-arrow { opacity: 1; }
    .job-row.head { cursor: default; background: #fafbfd; }
    .job-row.head:hover { background: #fafbfd; }

    .status-pill {
      display: inline-block; padding: 4px 10px; border-radius: 999px;
      font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    }
    .s-quoted     { background: #fef3c7; color: #92590a; }
    .s-confirmed  { background: #dbeafe; color: #1e40af; }
    .s-in_progress{ background: #e0e7ff; color: #3730a3; }
    .s-complete   { background: #d1fae5; color: #065f46; }
    .s-invoiced   { background: #ede9fe; color: #5b21b6; }
    .s-rehung     { background: #ccfbf1; color: #115e59; }
    .s-declined   { background: #fee2e2; color: #991b1b; }

    /* ============================================================
       JOB PAGE
       ============================================================ */
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--navy-mid); font-weight: 600; font-size: 14px;
      cursor: pointer; margin-bottom: 14px; background: none;
    }
    .back-link:hover { text-decoration: underline; }

    .job-header {
      background: var(--card); border-radius: var(--r); box-shadow: var(--shadow);
      padding: 22px 24px; margin-bottom: 20px;
    }
    .job-header .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
    .job-header h1 { font-size: 24px; font-weight: 800; }
    .job-header .dq-big { font-family: 'Montserrat'; font-weight: 800; color: var(--navy-mid); font-size: 15px; margin-top: 2px; }
    .job-header .meta { color: var(--muted); font-size: 13.5px; margin-top: 4px; }

    /* Tappable status bar */
    .status-bar { display: flex; gap: 0; margin-top: 20px; border-radius: var(--r-sm); overflow: hidden; border: 1px solid var(--line); }
    .status-step {
      flex: 1; text-align: center; padding: 12px 4px; font-size: 11.5px; font-weight: 700; line-height: 1.25;
      background: #f3f4f8; color: var(--muted); cursor: pointer; position: relative;
      transition: background .15s, color .15s; border-right: 1px solid var(--line);
      text-transform: uppercase; letter-spacing: .03em;
    }
    .status-step:last-child { border-right: none; }
    .status-step:hover { background: #e8eaf2; }
    .status-step.done { background: var(--teal); color: #fff; }
    .status-step.current { background: var(--navy-mid); color: #fff; }
    .status-step.current::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: var(--red);
    }

    .job-section {
      background: var(--card); border-radius: var(--r); box-shadow: var(--shadow);
      margin-bottom: 16px; overflow: hidden;
    }
    .job-section > .sec-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 22px; cursor: pointer; user-select: none;
    }
    .job-section > .sec-head:hover { background: #f8f9fc; }
    .job-section .sec-head h3 { font-size: 16px; font-weight: 700; }
    .job-section .sec-head .chev { color: var(--muted); transition: transform .2s; font-size: 13px; }
    .job-section.open .sec-head .chev { transform: rotate(90deg); }
    .job-section .sec-body { padding: 0 22px 22px; display: none; }
    .job-section.open .sec-body { display: block; }

    .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
    .detail-grid .field { margin: 0; }

    .placeholder-note {
      color: var(--muted); font-size: 14px; padding: 8px 0;
      border-left: 3px solid var(--teal-light); padding-left: 14px;
    }

    /* ============================================================
       QUOTE BUILDER
       ============================================================ */
    .qb-lines { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
    .qb-line {
      display: grid; gap: 10px; align-items: end;
      grid-template-columns: 1.6fr 1fr 0.9fr 0.9fr auto auto;
      background: #f8f9fc; border: 1px solid var(--line); border-radius: var(--r-sm);
      padding: 12px;
    }
    .qb-line.repair { grid-template-columns: 2fr 0.8fr 1fr auto; }
    .qb-line .mini-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; display: block; }
    .qb-line select, .qb-line input {
      width: 100%; padding: 9px 10px; border: 1.5px solid var(--line); border-radius: 6px; background: #fff; font-size: 14px;
    }
    .qb-line select:focus, .qb-line input:focus { outline: none; border-color: var(--navy-mid); box-shadow: 0 0 0 2px rgba(43,45,126,.12); }
    .qb-line .line-amt { font-family: 'Montserrat'; font-weight: 800; color: var(--navy-dark); font-size: 15px; white-space: nowrap; text-align: right; min-width: 84px; }
    .qb-line .line-basis { font-size: 11px; color: var(--muted); text-align: right; margin-top: 2px; }
    .cm-tag { display: block; font-size: 10.5px; color: #b45309; font-style: italic; margin-top: 3px; font-weight: 600; }

    /* Enquiry-source panel in quote builder */
    .es-panel { background: #fafbfd; border: 1px solid var(--line); border-left: 4px solid var(--teal); border-radius: var(--r-sm); padding: 0; margin-bottom: 16px; }
    .es-panel summary { padding: 11px 16px; cursor: pointer; font-weight: 700; color: var(--navy-dark); font-size: 13.5px; list-style: none; }
    .es-panel summary::-webkit-details-marker { display: none; }
    .es-panel summary:before { content: '▸ '; color: var(--teal); font-weight: 800; }
    .es-panel[open] summary:before { content: '▾ '; }
    .es-panel .es-body { padding: 4px 16px 16px; }
    .es-panel .es-fields { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
    .es-panel .es-fields strong { color: var(--navy-mid); }
    .es-panel .es-rating { font-size: 13.5px; color: var(--ink); margin-bottom: 6px; }
    .es-panel .es-obs { font-size: 13.5px; color: var(--ink); margin-bottom: 6px; }
    .es-panel .es-obs strong { color: var(--navy-mid); }
    .es-panel .es-desc { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 13.5px; color: var(--ink); white-space: pre-wrap; margin: 8px 0; }
    .es-panel .es-room { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 8px; }
    .es-panel .es-room-name { font-family: 'Montserrat'; font-weight: 700; color: var(--navy-mid); font-size: 13.5px; margin-bottom: 4px; }
    .es-panel .es-items { list-style: disc; padding-left: 20px; margin: 4px 0; }
    .es-panel .es-items li { font-size: 13px; color: var(--ink); padding: 1px 0; }
    .es-panel .es-photos { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .es-panel .es-thumb, .es-panel img.es-thumb { width: 80px; height: 80px; border-radius: 6px; object-fit: cover; border: 1px solid var(--line); background: #eef0f6; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #999; }

    /* ============================================================
       ADMIN PANEL
       ============================================================ */
    .admin-tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 2px solid var(--line); margin-bottom: 24px; }
    .admin-tab {
      padding: 11px 18px; font-size: 14px; font-weight: 600; color: var(--muted);
      cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px;
      transition: all .12s;
    }
    .admin-tab:hover { color: var(--navy-mid); }
    .admin-tab.active { color: var(--navy-dark); border-bottom-color: var(--navy-mid); }
    .admin-section { background: var(--card); border-radius: var(--r); padding: 24px 28px; box-shadow: var(--shadow); margin-bottom: 18px; }
    .admin-section h3 { font-family: 'Montserrat'; font-size: 16px; color: var(--navy-dark); margin-bottom: 4px; }
    .admin-section .section-hint { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
    .admin-section .field { margin-bottom: 14px; }
    .admin-section input, .admin-section textarea { width: 100%; padding: 10px 13px; border: 1.5px solid var(--line); border-radius: var(--r-sm); font-size: 14px; }
    .admin-section input:focus, .admin-section textarea:focus { outline: none; border-color: var(--navy-mid); box-shadow: 0 0 0 3px rgba(43,45,126,.12); }
    .admin-section textarea { font-family: inherit; resize: vertical; min-height: 90px; }
    .price-grid { display: grid; grid-template-columns: 1fr 140px; gap: 6px 12px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--line); }
    .price-grid:last-child { border-bottom: none; }
    .price-grid .p-label { font-size: 13.5px; color: var(--ink); }
    .price-grid .p-label small { color: var(--muted); font-size: 11.5px; display: block; }
    .price-grid input { padding: 7px 10px; font-size: 13.5px; text-align: right; }
    .price-group { margin-bottom: 22px; }
    .price-group h4 { font-family: 'Montserrat'; font-size: 13px; color: var(--navy-mid); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
    .save-bar { position: sticky; bottom: 0; background: var(--bg); padding: 14px 0; margin-top: 8px; display: flex; gap: 10px; align-items: center; }
    .save-bar .save-status { color: var(--muted); font-size: 13px; }
    .save-bar .save-status.dirty { color: #b45309; font-weight: 600; }
    .save-bar .save-status.saved { color: var(--green); }
    .ph-row { padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
    .ph-row:last-child { border-bottom: none; }
    .ph-row .ph-when { color: var(--muted); font-size: 12px; }
    .ph-row .ph-arrow { color: var(--muted); margin: 0 6px; }
    .ph-row strong { color: var(--navy-mid); }
    .qb-mould { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--navy-mid); white-space: nowrap; padding-bottom: 9px; }
    .qb-mould input { width: auto; }
    .qb-rate-wrap { position: relative; }
    .qb-rate { font-weight: 700; }
    .qb-rate.override { border-color: var(--red) !important; background: #fff5f5 !important; }
    .qb-rate-reset {
      position: absolute; right: 4px; top: 27px; background: #fee2e2; color: var(--red);
      border-radius: 4px; font-size: 10px; font-weight: 700; padding: 2px 5px; cursor: pointer; line-height: 1.2;
    }
    .qb-rate-reset:hover { background: #fecaca; }
    .qb-del { background: #fee2e2; color: var(--red); border-radius: 6px; padding: 9px 11px; font-weight: 700; font-size: 16px; line-height: 1; align-self: end; height: 38px; }
    .qb-del:hover { background: #fecaca; }

    .qb-add-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .qb-add { background: #eef0f6; color: var(--navy-mid); font-weight: 700; font-size: 13px; padding: 9px 14px; border-radius: var(--r-sm); }
    .qb-add:hover { background: #e3e6f1; }

    /* Room cards */
    .qb-room {
      border: 1.5px solid #d9dcec; border-radius: var(--r); margin-bottom: 16px;
      background: #fcfcfe; overflow: hidden;
    }
    .qb-room-head {
      display: flex; align-items: center; gap: 10px;
      background: #eef0f6; padding: 12px 14px; border-bottom: 1px solid #d9dcec;
    }
    .qb-room-head input.room-name {
      flex: 1; font-family: 'Montserrat'; font-weight: 700; font-size: 15px; color: var(--navy-dark);
      border: 1.5px solid transparent; background: transparent; padding: 6px 8px; border-radius: 6px;
    }
    .qb-room-head input.room-name:hover { background: #fff; }
    .qb-room-head input.room-name:focus { outline: none; background: #fff; border-color: var(--navy-mid); }
    .qb-room-subtotal { font-family: 'Montserrat'; font-weight: 700; font-size: 14px; color: var(--navy-mid); white-space: nowrap; }
    .qb-room-del { background: #fee2e2; color: var(--red); border-radius: 6px; padding: 7px 11px; font-weight: 700; font-size: 13px; }
    .qb-room-del:hover { background: #fecaca; }
    .qb-room-body { padding: 14px; }
    .qb-room-add { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    .qb-room-add .qb-add { font-size: 12px; padding: 7px 11px; }

    .qb-add-room {
      background: var(--navy-mid); color: #fff; font-weight: 700; font-size: 14px;
      padding: 11px 18px; border-radius: var(--r-sm); margin-bottom: 18px;
    }
    .qb-add-room:hover { filter: brightness(1.1); }

    .qb-block-title { font-family: 'Montserrat'; font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--navy-mid); margin: 18px 0 10px; }

    .qb-extras { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 8px; }
    .qb-extras .field { margin: 0; }
    .qb-extras label { font-size: 12px; }
    .qb-extras input { width: 100%; padding: 9px 10px; border: 1.5px solid var(--line); border-radius: 6px; }
    .qb-fuel-toggle { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: var(--navy-mid); margin-bottom: 10px; }

    .qb-discount { display: flex; gap: 10px; align-items: end; margin: 8px 0 4px; flex-wrap: wrap; }
    .qb-discount .field { margin: 0; }
    .qb-discount select, .qb-discount input { padding: 9px 10px; border: 1.5px solid var(--line); border-radius: 6px; }

    .qb-totals { background: var(--navy-dark); color: #fff; border-radius: var(--r-sm); padding: 16px 20px; margin-top: 18px; }
    .qb-totals .row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 14px; }
    .qb-totals .row.grand { font-family: 'Montserrat'; font-weight: 800; font-size: 20px; border-top: 1px solid rgba(255,255,255,.2); margin-top: 6px; padding-top: 10px; }
    .qb-totals .row .lbl { color: rgba(255,255,255,.8); }
    .qb-totals .row.disc .lbl, .qb-totals .row.disc .val { color: var(--teal-light); }

    .qb-actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
    .btn-save-quote { background: var(--green); color: #fff; font-weight: 700; padding: 11px 20px; border-radius: var(--r-sm); }
    .btn-save-quote:hover { filter: brightness(1.08); }
    .btn-email { background: var(--navy-mid); color: #fff; font-weight: 700; padding: 11px 20px; border-radius: var(--r-sm); }
    .btn-email:hover { filter: brightness(1.1); }

    /* Compose email modal */
    .compose .m-body .field { margin-bottom: 12px; }
    .compose .cc-locked {
      display: flex; align-items: center; gap: 8px; background: #f3f4f8;
      border: 1.5px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px;
      font-size: 13.5px; color: var(--muted);
    }
    .compose .cc-locked .lock { font-size: 11px; }
    .compose textarea { width: 100%; padding: 11px 13px; border: 1.5px solid var(--line); border-radius: var(--r-sm); font-size: 14px; line-height: 1.5; resize: vertical; }
    .compose textarea:focus, .compose input:focus { outline: none; border-color: var(--navy-mid); box-shadow: 0 0 0 3px rgba(43,45,126,.12); }
    .compose .attach-chip {
      display: inline-flex; align-items: center; gap: 8px; background: #eef0f6;
      border-radius: var(--r-sm); padding: 8px 12px; font-size: 13px; font-weight: 600; color: var(--navy-mid);
    }
    .email-log { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
    .email-log .log-row { font-size: 12.5px; color: var(--muted); padding: 3px 0; }
    .email-log .log-row strong { color: var(--navy-mid); }

    /* ============================================================
       ACCEPTANCE
       ============================================================ */
    .acc-chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 16px; }
    .acc-chip {
      padding: 9px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 600;
      background: #eef0f6; color: var(--navy-mid); cursor: pointer; border: 1.5px solid transparent;
      transition: all .12s;
    }
    .acc-chip:hover { background: #e3e6f1; }
    .acc-chip.active { background: var(--navy-mid); color: #fff; }
    .acc-terms { display: flex; align-items: center; gap: 9px; font-size: 14px; color: var(--ink); margin-bottom: 16px; }
    .acc-terms input { width: auto; }
    .acc-confirmed-banner {
      background: #d1fae5; border: 1px solid #6ee7b7; border-radius: var(--r-sm);
      padding: 12px 16px; font-size: 14px; color: #065f46; margin-bottom: 16px;
    }
    .acc-confirmed-banner strong { color: #064e3b; }
    .acc-blocked { color: var(--muted); font-size: 13.5px; font-style: italic; margin-bottom: 12px; }
    .btn-confirm { background: var(--teal); color: #fff; font-weight: 700; padding: 11px 22px; border-radius: var(--r-sm); }
    .btn-confirm:hover { filter: brightness(1.08); }
    .btn-confirm:disabled { opacity: .5; cursor: default; }

    .jobcard-box {
      background: #1a1c50; color: #e8eaf5; border-radius: var(--r-sm);
      padding: 16px 18px; font-family: 'Courier New', monospace; font-size: 12.5px;
      white-space: pre-wrap; line-height: 1.5; margin: 12px 0; max-height: 360px; overflow-y: auto;
    }
    .jobcard-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-copy { background: var(--navy-mid); color: #fff; font-weight: 700; padding: 10px 18px; border-radius: var(--r-sm); }
    .btn-copy:hover { filter: brightness(1.1); }

    /* ============================================================
       INSPECTION FORMS
       ============================================================ */
    .insp-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
    .insp-row .field { margin: 0; }
    .insp-row select, .insp-row input { width: 100%; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--r-sm); }
    .insp-row select:focus, .insp-row input:focus { outline: none; border-color: var(--navy-mid); box-shadow: 0 0 0 3px rgba(43,45,126,.12); }

    .check-group { margin-bottom: 16px; }
    .check-group h4 { font-family: 'Montserrat'; font-size: 13px; font-weight: 700; color: var(--navy-mid); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 8px; }
    .check-items { display: flex; flex-direction: column; gap: 6px; }
    .check-item { display: flex; align-items: center; gap: 10px; }
    .check-item label { display: flex; align-items: center; gap: 8px; font-size: 14px; min-width: 150px; cursor: pointer; }
    .check-item input[type=checkbox] { width: auto; }
    .check-item .note-in { flex: 1; padding: 7px 10px; border: 1.5px solid var(--line); border-radius: 6px; font-size: 13px; }
    .check-item .note-in:focus { outline: none; border-color: var(--navy-mid); }
    .check-item.checked label { font-weight: 700; color: var(--navy-dark); }

    .score-wrap { margin-bottom: 16px; }
    .score-wrap label { font-size: 13px; font-weight: 700; color: var(--navy-mid); display: block; margin-bottom: 6px; }
    .score-row { display: flex; align-items: center; gap: 14px; }
    .score-row input[type=range] { flex: 1; }
    .score-val { font-family: 'Montserrat'; font-weight: 800; font-size: 22px; color: var(--navy-dark); min-width: 48px; text-align: center; }

    .insp-notes .field { margin-bottom: 12px; }
    .insp-notes textarea { width: 100%; padding: 11px 13px; border: 1.5px solid var(--line); border-radius: var(--r-sm); font-size: 14px; resize: vertical; }
    .insp-notes textarea:focus { outline: none; border-color: var(--navy-mid); box-shadow: 0 0 0 3px rgba(43,45,126,.12); }

    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; margin: 10px 0; }
    .photo-thumb { position: relative; aspect-ratio: 1; border-radius: var(--r-sm); overflow: hidden; background: #eef0f6; border: 1px solid var(--line); }
    .photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .photo-thumb .ph-del { position: absolute; top: 4px; right: 4px; background: rgba(224,25,46,.92); color: #fff; border-radius: 5px; padding: 2px 7px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .photo-thumb.uploading { display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--muted); }
    .photo-add {
      aspect-ratio: 1; border: 2px dashed #c5c9dc; border-radius: var(--r-sm);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; color: var(--navy-mid); font-size: 13px; font-weight: 600; cursor: pointer; background: #fafbfd;
    }
    .photo-add:hover { border-color: var(--navy-mid); background: #f3f4f8; }
    .photo-add .plus { font-size: 24px; }
    .photo-count { font-size: 12px; color: var(--muted); margin-bottom: 4px; }

    .treatments { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .treat-chip { padding: 9px 15px; border-radius: 999px; font-size: 13.5px; font-weight: 600; background: #eef0f6; color: var(--navy-mid); cursor: pointer; border: 1.5px solid transparent; }
    .treat-chip.active { background: var(--teal); color: #fff; }
    .outcome-sel select { width: 100%; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--r-sm); }

    .btn-insp-save { background: var(--green); color: #fff; font-weight: 700; padding: 11px 22px; border-radius: var(--r-sm); }
    .btn-insp-save:hover { filter: brightness(1.08); }
    .insp-saved-banner { background: #d1fae5; border: 1px solid #6ee7b7; border-radius: var(--r-sm); padding: 10px 14px; font-size: 13.5px; color: #065f46; margin-bottom: 14px; }

    .qb-insurer { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 4px; }
    .qb-insurer .field { margin: 0; }

    /* ============================================================
       MODAL
       ============================================================ */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(18,20,61,.55);
      display: flex; align-items: center; justify-content: center;
      z-index: 1500; padding: 20px;
    }
    .modal {
      background: var(--card); border-radius: 16px; width: 100%; max-width: 520px;
      max-height: 90vh; overflow-y: auto; box-shadow: 0 24px 60px rgba(0,0,0,.4);
    }
    .modal .m-head { padding: 22px 24px 6px; }
    .modal .m-head h2 { font-size: 20px; font-weight: 800; }
    .modal .m-head p { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
    .modal .m-body { padding: 16px 24px; }
    .modal .m-foot { padding: 16px 24px 22px; display: flex; gap: 10px; justify-content: flex-end; }
    .modal .field select, .modal .field textarea {
      width: 100%; padding: 11px 13px; border: 1.5px solid var(--line); border-radius: var(--r-sm);
    }
    .modal .field select:focus, .modal .field textarea:focus { outline: none; border-color: var(--navy-mid); box-shadow: 0 0 0 3px rgba(43,45,126,.12); }
    .modal .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn-secondary { background: #eef0f6; color: var(--navy-mid); }
    .btn-secondary:hover { background: #e3e6f1; }
    .modal-error { background: #fef2f2; color: var(--red); border: 1px solid #fecaca; border-radius: var(--r-sm); padding: 9px 12px; font-size: 13px; margin-bottom: 12px; }
    .modal-match { background: #eff6ff; color: #1e3a8a; border: 1px solid #bfdbfe; border-radius: var(--r-sm); padding: 9px 12px; font-size: 13px; margin-bottom: 12px; line-height: 1.5; }
    .modal-match b { font-weight: 700; }
    .modal-match .mm-jobs { margin-top: 5px; color: #1e40af; font-size: 12px; }
    .modal-match.mm-warn { background: #fffbeb; color: #92400e; border-color: #fde68a; }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--navy-dark); color: #fff;
      padding: 12px 20px; border-radius: var(--r-sm);
      font-size: 14px; font-weight: 600;
      box-shadow: 0 12px 32px rgba(0,0,0,.3);
      opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
      z-index: 2000;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

    /* ============================================================
       ITEMS · TAKEDOWN · PRODUCTION · REHANG
       Big tap targets — this is used on a phone in a driveway and
       on a tablet in the plant, not just on a desk.
       ============================================================ */
    .it-tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 2px solid var(--line); margin-bottom: 16px; }
    .it-tab {
      padding: 10px 16px; font-family: 'Montserrat'; font-weight: 700; font-size: 13.5px;
      color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -2px; cursor: pointer;
      user-select: none; border-radius: 6px 6px 0 0;
    }
    .it-tab:hover { color: var(--navy-mid); }
    .it-tab.active { color: var(--navy-dark); border-bottom-color: var(--navy-mid); }
    .it-tab .it-count { font-size: 11px; color: var(--muted); font-weight: 600; margin-left: 5px; }

    .it-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
    .it-prog { flex: 1; min-width: 160px; }
    .it-prog-track { height: 8px; background: #e9ebf2; border-radius: 99px; overflow: hidden; }
    .it-prog-fill { height: 100%; background: var(--teal); border-radius: 99px; transition: width .25s; }
    .it-prog-label { font-size: 12px; color: var(--muted); margin-top: 5px; font-weight: 600; }

    .it-room { font-family: 'Montserrat'; font-weight: 700; font-size: 13px; text-transform: uppercase;
      letter-spacing: .05em; color: var(--navy-mid); margin: 18px 0 8px; }
    .it-room:first-child { margin-top: 0; }

    .it-row {
      border: 1.5px solid var(--line); border-radius: var(--r-sm); background: #fff;
      padding: 12px 14px; margin-bottom: 10px; display: flex; gap: 12px; align-items: flex-start;
    }
    .it-row.done { background: #f0fdf9; border-color: #99e6d5; }
    .it-row.issue { background: #fffbeb; border-color: #fde68a; }
    .it-tick {
      width: 40px; height: 40px; min-width: 40px; border-radius: 8px; border: 2px solid #cbd0e0;
      background: #fff; font-size: 20px; line-height: 1; color: transparent; flex-shrink: 0;
    }
    .it-row.done .it-tick { background: var(--teal); border-color: var(--teal); color: #fff; }
    .it-main { flex: 1; min-width: 0; }
    .it-name { font-weight: 700; font-size: 14.5px; color: var(--navy-dark); }
    .it-ref { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; color: var(--muted); font-weight: 600; }
    .it-dims { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .it-flags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
    .it-flag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: #eef0f6; color: var(--navy-mid); }
    .it-flag.mould { background: #fef3c7; color: #92400e; }
    .it-flag.bag { background: #e0e7ff; color: #3730a3; }
    .it-flag.loc { background: #dcfce7; color: #166534; }
    .it-meta { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
    .it-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-top: 10px; }
    .it-fields input, .it-fields select {
      width: 100%; padding: 9px 11px; border: 1.5px solid var(--line); border-radius: 6px; font-size: 13.5px;
    }
    .it-fields input:focus, .it-fields select:focus { outline: none; border-color: var(--navy-mid); }
    .it-fields label { display: block; font-size: 10.5px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .04em; color: var(--muted); margin-bottom: 3px; }
    .it-pieces { width: 68px; text-align: center; font-weight: 700; }

    .it-extra { border: 1.5px dashed #cbd0e0; background: #fafbfe; }
    .it-empty { color: var(--muted); font-size: 14px; padding: 18px 0; }
    .it-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    .btn-print { background: var(--navy-mid); color: #fff; font-weight: 700; padding: 11px 20px; border-radius: var(--r-sm); }
    .btn-print:hover { filter: brightness(1.1); }
    .it-note {
      background: #eff6ff; border: 1px solid #bfdbfe; color: #1e3a8a; border-radius: var(--r-sm);
      padding: 10px 13px; font-size: 13px; margin-bottom: 14px; line-height: 1.5;
    }
    .it-note.warn { background: #fffbeb; border-color: #fde68a; color: #92400e; }

    /* Activity timeline */
    .act-list { list-style: none; }
    .act-item { display: flex; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
    .act-item:last-child { border-bottom: none; }
    .act-dot { width: 9px; height: 9px; border-radius: 99px; background: var(--navy-mid); margin-top: 7px; flex-shrink: 0; }
    .act-dot.prod { background: var(--teal); }
    .act-dot.take { background: #6366f1; }
    .act-dot.hang { background: var(--green); }
    .act-body { flex: 1; min-width: 0; }
    .act-what { font-size: 14px; font-weight: 600; color: var(--navy-dark); }
    .act-when { font-size: 12px; color: var(--muted); margin-top: 1px; }

    @media (max-width: 700px) {
      .it-row { flex-wrap: wrap; }
      .it-fields { grid-template-columns: 1fr 1fr; }
      .it-tab { padding: 9px 11px; font-size: 12.5px; }
    }

    /* ============================================================
       RUN SHEET
       Designed phone-first and given its own shell, because the rest of
       the app assumes a desktop and making all of it responsive was a
       far bigger job than making this one screen work properly.
       ============================================================ */
    .rs-wrap { max-width: 720px; margin: 0 auto; }
    .rs-loading { text-align: center; color: var(--muted); padding: 40px 0; font-size: 15px; }

    .rs-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; flex-wrap: wrap; margin-bottom: 14px;
    }
    .rs-days { display: flex; align-items: center; gap: 6px; }
    .rs-day {
      width: 44px; height: 44px; border-radius: var(--r-sm);
      background: var(--card); border: 1px solid var(--line);
      font-size: 20px; line-height: 1; color: var(--navy-mid); font-weight: 700;
    }
    .rs-day:hover { background: #eef0f7; }
    .rs-daylabel { min-width: 168px; text-align: center; line-height: 1.25; }
    .rs-daylabel strong { display: block; font-size: 19px; font-weight: 800; color: var(--navy-dark); }
    .rs-daylabel span { font-size: 12.5px; color: var(--muted); }

    .rs-tools { display: flex; align-items: center; gap: 8px; }
    .rs-select {
      height: 44px; padding: 0 10px; border-radius: var(--r-sm);
      border: 1px solid var(--line); background: var(--card); font-size: 14px; color: var(--ink);
    }
    .rs-refresh {
      height: 44px; padding: 0 16px; border-radius: var(--r-sm);
      background: var(--navy-mid); color: #fff; font-size: 14px; font-weight: 600;
    }
    .rs-refresh:disabled { opacity: .6; }

    .rs-banner {
      background: #fff7ed; border: 1px solid #fed7aa; color: #9a3412;
      padding: 10px 14px; border-radius: var(--r-sm); font-size: 13.5px; margin-bottom: 12px;
    }
    .rs-banner.rs-bad { background: #fef2f2; border-color: #fecaca; color: #991b1b; }
    .rs-count { font-size: 12.5px; color: var(--muted); margin-bottom: 10px;
                text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }

    .rs-empty { background: var(--card); border-radius: var(--r-md); padding: 40px 20px;
                text-align: center; box-shadow: var(--shadow); }
    .rs-empty h3 { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
    .rs-empty p { color: var(--muted); font-size: 14px; }

    /* ---------- One stop ---------- */
    .rs-stop {
      background: var(--card); border-radius: var(--r-md); box-shadow: var(--shadow);
      padding: 16px; margin-bottom: 14px; border-left: 4px solid var(--line);
    }
    .rs-stop.rs-takedown { border-left-color: var(--red); }
    .rs-stop.rs-rehang   { border-left-color: var(--teal); }
    .rs-stop.rs-other    { border-left-color: var(--muted); }

    .rs-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
    .rs-time { font-size: 21px; font-weight: 800; color: var(--navy-dark);
               font-variant-numeric: tabular-nums; }
    .rs-badge {
      font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
      padding: 4px 9px; border-radius: 999px;
    }
    .rs-b-takedown { background: #fee2e2; color: #991b1b; }
    .rs-b-rehang   { background: #ccfbf1; color: #115e59; }
    .rs-b-other    { background: #e5e7eb; color: #374151; }
    .rs-jobno { margin-left: auto; font-size: 12.5px; color: var(--muted); font-weight: 600; }

    .rs-cust { font-size: 17px; font-weight: 700; color: var(--navy-dark); margin-bottom: 6px; }

    /* Address and phone are the two things tapped at the kerb, so both are
       full-width targets rather than inline links. */
    .rs-addr, .rs-phone {
      display: block; padding: 12px 14px; border-radius: var(--r-sm);
      font-size: 15.5px; font-weight: 600; margin-bottom: 8px; text-decoration: none;
    }
    .rs-addr { background: #eef2ff; color: var(--navy-mid); }
    .rs-addr:hover { background: #e0e7ff; }
    .rs-phone { background: #ecfdf5; color: #065f46; }
    .rs-phone:hover { background: #d1fae5; }
    .rs-addr.rs-muted { background: #f3f4f6; color: var(--muted); font-weight: 500; }

    /* The Fergus title carries the real instructions. It is never truncated. */
    .rs-note {
      background: #fffbeb; border: 1px solid #fde68a; color: #78350f;
      padding: 11px 13px; border-radius: var(--r-sm);
      font-size: 14.5px; line-height: 1.45; white-space: pre-wrap; margin-bottom: 8px;
    }
    .rs-note2 { background: #f9fafb; border-color: var(--line); color: var(--ink); }

    .rs-card-items { margin-bottom: 8px; }
    .rs-card-items summary {
      cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--navy-mid);
      padding: 8px 0; list-style: none;
    }
    .rs-card-items summary::before { content: '▸ '; }
    .rs-card-items[open] summary::before { content: '▾ '; }
    .rs-card-items pre {
      background: #f9fafb; border: 1px solid var(--line); border-radius: var(--r-sm);
      padding: 12px; font-size: 13px; line-height: 1.5; white-space: pre-wrap;
      word-break: break-word; font-family: inherit; color: var(--ink);
    }

    .rs-open {
      background: transparent; color: var(--navy-mid); border: 1px solid var(--line);
      padding: 9px 14px; border-radius: var(--r-sm); font-size: 13.5px; font-weight: 600;
    }
    .rs-open:hover { background: #eef0f7; }
    .rs-nolink { font-size: 12.5px; }
    .rs-muted { color: var(--muted); }

    @media (max-width: 900px) {
      /* The jobs list is a seven-column grid with 710px of fixed widths.
         Rather than squash it, each row restacks into a card. Same markup,
         same order — only the placement changes. */
      .job-row {
        grid-template-columns: auto auto 1fr;
        gap: 3px 10px; padding: 14px 16px;
      }
      .job-row .dq     { grid-column: 1; grid-row: 1; }
      .job-row .fergus { grid-column: 2 / -1; grid-row: 1; }
      .job-row .cust   { grid-column: 1 / -1; grid-row: 2; }
      .job-row .addr   { grid-column: 1 / -1; grid-row: 3; }
      .job-row .date   { grid-column: 1; grid-row: 4; align-self: center; }
      .job-row > div:nth-child(6) { grid-column: 2; grid-row: 4; }
      .job-row .amt    { grid-column: 3; grid-row: 4; align-self: center; }
      /* Column headings mean nothing once the row is stacked. Sorting goes
         with them; the default newest-first order is the one that matters. */
      .job-row.head { display: none; }
    }

    @media (max-width: 700px) {
      /* Phone chrome. The nav is six tabs that will not fit across 375px, so
         it scrolls sideways rather than squashing or wrapping to two rows —
         the tab you are on stays where your thumb expects it. */
      .topbar { height: 52px; padding: 0 14px; }
      .topbar .brand { font-size: 16px; }
      .topbar .right { gap: 10px; }
      .who .role { display: none; }
      .navbar {
        padding: 0 10px; gap: 2px;
        overflow-x: auto; flex-wrap: nowrap;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .navbar::-webkit-scrollbar { display: none; }
      .navbar a { padding: 13px 12px; font-size: 13.5px; white-space: nowrap; flex: 0 0 auto; }

      /* Two-up rows have nowhere to go on a phone. */
      .insp-row, .qb-insurer, .modal .row2, .rep-two { grid-template-columns: 1fr; }
      .price-grid { grid-template-columns: 1fr auto; }

      /* Quote lines carry inline column templates set per line type, so the
         override has to win outright. Two columns is tight but workable. */
      .qb-line, .qb-line.repair {
        grid-template-columns: 1fr 1fr !important;
        gap: 8px; padding: 12px;
      }
      .qb-line > *:first-child { grid-column: 1 / -1; }

      /* Anything that still insists on being wide scrolls in its own box
         rather than dragging the whole page sideways. */
      .rep-table-wrap, .jobs-table { max-width: 100%; }

      .rs-head { gap: 10px; }
      .rs-days { width: 100%; justify-content: space-between; }
      .rs-tools { width: 100%; }
      .rs-select { flex: 1; }
      .rs-refresh { flex: 0 0 auto; }
      .rs-daylabel { min-width: 0; flex: 1; }
      .rs-time { font-size: 19px; }
      .rs-jobno { margin-left: 0; width: 100%; }
      .rs-open { width: 100%; min-height: 44px; }
      main { padding: 14px 12px 40px; }
      .topbar { padding: 0 14px; }
    }
  </style>
</head>
<body>
  <!-- Boot splash: shown until session + profile resolve, so nothing
       renders with the wrong company context (no flash of wrong content) -->
  <div id="boot"><div class="spin"></div></div>

  <div id="app" class="hidden">

    <!-- ============= LOGIN VIEW ============= -->
    <section id="login-view">
      <div class="login-card" id="login-card">
        <img class="login-brand" src="brand/drapr-lockup-horizontal-teal.svg" alt="Drapr" />
        <div class="login-sub">Job management & quoting</div>

        <div id="login-note" class="login-note hidden"></div>
        <div id="login-error" class="login-error hidden"></div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="username" placeholder="you@hudsongroup.com.au" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
        </div>
        <button id="login-btn" class="btn btn-primary">Sign in</button>
        <div class="login-alt"><a id="forgot-link">Forgot your password?</a></div>
      </div>

      <!-- Shown instead of the login card when the page is opened from a
           password reset email. -->
      <div class="login-card hidden" id="reset-card">
        <img class="login-brand" src="brand/drapr-lockup-horizontal-teal.svg" alt="Drapr" />
        <div class="login-sub">Set a new password</div>

        <div id="reset-error" class="login-error hidden"></div>

        <div class="field">
          <label for="new-password">New password</label>
          <input id="new-password" type="password" autocomplete="new-password" placeholder="At least 8 characters" />
        </div>
        <div class="field">
          <label for="new-password-2">Confirm new password</label>
          <input id="new-password-2" type="password" autocomplete="new-password" placeholder="Type it again" />
        </div>
        <button id="reset-btn" class="btn btn-primary">Save new password</button>
        <div class="login-alt"><a id="reset-cancel">Back to sign in</a></div>
      </div>
    </section>

    <!-- ============= APP VIEW (post-login) ============= -->
    <section id="app-view" class="hidden">
      <header class="topbar">
        <div class="brand"><img src="brand/drapr-lockup-horizontal-white.svg" alt="Drapr" /></div>
        <div class="right">
          <div class="who">
            <div class="name" id="who-name">—</div>
            <div class="role" id="who-role">—</div>
          </div>
          <button id="logout-btn" class="btn-ghost">Sign out</button>
        </div>
      </header>

      <nav class="navbar" id="navbar">
        <a data-route="dashboard" class="active">Dashboard</a>
        <a data-route="jobs">Jobs</a>
        <a data-route="reports">Reports</a>
        <a data-route="enquiries">Enquiries<span class="nav-badge hidden" id="nav-enq-badge">0</span></a>
        <a data-route="run">Run Sheet</a>
        <a data-route="admin" id="nav-admin" style="display:none">Admin</a>
      </nav>

      <main id="main">
        <!-- Router renders here -->
      </main>
    </section>

    <!-- Modal mount -->
    <div id="modal-mount"></div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module">
    /* ============================================================
       Drapr — single-module app
       Sections:  CONFIG → DB → AUTH → UI → ROUTER → BOOT
       Each build step slots into its named section. No appending
       to the end of a giant script. No multiple script blocks.
       ============================================================ */
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    import { jsPDF } from 'https://esm.sh/jspdf@2.5.1';
    import Chart from 'https://esm.sh/chart.js@4.4.1/auto';

    /* ============================================================
       CONFIG
       Anon key is PUBLIC by design — RLS does the protecting.
       The Resend key is NOT here; it lives in Edge Function env.
       ============================================================ */
    const SUPABASE_URL = 'https://kspezkqanaqrhbirqmlc.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtzcGV6a3FhbmFxcmhiaXJxbWxjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwOTU1MDksImV4cCI6MjA5NDY3MTUwOX0.toB3DTsKZ8Cydhxw4DTJjzmanF7tghHlXQNOzJ4xOiA';

    /* A password reset email lands back here with the recovery token in the
       URL hash, put there by the send-password-reset function. Read it now,
       synchronously, before anything else touches the URL. */
    const readResetToken = () => (location.hash.match(/(?:^|[#&])reset_token=([^&]+)/) || [])[1];
    const RESET_TOKEN = readResetToken();

    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    /* ============================================================
       BRAND — authoritative values from Dr Drapes brand guidelines
       Blue  RGB 50,50,100  (#323264)   Pink RGB 200,27,85 (#C81B55)
       Logo embedded as base64 (palette-quantised PNG, ~8KB).
       ============================================================ */
    const BRAND = {
      blue: [50, 50, 100],
      pink: [200, 27, 85],

      // ---------- CUSTOMERS & SITES ----------
      // Matching mirrors the Postgres generated columns exactly. If you change
      // one you must change the other, or the app and the database will
      // disagree about who is who.
      normPhone(s) {
        let d = String(s || '').replace(/\D/g, '');
        if (!d) return null;
        if (d.startsWith('0011')) d = d.slice(4);            // intl dial-out prefix
        if (/^61[0-9]{9}$/.test(d)) d = '0' + d.slice(2);    // +61 4xx / +61 3 form
        if (/^[2-9][0-9]{8}$/.test(d)) d = '0' + d;          // leading zero dropped
        return d;
      },
      normEmail(s) {
        return String(s || '').trim().toLowerCase() || null;
      },
      normAddress(s) {
        return String(s || '').replace(/[^a-zA-Z0-9]/g, '').toLowerCase() || null;
      },

      // Keep a site's parts in step with what was typed on the job page, so the
      // Fergus match works from structured data rather than one blob of text.
      async updateSite(siteId, p) {
        if (!siteId) return;
        const { error } = await sb.from('sites').update({
          address_line: p.street || null,
          suburb: p.suburb || null,
          state: p.state || 'VIC',
          postcode: p.postcode || null,
          updated_at: new Date().toISOString(),
        }).eq('id', siteId);
        if (error) throw error;
      },

      // Find an existing customer by phone OR email. Deliberately two plain
      // queries rather than one compound `or` filter — values go through as
      // parameters instead of being interpolated into a filter string, and we
      // learn which field produced which match.
      async findCustomer({ phone, email }) {
        const ph = db.normPhone(phone);
        const em = db.normEmail(email);
        if (!ph && !em) return null;

        const COLS = 'id, name, business_name, customer_type, phone, email, notes, marketing_consent, fergus_customer_id';
        const byField = async (col, val) => {
          if (!val) return null;
          const { data, error } = await sb
            .from('customers').select(COLS)
            .eq('archived', false).eq(col, val).limit(1);
          if (error) throw error;
          return (data && data[0]) || null;
        };

        const [byPhone, byEmail] = await Promise.all([
          byField('phone_norm', ph),
          byField('email_norm', em),
        ]);

        if (byPhone && byEmail && byPhone.id !== byEmail.id) {
          // Phone says one person, email says another. Don't guess.
          return { conflict: true, byPhone, byEmail };
        }
        return byPhone || byEmail || null;
      },

      // Every job this customer has had, newest first.
      async customerHistory(customerId) {
        const { data, error } = await sb
          .from('jobs')
          .select('id, quote_number, drd_number, status, site_address, archived, created_at')
          .eq('customer_id', customerId)
          .order('created_at', { ascending: false });
        if (error) throw error;
        return data || [];
      },

      async getCustomer(customerId) {

        if (error) throw error;

      async updateCustomer(customerId, patch) {

      // Find or create the customer, then find or create the site under them.
      // Returns { customer_id, site_id } ready to write onto a job row.
      async resolveCustomerAndSite(fields, existingCustomerId = null) {
        const cid = session.profile.company_id;
        let customer = null;

        if (existingCustomerId) {
          customer = await db.getCustomer(existingCustomerId);
        } else {
          const found = await db.findCustomer({ phone: fields.customer_phone, email: fields.customer_email });
          if (found && !found.conflict) customer = found;
        }

        if (!customer) {
          const { data, error } = await sb.from('customers').insert({
            company_id: cid,
            name: (fields.customer_name || '').trim() || 'Unnamed customer',
            phone: (fields.customer_phone || '').trim() || null,
            email: (fields.customer_email || '').trim() || null,
          }).select().single();
          if (error) throw error;
          customer = data;
        }

        let siteId = null;
        const parts = fields.address || splitAddress(fields.site_address);
        const addr = composeAddress(parts);
        if (addr) {
          // address_norm is generated from address_line + suburb + postcode, so
          // the lookup key has to be built the same way. The composed line
          // carries the state as well and would never match.
          const norm = db.normAddress((parts.street || '') + (parts.suburb || '') + (parts.postcode || ''));
          const { data: found, error: e1 } = await sb.from('sites')
            .select('id').eq('customer_id', customer.id).eq('address_norm', norm).limit(1);
          if (e1) throw e1;
          if (found && found.length) {
            siteId = found[0].id;
          } else {
            const { data: made, error: e2 } = await sb.from('sites')
              .insert({
                company_id: cid, customer_id: customer.id,
                address_line: parts.street || null,
                suburb: parts.suburb || null,
                state: parts.state || 'VIC',
                postcode: parts.postcode || null,
              })
              .select('id').single();
            if (e2) throw e2;
            siteId = made.id;
          }
        }

        return { customer_id: customer.id, site_id: siteId };
      },

      // ---------- JOBS ----------
      // Supabase/PostgREST silently caps a single response at 1,000 rows.
      // pageAll() walks the result set in 1,000-row pages so nothing is ever
      // dropped, no matter how big the job table gets.
      async pageAll(builder, pageSize = 1000, hardCap = 100000) {
        const out = [];
        for (let start = 0; start < hardCap; start += pageSize) {
          const { data, error } = await builder().range(start, start + pageSize - 1);
          if (error) throw error;
          const batch = data || [];
          out.push(...batch);
          if (batch.length < pageSize) break;
        }
        return out;
      },

      // Convert an enquiry into a job: maps customer rooms/items into quote
      // rooms with measurements pre-filled and customer-measured / tier flags.
      async convertEnquiry(enq) {
        const ref = await db.nextQuoteNumber();
        // Friendly enquiry types → catalogue category codes used by quote builder.
        // "unsure" stays empty so staff pick on the line.
        const TYPE_MAP = {
          curtain: 'curtain', sheer: 'sheer', velvet: 'velvet',
          'roller-block': 'roller-block', 'roller-sun': 'roller-sun',
          roman: 'roman', pelmet: 'pelmet', swags: 'swags-tails',
          valance: 'valance', unsure: '',
        };
        // Tier → numeric metre value used by curtain rate-tier logic.
        const TIER_M = { short: 2.4, medium: 3.0, tall: 4.0 };

        const enqRooms = Array.isArray(enq.data?.rooms) ? enq.data.rooms : [];
        // Map customer hardware ticks → quote whole-job repairs.
        // Keys match the public form; map to catalogue codes used in REPAIRS.
        const HW_MAP = {
          'track-replace': { key: 'track-replace', noteHint: 'Customer requested track replacement' },
          'track-service': { key: 'track-repair', noteHint: 'Customer requested track service' },
          'track-parts':   { key: 'track-repair', noteHint: 'Customer requested track parts replacement' },
          'cord-replace':  { key: 'cord-replace', noteHint: 'Customer requested cord replacement' },
          'blind-parts':   { key: 'track-repair', noteHint: 'Customer requested blind parts replacement' },
        };
        const quoteRepairs = (enq.data?.hardware || []).map((hw) => {
          if (hw.key === 'other') return null; // free-text only goes to notes
          const m = HW_MAP[hw.key];
          if (!m) return null;
          return { key: m.key, qty: 1 };
        }).filter(Boolean);

        // Collect a readable summary of the customer's hardware requests for the
        // quote notes — repair rows themselves can't store notes, but the quote
        // notes field shows everything to the customer/staff.
        const hwNotes = (enq.data?.hardware || []).map((hw) => {
          if (hw.key === 'other') return 'Hardware: ' + hw.note;
          const labels = {
            'track-replace': 'Track replacement', 'track-service': 'Service track',
            'track-parts': 'Track part replacements', 'cord-replace': 'Replace cord',
            'blind-parts': 'Blind parts replacement',
          };
          const parts = [labels[hw.key] || hw.key];
          if (hw.width) parts.push('width ' + hw.width);
          if (hw.note) parts.push(hw.note);
          return parts.join(' — ');
        }).filter(Boolean);
        const hwNotesBlock = hwNotes.length ? '\n\nCustomer hardware requests:\n• ' + hwNotes.join('\n• ') : '';

        const quoteRooms = enqRooms.length ? enqRooms.map((er) => {
          const items = (er.items || []).map((it) => {
            const cat = TYPE_MAP[it.type] ?? '';
            const note = it.note || '';
            const tag = it.heightMode === 'tier'
              ? '(customer tier estimate)'
              : (it.width || it.height) ? '(customer-measured)' : '';
            const itemNote = [note, tag].filter(Boolean).join(' · ');
            const drop = it.heightMode === 'tier' ? (TIER_M[it.tier || 'short']) : (it.height || '');
            return {
              cat: cat || 'curtain',
              item_note: itemNote,
              width: it.width || '',
              drop: drop,
              mould: !!it.mould,
              customer_measured: !!(it.width || it.height) && it.heightMode !== 'tier',
              customer_tier: it.heightMode === 'tier' ? (it.tier || 'short') : null,
            };
          });
          return { name: er.name || 'Room', items, repairs: [] };
        }) : [];

        const data = {
          job_type: 'enquiry',
          created_by: session.profile.name,
          enquiry_source: {
            enquiry_id: enq.id,
            submitted_at: enq.submitted_at,
            property_type: enq.data?.property_type || '',
            contact_time: enq.data?.contact_time || '',
            contact_method: enq.data?.contact_method || '',
            description: enq.data?.description || '',
            observation_ticks: enq.data?.observation_ticks || [],
            customer_rating: enq.data?.customer_rating ?? null,
            hardware: enq.data?.hardware || [],
            rooms: enqRooms,
            photos: enq.data?.photos || [],
          },
          quote: quoteRooms.length || quoteRepairs.length || hwNotesBlock
            ? { rooms: quoteRooms, repairs: quoteRepairs, notes: hwNotesBlock ? hwNotesBlock.trim() : '' }
            : {},
          status_history: [{ status: 'quoted', changed_by: session.profile.name, changed_at: new Date().toISOString(), note: 'Converted from enquiry' }],
        };
        let link = { customer_id: null, site_id: null };
        try {
          link = await db.resolveCustomerAndSite({
            customer_name: enq.customer_name,
            customer_phone: enq.customer_phone,
            customer_email: enq.customer_email,
            site_address: enq.site_address,
          });
        } catch (err) {
          console.error('Customer link failed, job created unlinked:', err);
        }

        const row = {
          company_id: session.profile.company_id,
          quote_number: ref,
          status: 'quoted',
          customer_name: enq.customer_name || null,
          customer_phone: enq.customer_phone || null,
          customer_email: enq.customer_email || null,
          site_address: enq.site_address || null,
          customer_id: link.customer_id,
          site_id: link.site_id,
          data,
        };
        const { data: created, error } = await sb.from('jobs').insert(row).select().single();
        if (error) throw error;
        await db.setEnquiryStatus(enq.id, 'converted');
        return created;
      },
