                status_history: history,
              }, { status: backTo });
              ui.toast(prior ? 'Acceptance restored' : 'Quote re-opened');
              router.jobPage(this.main);
            } catch (err) {
              ui.toast('Failed: ' + (err.message || 'error'));
            }
          });
          return;
        }

        if (isConfirmed) {
          const when = a.confirmed_at ? new Date(a.confirmed_at).toLocaleString('en-AU', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
          html += `<div class="acc-confirmed-banner">✓ <strong>Accepted</strong> via ${escapeHtml(a.how || '')} · ${escapeHtml(when)} · by ${escapeHtml(a.confirmed_by || '')}${a.terms_confirmed ? ' · terms confirmed' : ''}</div>`;
        }

        html += `<div><span class="mini-label" style="font-size:12px;font-weight:700;color:var(--muted)">HOW ACCEPTED</span></div>
          <div class="acc-chips">${chips}</div>
          <label class="acc-terms"><input type="checkbox" id="acc-terms-cb" ${this.draft.terms_confirmed ? 'checked' : ''}/> Terms of trade confirmed with customer (optional)</label>`;

        if (!hasQuote) {
          html += `<div class="acc-blocked">Save a quote with a total before confirming acceptance.</div>`;
        }
        html += `<div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn btn-confirm" id="acc-confirm" ${hasQuote ? '' : 'disabled'}>${isConfirmed ? 'Update Acceptance' : 'Confirm Acceptance'}</button>
          <button class="btn btn-secondary" id="acc-decline" style="background:#fee2e2;color:#991b1b" ${hasQuote ? '' : 'disabled'}>${isConfirmed ? 'Undo Acceptance &amp; Decline' : 'Mark as Declined'}</button>
        </div>`;

        // Job card (only meaningful once there's a quote)
        if (hasQuote) {
          const card = this.buildCard(job);
          html += `
            <div class="qb-block-title">Technician Job Card</div>
            <div class="jobcard-box" id="jobcard-text">${escapeHtml(card)}</div>
            <div class="jobcard-actions">
              <button class="btn-copy" id="jobcard-copy">Copy to Clipboard</button>
              <button class="btn btn-secondary" id="jobcard-download">Download .txt</button>
            </div>`;
        }

        mount.innerHTML = html;
        this.wire(job);
      },

      wire(job) {
        document.querySelectorAll('.acc-chip[data-how]').forEach((c) =>
          c.addEventListener('click', () => { this.draft.how = c.dataset.how; this.render(job); }));
        const tc = $('#acc-terms-cb');
        if (tc) tc.addEventListener('change', (e) => { this.draft.terms_confirmed = e.target.checked; });

        const conf = $('#acc-confirm');
        if (conf) conf.addEventListener('click', async () => {
          conf.disabled = true; conf.textContent = 'Confirming…';
          try {
            const acc = {
              how: this.draft.how,
              terms_confirmed: this.draft.terms_confirmed,
              confirmed_at: new Date().toISOString(),
              confirmed_by: session.profile.name,
            };
            // save acceptance + generate & store the job card, advance to confirmed
            const fresh = await db.getJob(this.jobId);
            const card = this.buildCard(fresh);
            // Acceptance is the point the quote becomes physical work. Explode
            // the quote lines into individual item records here — takedown,
            // production and rehang all read and write to these same records.
            const patch = {
              acceptance: acc,
              technician_card: { generated_at: acc.confirmed_at, text: card },
            };
            const existingItems = fresh.data?.items || [];
            if (!existingItems.length) {
              patch.items = buildItemsFromQuote(fresh);
              patch.items_generated_at = acc.confirmed_at;
            } else {
              patch.items = syncItemsWithQuote(fresh, existingItems);
            }
            await db.saveJob(this.jobId, patch);
            // advance status only if not already past confirmed
            const order = STATUSES;
            if (order.indexOf(fresh.status) < order.indexOf('confirmed')) {
              await db.advanceStatus(this.jobId, 'confirmed');
            }
            // Push to Fergus. Deliberately after the status advance, so a
            // Fergus outage can never leave a quote stuck unaccepted.
            let msg = 'Acceptance confirmed';
            try {
              const out = await fergusPush.runWithApproval(this.jobId);
              if (out.skipped) msg += ' \u2014 not sent to Fergus yet, use Push to Fergus when ready';
              else if (out.fergus_job_no) msg += ' \u00b7 Fergus ' + out.fergus_job_no;
            } catch (err) {
              msg += ' \u2014 not sent to Fergus: ' + (err.message || 'push failed');
            }
            ui.toast(msg);
            // Offer to send the customer an acceptance email (optional).
            const fresh2 = await db.getJob(this.jobId);
            acceptanceEmail.open(fresh2);
            router.jobPage(this.main); // refresh whole job page (status bar + sections)
          } catch (err) {
            ui.toast('Confirm failed: ' + (err.message || 'error'));
            conf.disabled = false; conf.textContent = 'Confirm Acceptance';
          }
        });

        const decline = $('#acc-decline');
        if (decline) decline.addEventListener('click', () => this.openDeclineModal(job));

        const copy = $('#jobcard-copy');        if (copy) copy.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(this.buildCard(job));
            ui.toast('Job card copied');
          } catch (_) {
            ui.toast('Copy failed — select and copy manually');
          }
        });
        const dl = $('#jobcard-download');
        if (dl) dl.addEventListener('click', () => {
          const blob = new Blob([this.buildCard(job)], { type: 'text/plain' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = `${job.quote_number || 'JobCard'}.txt`;
          a.click(); URL.revokeObjectURL(url);
        });
      },

      // opts.reason preselects a decline reason (the dashboard's "Mark lost"
      // arrives here with no_response already chosen); opts.after replaces the
      // job-page refresh so a caller elsewhere isn't navigated away.
      openDeclineModal(job, opts = {}) {
        const jobId = job.id || this.jobId;
        const acc = job.data?.acceptance || {};
        const wasConfirmed = !!acc.confirmed_at;
        const mount = $('#modal-mount');
        mount.innerHTML = `
          <div class="modal-backdrop" id="dec-backdrop">
            <div class="modal">
              <div class="m-head"><h2>${wasConfirmed ? 'Undo Acceptance &amp; Decline' : 'Mark as Declined'}</h2><p>${escapeHtml(job.quote_number || '')} — record why the ${wasConfirmed ? 'job is no longer going ahead' : "quote didn't proceed"}.</p></div>
              <div class="m-body">
                ${wasConfirmed ? `<div class="acc-blocked" style="background:#fef3c7;border-color:#fde68a;color:#92400e">This job is currently <strong>${escapeHtml(STATUS_LABEL[job.status] || job.status)}</strong>. Declining reverses the acceptance and moves it to Declined. The acceptance record is kept and can be restored later.</div>` : ''}
                <div class="field"><label>Reason</label>
                  <select id="dec-reason">${DECLINE_REASONS.map(([v, l]) => `<option value="${v}"${v === opts.reason ? ' selected' : ''}>${l}</option>`).join('')}</select>
                </div>
                <div class="field"><label>Note ${wasConfirmed ? '' : '(optional)'}</label><textarea id="dec-note" rows="3" placeholder="${wasConfirmed ? 'Why is it being cancelled after acceptance?' : 'Any detail worth recording'}"></textarea></div>
              </div>
              <div class="m-foot">
                <button class="btn btn-secondary" id="dec-cancel">Cancel</button>
                <button class="btn" id="dec-confirm" style="background:#991b1b;color:#fff;width:auto">${wasConfirmed ? 'Undo &amp; Decline' : 'Mark Declined'}</button>
              </div>
            </div>
          </div>`;
        const close = () => { mount.innerHTML = ''; };
        $('#dec-cancel').addEventListener('click', close);
        $('#dec-backdrop').addEventListener('click', (e) => { if (e.target.id === 'dec-backdrop') close(); });
        $('#dec-confirm').addEventListener('click', async () => {
          const reason = $('#dec-reason').value;
          const note = $('#dec-note').value.trim();
          if (wasConfirmed && !note) { ui.toast('Add a note explaining why the accepted job is being declined'); return; }
          if (wasConfirmed && !confirm(`Undo acceptance for ${job.quote_number || 'this job'}? It moves from ${STATUS_LABEL[job.status] || job.status} to Declined.`)) return;
          const btn = $('#dec-confirm');
          btn.disabled = true; btn.textContent = 'Saving…';
          try {
            const fresh = await db.getJob(jobId);
            const priorAcc = fresh.data?.acceptance || null;
            const declined = {
              reason, note,
              at: new Date().toISOString(),
              by: session.profile.name,
            };
            const patch = { declined };
            if (wasConfirmed) {
              declined.prior_status = fresh.status;
              declined.prior_acceptance = priorAcc;
              declined.reversed_acceptance = true;
              patch.acceptance = null;
            }
            const history = (fresh.data?.status_history) || [];
            history.push({
              status: 'declined',
              changed_by: session.profile.name,
              changed_at: declined.at,
              note: wasConfirmed ? `Acceptance undone from ${STATUS_LABEL[fresh.status] || fresh.status} — declined` : 'Marked declined',
            });
            patch.status_history = history;
            await db.saveJob(jobId, patch, { status: 'declined' });
            close();
            ui.toast(wasConfirmed ? 'Acceptance undone — job declined' : 'Quote marked declined');
            if (opts.after) await opts.after(); else router.jobPage(this.main);
          } catch (err) {
            btn.disabled = false; btn.textContent = wasConfirmed ? 'Undo & Decline' : 'Mark Declined';
            ui.toast('Failed: ' + (err.message || 'error'));
          }
        });
      },

      // Plain-text job card, grouped by room, for pasting into Fergus.
      buildCard(job) {        const q = job.data?.quote || {};
        const a = job.data?.acceptance || {};
        const L = [];
        L.push(`JOB CARD — ${job.quote_number || ''}`);
        if (job.drd_number) L.push(`Fergus: ${job.drd_number}`);
        if (job.data?.po_number) L.push(`PO: ${job.data.po_number}`);
        L.push(`Customer: ${job.customer_name || ''}`);
        if (job.customer_phone) L.push(`Phone: ${job.customer_phone}`);
        if (job.site_address) L.push(`Address: ${job.site_address}`);
        if (q.insurer_name || q.claim_number) {
          L.push(`Insurance: ${[q.insurer_name, q.claim_number].filter(Boolean).join(' / ')}`);
        }
        const when = a.confirmed_at ? new Date(a.confirmed_at).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' }) : new Date().toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' });
        L.push(`Confirmed: ${when} | Via: ${(a.how || this.draft.how || 'verbal')} | Terms: ${a.terms_confirmed ? 'Confirmed' : 'Implied'}`);
        L.push('');

        // Items grouped by room
        (q.rooms || []).forEach((room) => {
          const items = room.items || [];
          const reps = room.repairs || [];
          if (!items.length && !reps.length) return;
          L.push(`${(room.name || 'ROOM').toUpperCase()}:`);
          items.forEach((it) => {
            if (it.cat === 'custom') {
              L.push(`  • ${it.label || 'Custom item'}${it.item_note ? ' — ' + it.item_note : ''}`);
              return;
            }
            const label = CATALOG[it.cat]?.label || it.cat;
            const calc = computeLine(it);
            const isBlind = CATALOG[it.cat]?.mode === 'blind';
            let dims = '';
            if (isBlind) dims = `${calc.widthM.toFixed(2)}m W × ${calc.dropM.toFixed(2)}m H (${calc.sqm} m²)`;
            else if (['curtain', 'sheer', 'velvet'].includes(CATALOG[it.cat]?.mode)) dims = `${calc.widthM.toFixed(2)}m W × ${calc.dropM.toFixed(2)}m H`;
            else dims = `${calc.widthM.toFixed(2)}m W`;
            const extras = [];
            if (it.mould) extras.push('MOULD TREATMENT');
            if (it.item_note) extras.push(it.item_note);
            L.push(`  • ${label} — ${dims}${extras.length ? ' (' + extras.join('; ') + ')' : ''}`);
          });
          reps.forEach((r) => {
            const lbl = (REPAIRS.find(([k]) => k === r.key) || [null, r.key])[1];
            L.push(`  • ${lbl} ×${parseInt(r.qty, 10) || 0}`);
          });
          L.push('');
        });

        // Whole-job repairs
        if ((q.repairs || []).length) {
          L.push('REPAIRS & HARDWARE:');
          q.repairs.forEach((r) => {
            const lbl = (REPAIRS.find(([k]) => k === r.key) || [null, r.key])[1];
            L.push(`  • ${lbl} ×${parseInt(r.qty, 10) || 0}`);
          });
          L.push('');
        }

        // Conditions summary (any mould treatment flagged across the job)
        const hasMould = (q.rooms || []).some((rm) => (rm.items || []).some((it) => it.mould));
        if (hasMould) L.push('CONDITIONS: Mould treatment required');

        // Extras worth a tech knowing about
        const ex = q.extras || {};
        const exNotes = [];
        if (Number(ex.rehang)) exNotes.push('Rehang included');
        if (Number(ex.transport)) exNotes.push('Transport');
        if (Number(ex.storage)) exNotes.push('Storage');
        if (exNotes.length) L.push(`SERVICE: ${exNotes.join(', ')}`);

        // Notes
        if (q.notes) { L.push(''); L.push(`QUOTE NOTES: ${q.notes}`); }
        if (job.data?.internal_notes) { L.push(`INTERNAL: ${job.data.internal_notes}`); }

        return L.join('\n');
      },
    };


    /* ============================================================
       JOB ITEMS — TAKEDOWN · PRODUCTION · REHANG
       ------------------------------------------------------------
       On acceptance the quote is exploded into a list of individual
       item records held in data.items. Every stage after acceptance
       reads and writes the SAME records:
         takedown   → taken, pieces_taken, condition, who/when
         production → prod_done, method, bag, location, issue, who/when
         rehang     → rehung, who/when
       The printed sheets are just views of this list, so the rehang
       sheet can carry the bag and storage location the plant entered.
       ============================================================ */

    // Cleaning methods offered in Production. Edit here to change the list.
    const PROD_METHODS = [
      'Dry clean', 'Wet clean', 'Ultrasonic', 'Hand clean',
      'On-site clean', 'Blind clean', 'Repair only',
    ];

    const pad2 = (n) => String(n).padStart(2, '0');

    // Quotes are measured per track/window, but a line often covers several
    // physical panels ("2 pieces", "Left + Right - 2 pieces"). Pull that count
    // out of the note so the driver's sheet shows what he'll actually handle.
    function parsePieces(note) {
      const m = String(note || '').match(/(\d+)\s*(?:pc|pcs|piece|pieces|panel|panels)\b/i);
      const n = m ? parseInt(m[1], 10) : 1;
      return n > 0 && n < 100 ? n : 1;
    }

    function itemDims(it) {
      if (it.cat === 'custom') return '';
      const calc = computeLine(it);
      const mode = CATALOG[it.cat]?.mode;
      if (mode === 'blind') return `${calc.widthM.toFixed(2)}m W × ${calc.dropM.toFixed(2)}m H (${calc.sqm} m²)`;
      if (['curtain', 'sheer', 'velvet'].includes(mode)) return `${calc.widthM.toFixed(2)}m W × ${calc.dropM.toFixed(2)}m H`;
      return `${calc.widthM.toFixed(2)}m W`;
    }

    // Build the item list from the saved quote. Pure — takes a job, returns rows.
    function buildItemsFromQuote(job) {
      const q = job.data?.quote || {};
      const prefix = job.quote_number || 'ITEM';
      const out = [];
      let seq = 0;
      (q.rooms || []).forEach((room) => {
        (room.items || []).forEach((it) => {
          // Custom lines are usually charges, not things ("7 day turnaround",
          // "leader"). They have no measurements, so they'd be dead tick rows.
          // They still print on the sheet under Other Quoted Lines.
          if (it.cat === 'custom') return;
          seq += 1;
          out.push({
            ref: `${prefix}-${pad2(seq)}`,
            seq,
            room: room.name || 'Room',
            cat: it.cat,
            label: it.cat === 'custom' ? (it.label || 'Custom item') : (CATALOG[it.cat]?.label || it.cat),
            dims: itemDims(it),
            mould: !!it.mould,
            note: it.item_note || '',
            pieces: parsePieces(it.item_note),
            extra: false,
            // takedown
            taken: false, pieces_taken: null, taken_at: null, taken_by: null, condition: '',
            // production
            prod_done: false, done_at: null, done_by: null, method: '', issue: '',
            bag: '', location: '',
            // rehang
            rehung: false, rehung_at: null, rehung_by: null,
          });
        });
      });
      return out;
    }

    // Re-sync an existing list against a revised quote. Anything already
    // ticked, bagged or noted is preserved by matching on room + label + dims.
    function syncItemsWithQuote(job, existing) {
      const fresh = buildItemsFromQuote(job);
      const pool = (existing || []).filter((x) => !x.extra);
      const key = (x) => `${x.room}|${x.label}|${x.dims}|${x.note}`;
      const used = new Set();
      const merged = fresh.map((f) => {
        const idx = pool.findIndex((p, i) => !used.has(i) && key(p) === key(f));
        if (idx === -1) return f;
        used.add(idx);
        const p = pool[idx];
        return {
          ...f,
          taken: p.taken, pieces_taken: p.pieces_taken, taken_at: p.taken_at,
          taken_by: p.taken_by, condition: p.condition, pieces: p.pieces ?? f.pieces,
          prod_done: p.prod_done, done_at: p.done_at, done_by: p.done_by,
          method: p.method, issue: p.issue, bag: p.bag, location: p.location,
          rehung: p.rehung, rehung_at: p.rehung_at, rehung_by: p.rehung_by,
        };
      });
      // Keep anything the driver added on site — it was never in the quote.
      const extras = (existing || []).filter((x) => x.extra).map((x, i) => ({
        ...x, seq: merged.length + i + 1,
        ref: `${job.quote_number || 'ITEM'}-${pad2(merged.length + i + 1)}`,
      }));
      return merged.concat(extras);
    }

    function storageLocations() {
      return String(session.settings['storage-locations'] || '')
        .split(',').map((s) => s.trim()).filter(Boolean);
    }
    const showItemTags = () => session.settings['print-item-tags'] === 'on';

    const jobItems = {
      jobId: null, main: null, job: null,
      items: [], tab: 'takedown', dirty: false,

      init(job, main) {
        this.jobId = job.id; this.main = main; this.job = job;
        this.items = deepClone(job.data?.items || []) || [];
        this.dirty = false;
        // Sensible default tab for where the job actually is.
        if (['complete', 'invoiced', 'rehung'].includes(job.status)) this.tab = 'rehang';
        else if (job.status === 'in_progress') this.tab = 'production';
        else this.tab = 'takedown';
        this.render();
      },

      counts() {
        const t = this.items.length;
        return {
          total: t,
          taken: this.items.filter((x) => x.taken).length,
          done: this.items.filter((x) => x.prod_done).length,
          hung: this.items.filter((x) => x.rehung).length,
          pieces: this.items.reduce((a, x) => a + (Number(x.pieces) || 1), 0),
          piecesTaken: this.items.reduce((a, x) => a + (x.taken ? (Number(x.pieces_taken ?? x.pieces) || 0) : 0), 0),
        };
      },

      render() {
        const mount = $('#items-mount');
        if (!mount) return;
        const accepted = !!this.job.data?.acceptance?.confirmed_at;

        if (!this.items.length) {
          mount.innerHTML = !accepted
            ? `<div class="it-empty">The item list is created when the quote is accepted. Confirm acceptance first.</div>`
            : `<div class="it-note">This job was accepted before item tracking existed. Build the list from the saved quote to start using takedown and production.</div>
               <button class="btn btn-confirm" id="it-generate">Build item list from quote</button>`;
          const g = $('#it-generate');
          if (g) g.addEventListener('click', () => this.generate());
          return;
        }

        const c = this.counts();
        const tabs = [
          ['takedown', 'Takedown', `${c.taken}/${c.total}`],
          ['production', 'Production', `${c.done}/${c.total}`],
          ['rehang', 'Rehang', `${c.hung}/${c.total}`],
        ].map(([k, l, n]) =>
          `<div class="it-tab ${this.tab === k ? 'active' : ''}" data-ittab="${k}">${l}<span class="it-count">${n}</span></div>`
        ).join('');

        const prog = this.tab === 'takedown' ? [c.taken, 'taken']
          : this.tab === 'production' ? [c.done, 'cleaned'] : [c.hung, 'rehung'];
        const pct = c.total ? Math.round(prog[0] / c.total * 100) : 0;

        mount.innerHTML = `
          <div class="it-tabs">${tabs}</div>
          <div class="it-bar">
            <div class="it-prog">
              <div class="it-prog-track"><div class="it-prog-fill" style="width:${pct}%"></div></div>
              <div class="it-prog-label">${prog[0]} of ${c.total} items ${prog[1]} · ${c.pieces} pieces expected</div>
            </div>
          </div>
          <div id="it-body"></div>
          <div class="it-actions">
            <button class="btn btn-save-quote" id="it-save">Save${this.dirty ? ' changes' : 'd'}</button>
            <button class="btn btn-print" id="it-print-take">Print takedown sheet</button>
            <button class="btn btn-print" id="it-print-hang">Print rehang sheet</button>
            <button class="btn btn-secondary" id="it-resync">Re-sync with quote</button>
          </div>`;

        this.renderBody();

        document.querySelectorAll('[data-ittab]').forEach((el) =>
          el.addEventListener('click', () => { this.tab = el.dataset.ittab; this.render(); }));
        $('#it-save').addEventListener('click', () => this.save());
        $('#it-print-take').addEventListener('click', () => sheets.takedown(this.job, this.items));
        $('#it-print-hang').addEventListener('click', () => sheets.rehang(this.job, this.items));
        $('#it-resync').addEventListener('click', async () => {
          if (!confirm('Rebuild the item list from the current quote?\n\nTicks, bags, locations and notes are kept where items still match. Items removed from the quote are dropped.')) return;
          const fresh = await db.getJob(this.jobId);
          this.items = syncItemsWithQuote(fresh, this.items);
          this.markDirty(); this.render();
        });
      },

      markDirty() { this.dirty = true; const b = $('#it-save'); if (b) b.textContent = 'Save changes'; },

      renderBody() {
        const body = $('#it-body');
        if (!body) return;
        const t = this.tab;

        // Rehang works off where the stock physically is, not the quote order —
        // one walk of the racks instead of five.
        const list = t === 'rehang'
          ? this.items.slice().sort((a, b) =>
              String(a.location || 'zzz').localeCompare(String(b.location || 'zzz')) ||
              String(a.bag || '').localeCompare(String(b.bag || '')) || a.seq - b.seq)
          : this.items;

        const groupKey = (x) => t === 'rehang' ? (x.location || 'No location recorded') : x.room;
        const groups = [];
        list.forEach((x) => {
          const k = groupKey(x);
          const g = groups.find((gg) => gg[0] === k);
          if (g) g[1].push(x); else groups.push([k, [x]]);
        });

        let html = '';
        if (t === 'production' && !storageLocations().length) {
          html += `<div class="it-note warn">No storage locations set up yet. Add them under Admin → Production so the plant picks from a list instead of typing.</div>`;
        }
        if (t === 'rehang' && this.items.some((x) => !x.location)) {
          html += `<div class="it-note warn">Some items have no storage location recorded — they'll print at the bottom of the rehang sheet under "No location recorded".</div>`;
        }

        groups.forEach(([room, rows]) => {
          html += `<div class="it-room">${escapeHtml(room)}</div>`;
          rows.forEach((it) => { html += this.rowHtml(it, t); });
        });

        if (t === 'takedown') {
          html += `<button class="btn btn-secondary" id="it-add-extra" style="margin-top:6px">+ Add item found on site</button>`;
        }
        body.innerHTML = html;
        this.wireBody();
      },

      rowHtml(it, t) {
        const i = this.items.indexOf(it);
        const done = t === 'takedown' ? it.taken : t === 'production' ? it.prod_done : it.rehung;
        const cls = ['it-row'];
        if (done) cls.push('done');
        if (t === 'production' && it.issue) cls.push('issue');
        if (it.extra) cls.push('it-extra');

        const flags = [];
        if (it.mould) flags.push('<span class="it-flag mould">Mould treatment</span>');
        if (it.extra) flags.push('<span class="it-flag">Found on site</span>');
        if (Number(it.pieces) > 1) flags.push(`<span class="it-flag">${it.pieces} pieces</span>`);
        if (it.bag) flags.push(`<span class="it-flag bag">Bag ${escapeHtml(it.bag)}</span>`);
        if (it.location) flags.push(`<span class="it-flag loc">${escapeHtml(it.location)}</span>`);

        let meta = '';
        if (t === 'takedown' && it.taken_at) meta = `Taken ${fmtStamp(it.taken_at)} by ${escapeHtml(it.taken_by || '')}`;
        if (t === 'production' && it.done_at) meta = `Cleaned ${fmtStamp(it.done_at)} by ${escapeHtml(it.done_by || '')}`;
        if (t === 'rehang' && it.rehung_at) meta = `Rehung ${fmtStamp(it.rehung_at)} by ${escapeHtml(it.rehung_by || '')}`;

        let fields = '';
        if (t === 'takedown') {
          fields = `<div class="it-fields">
            <div><label>Pieces taken</label><input class="it-pieces" type="number" min="0" data-f="pieces_taken" data-i="${i}" value="${it.pieces_taken ?? ''}" placeholder="${it.pieces}" /></div>
            <div style="grid-column:span 2"><label>Condition on collection</label><input data-f="condition" data-i="${i}" value="${escapeAttr(it.condition)}" placeholder="Marks, tears, sun damage…" /></div>
          </div>`;
        } else if (t === 'production') {
          const locs = storageLocations();
          fields = `<div class="it-fields">
            <div><label>Method</label><select data-f="method" data-i="${i}">
              <option value="">—</option>
              ${PROD_METHODS.map((m) => `<option value="${escapeAttr(m)}" ${it.method === m ? 'selected' : ''}>${escapeHtml(m)}</option>`).join('')}
            </select></div>
            <div><label>Bag</label><input data-f="bag" data-i="${i}" value="${escapeAttr(it.bag)}" placeholder="1" /></div>
            <div><label>Storage location</label>${locs.length
              ? `<select data-f="location" data-i="${i}"><option value="">—</option>${locs.map((l) => `<option value="${escapeAttr(l)}" ${it.location === l ? 'selected' : ''}>${escapeHtml(l)}</option>`).join('')}${it.location && !locs.includes(it.location) ? `<option value="${escapeAttr(it.location)}" selected>${escapeHtml(it.location)}</option>` : ''}</select>`
              : `<input data-f="location" data-i="${i}" value="${escapeAttr(it.location)}" placeholder="Rack 3 / Bay B" />`}</div>
            <div style="grid-column:span 2"><label>Issue / note</label><input data-f="issue" data-i="${i}" value="${escapeAttr(it.issue)}" placeholder="Anything wrong with this piece" /></div>
          </div>`;
        }

        return `<div class="${cls.join(' ')}">
          <button class="it-tick" data-tick="${i}">✓</button>
          <div class="it-main">
            <div class="it-name">${escapeHtml(it.label)} <span class="it-ref">${showItemTags() ? escapeHtml(it.ref) : '#' + it.seq}</span></div>
            ${it.dims ? `<div class="it-dims">${escapeHtml(it.dims)}</div>` : ''}
            ${it.note ? `<div class="it-dims">${escapeHtml(it.note)}</div>` : ''}
            ${t === 'rehang' ? `<div class="it-dims">${escapeHtml(it.room)}</div>` : ''}
            ${flags.length ? `<div class="it-flags">${flags.join('')}</div>` : ''}
            ${it.condition && t !== 'takedown' ? `<div class="it-meta">Condition on collection: ${escapeHtml(it.condition)}</div>` : ''}
            ${it.issue && t === 'rehang' ? `<div class="it-meta">Issue: ${escapeHtml(it.issue)}</div>` : ''}
            ${meta ? `<div class="it-meta">${meta}</div>` : ''}
            ${fields}
          </div>
        </div>`;
      },

      wireBody() {
        const t = this.tab;
        document.querySelectorAll('[data-tick]').forEach((b) =>
          b.addEventListener('click', () => {
            const it = this.items[+b.dataset.tick];
            const now = new Date().toISOString();
            const who = session.profile.name;
            if (t === 'takedown') {
              it.taken = !it.taken;
              it.taken_at = it.taken ? now : null;
              it.taken_by = it.taken ? who : null;
              if (it.taken && it.pieces_taken == null) it.pieces_taken = it.pieces;
            } else if (t === 'production') {
              it.prod_done = !it.prod_done;
              it.done_at = it.prod_done ? now : null;
              it.done_by = it.prod_done ? who : null;
            } else {
              it.rehung = !it.rehung;
              it.rehung_at = it.rehung ? now : null;
              it.rehung_by = it.rehung ? who : null;
            }
            this.markDirty();
            this.render();
          }));

        document.querySelectorAll('[data-f]').forEach((el) =>
          el.addEventListener('change', (e) => {
            const it = this.items[+el.dataset.i];
            const f = el.dataset.f;
            it[f] = f === 'pieces_taken'
              ? (e.target.value === '' ? null : Math.max(0, parseInt(e.target.value, 10) || 0))
              : e.target.value;
            this.markDirty();
            if (['bag', 'location', 'issue'].includes(f)) this.renderBody();
          }));

        const add = $('#it-add-extra');
        if (add) add.addEventListener('click', () => this.addExtra());
      },

      addExtra() {
        const rooms = [...new Set(this.items.map((x) => x.room))];
        const mount = $('#modal-mount');
        mount.innerHTML = `
          <div class="modal-backdrop" id="ie-backdrop">
            <div class="modal">
              <div class="m-head"><h2>Item found on site</h2><p>Not on the quote — record it so it can be added to the job value.</p></div>
              <div class="m-body">
                <div class="field"><label>Room</label><input id="ie-room" list="ie-rooms" placeholder="Lounge" />
                  <datalist id="ie-rooms">${rooms.map((r) => `<option value="${escapeAttr(r)}"></option>`).join('')}</datalist></div>
                <div class="field"><label>Type</label><select id="ie-cat">${Object.entries(CATALOG).map(([k, v]) => `<option value="${k}">${escapeHtml(v.label)}</option>`).join('')}</select></div>
                <div class="row2">
                  <div class="field"><label>Width (m or mm)</label><input id="ie-w" placeholder="2.4" /></div>
                  <div class="field"><label>Drop (m or mm)</label><input id="ie-d" placeholder="2.2" /></div>
                </div>
                <div class="row2">
                  <div class="field"><label>Pieces</label><input id="ie-p" type="number" min="1" value="1" /></div>
                  <div class="field"><label>Note</label><input id="ie-n" placeholder="Optional" /></div>
                </div>
              </div>
              <div class="m-foot">
                <button class="btn btn-secondary" id="ie-cancel">Cancel</button>
                <button class="btn btn-confirm" id="ie-add" style="width:auto">Add item</button>
              </div>
            </div>
          </div>`;
        const close = () => { mount.innerHTML = ''; };
        $('#ie-cancel').addEventListener('click', close);
        $('#ie-backdrop').addEventListener('click', (e) => { if (e.target.id === 'ie-backdrop') close(); });
        $('#ie-add').addEventListener('click', () => {
          const cat = $('#ie-cat').value;
          const stub = { cat, width: $('#ie-w').value, drop: $('#ie-d').value };
          const seq = this.items.length + 1;
          this.items.push({
            ref: `${this.job.quote_number || 'ITEM'}-${pad2(seq)}`,
            seq,
            room: $('#ie-room').value.trim() || 'Found on site',
            cat,
            label: CATALOG[cat]?.label || cat,
            dims: cat === 'custom' ? '' : itemDims(stub),
            mould: false,
            note: $('#ie-n').value.trim(),
            pieces: Math.max(1, parseInt($('#ie-p').value, 10) || 1),
            extra: true,
            taken: false, pieces_taken: null, taken_at: null, taken_by: null, condition: '',
            prod_done: false, done_at: null, done_by: null, method: '', issue: '',
            bag: '', location: '',
            rehung: false, rehung_at: null, rehung_by: null,
          });
          close();
          this.markDirty();
          this.render();
          ui.toast('Item added — remember to price it on the quote');
        });
      },

      async generate() {
        const btn = $('#it-generate');
        if (btn) { btn.disabled = true; btn.textContent = 'Building…'; }
        try {
          const fresh = await db.getJob(this.jobId);
          this.items = buildItemsFromQuote(fresh);
          if (!this.items.length) { ui.toast('No quote lines to build from'); return; }
          await db.saveJob(this.jobId, { items: this.items, items_generated_at: new Date().toISOString() });
          this.job = await db.getJob(this.jobId);
          this.dirty = false;
          ui.toast(`${this.items.length} items created`);
          this.render();
        } catch (err) {
          ui.toast('Failed: ' + (err.message || 'error'));
          if (btn) { btn.disabled = false; btn.textContent = 'Build item list from quote'; }
        }
      },

      async save() {
        const btn = $('#it-save');
        btn.disabled = true; btn.textContent = 'Saving…';
        try {
          await db.saveJob(this.jobId, { items: this.items });
          this.job = await db.getJob(this.jobId);
          this.dirty = false;
          ui.toast('Saved');
          this.render();
        } catch (err) {
          ui.toast('Save failed: ' + (err.message || 'error'));
          btn.disabled = false; btn.textContent = 'Save changes';
        }
      },
    };

    function fmtStamp(iso) {
      if (!iso) return '';
      return new Date(iso).toLocaleString('en-AU', {
        day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit',
      });
    }

    /* ============================================================
       PRINTED SHEETS — takedown & rehang
       Deliberately no pricing. These go on site and into the plant.
       ============================================================ */
    const sheets = {
      _frame(doc, job, title, subtitle) {
        const PW = 210, M = 12;
        const blue = BRAND.blue, pink = BRAND.pink, grey = [110, 110, 120], ink = [30, 30, 45];
        let y = 14;
        try {
          const logoW = 44, logoH = logoW / BRAND.logoAspect;
          doc.addImage(BRAND.logo, 'PNG', M, y, logoW, logoH);
          y += logoH;
        } catch (_) { y += 12; }
        doc.setFont('helvetica', 'bold'); doc.setFontSize(19); doc.setTextColor(...blue);
        doc.text(title, PW - M, 20, { align: 'right' });
        doc.setFontSize(12); doc.setTextColor(...ink);
        doc.text(job.quote_number || '', PW - M, 27, { align: 'right' });
        doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(...grey);
        doc.text(fmtDate(new Date()), PW - M, 32, { align: 'right' });

        y += 4;
        doc.setDrawColor(...pink); doc.setLineWidth(0.8); doc.line(M, y, PW - M, y);
        y += 7;

        // Customer block — everything the driver needs to find the place.
        doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(...blue);
        doc.text(clip(job.customer_name || '', 52), M, y);
        doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(...ink);
        y += 5.5;
        if (job.site_address) { doc.text(clip(job.site_address, 78), M, y); y += 5; }
        const line2 = [job.customer_phone, job.drd_number ? 'Fergus ' + job.drd_number : '', job.data?.po_number ? 'PO ' + job.data.po_number : '']
          .filter(Boolean).join('   ·   ');
        if (line2) { doc.text(line2, M, y); y += 5; }
        if (subtitle) {
          doc.setFontSize(9); doc.setTextColor(...grey);
          doc.text(subtitle, M, y); y += 5;
        }
        y += 2;
        doc.setDrawColor(220, 222, 232); doc.setLineWidth(0.3); doc.line(M, y, PW - M, y);
        return y + 6;
      },

      _rowLines(doc, cols, y, h) {
        doc.setDrawColor(228, 230, 240); doc.setLineWidth(0.2);
        doc.line(12, y + h - 3, 198, y + h - 3);
      },

      _box(doc, x, y, s = 5) {
        doc.setDrawColor(120, 124, 145); doc.setLineWidth(0.4);
        doc.rect(x, y, s, s);
      },

      _signoff(doc, y, lines) {
        const M = 12, PW = 210;
        if (y > 258) { doc.addPage(); y = 20; }
        doc.setDrawColor(...BRAND.blue); doc.setLineWidth(0.5); doc.line(M, y, PW - M, y);
        y += 4.5;
        doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(...BRAND.blue);
        doc.text('SIGN OFF', M, y); y += 5;
        doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(30, 30, 45);
        lines.forEach((l) => {
          doc.text(l[0], M, y);
          doc.setDrawColor(150, 154, 175); doc.setLineWidth(0.3);
          doc.line(M + l[1], y + 1, l[2], y + 1);
          if (l[3]) {
            doc.text(l[3], l[2] + 6, y);
            doc.line(l[2] + 6 + l[4], y + 1, 198, y + 1);
          }
          y += 7.5;
        });
        return y;
      },

      // ---------- TAKEDOWN SHEET ----------
      takedown(job, items) {
        const doc = new jsPDF({ unit: 'mm', format: 'a4' });
        const M = 12, PW = 210;
        const q = job.data?.quote || {};
        const notes = [];
        if (q.insurer_name || q.claim_number) notes.push('Insurance: ' + [q.insurer_name, q.claim_number].filter(Boolean).join(' / '));
        let y = this._frame(doc, job, 'TAKEDOWN SHEET', notes.join('   ·   '));

        const tags = showItemTags();
        const C = { ref: M, item: 32, size: 90, pcs: 126, tick: 140, cond: 152 };

        const header = () => {
          doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(110, 110, 120);
          doc.text(tags ? 'TAG' : 'NO.', C.ref, y);
          doc.text('ITEM', C.item, y);
          doc.text('SIZE', C.size, y);
          doc.text('PCS', C.pcs, y);
          doc.text('TAKEN', C.tick, y);
          doc.text('CONDITION ON COLLECTION', C.cond, y);
          y += 2; doc.setDrawColor(...BRAND.blue); doc.setLineWidth(0.4); doc.line(M, y, PW - M, y); y += 5;
        };
        const space = (need) => { if (y + need > 262) { doc.addPage(); y = 20; header(); } };

        header();
        const rooms = [];
        (items || []).forEach((it) => {
          const g = rooms.find((r) => r[0] === it.room);
          if (g) g[1].push(it); else rooms.push([it.room, [it]]);
        });

        rooms.forEach(([room, rows]) => {
          space(16);
          doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5); doc.setTextColor(...BRAND.blue);
          doc.text(String(room).toUpperCase(), M, y); y += 6;
          rows.forEach((it) => {
            space(11);
            doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(30, 30, 45);
            doc.text(tags ? it.ref : '#' + it.seq, C.ref, y);
            doc.setFont('helvetica', 'bold');
            doc.text(clip(it.label, 30), C.item, y);
            doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(90, 90, 105);
            doc.text(clip(it.dims, 24), C.size, y);
            doc.setFontSize(10); doc.setTextColor(30, 30, 45);
            doc.text(String(it.pieces || 1), C.pcs + 2, y);
            this._box(doc, C.tick + 2, y - 4);
            // extras worth flagging to the driver
            const sub = [];
            if (it.mould) sub.push('MOULD TREATMENT');
            if (it.note) sub.push(it.note);
            if (sub.length) {
              doc.setFontSize(8); doc.setTextColor(...BRAND.pink);
              doc.text(clip(sub.join(' · '), 52), C.item, y + 3.6);
            }
            doc.setDrawColor(200, 204, 220); doc.setLineWidth(0.25);
            doc.line(C.cond, y + 1, 198, y + 1);
            y += sub.length ? 11 : 8.5;
            doc.setDrawColor(232, 234, 242); doc.line(M, y - 2.5, 198, y - 2.5);
          });
          y += 3;
        });

        // Repairs, hardware and any custom lines — the driver needs to know
        // a track is being replaced or a leader is coming back with it.
        const q2 = job.data?.quote || {};
        const extraLines = [];
        (q2.rooms || []).forEach((rm) => {
          (rm.items || []).filter((x) => x.cat === 'custom').forEach((x) => {
            extraLines.push(`${rm.name || 'Room'}: ${x.label || 'Custom item'}`);
          });
          (rm.repairs || []).forEach((r) => {
            const lbl = (REPAIRS.find(([k]) => k === r.key) || [null, r.key])[1];
            extraLines.push(`${rm.name || 'Room'}: ${lbl} x${parseInt(r.qty, 10) || 0}`);
          });
        });
        (q2.repairs || []).forEach((r) => {
          const lbl = (REPAIRS.find(([k]) => k === r.key) || [null, r.key])[1];
          extraLines.push(`Whole job: ${lbl} x${parseInt(r.qty, 10) || 0}`);
        });
        if (extraLines.length) {
          space(14 + extraLines.length * 5);
          doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5); doc.setTextColor(...BRAND.blue);
          doc.text('REPAIRS, HARDWARE & OTHER QUOTED LINES', M, y); y += 6;
          doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(30, 30, 45);
          extraLines.forEach((l) => {
            this._box(doc, M, y - 3.5, 4);
            doc.text(clip(l, 95), M + 7, y);
            y += 6;
          });
          y += 2;
        }
        if (q2.notes) {
          space(16);
          doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(...BRAND.blue);
          doc.text('QUOTE NOTES', M, y); y += 4.5;
          doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(60, 60, 75);
          const wrapped = doc.splitTextToSize(String(q2.notes), 186);
          doc.text(wrapped, M, y); y += wrapped.length * 4 + 3;
        }

        // Found-on-site rows — this is where extra revenue gets captured.
        // Reserved as one block with the sign-off so a short job never breaks
        // onto a second page carrying nothing but signature lines.
        const TAIL = 68;
        if (y + TAIL > 288) { doc.addPage(); y = 20; }
        y += 1;
        doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5); doc.setTextColor(...BRAND.pink);
        doc.text('FOUND ON SITE — NOT QUOTED', M, y);
        doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(110, 110, 120);
        doc.text('room · item · size · pieces — the office will add it to the job', M + 66, y);
        y += 5;
        for (let i = 0; i < 4; i += 1) {
          doc.setDrawColor(180, 184, 205); doc.setLineWidth(0.3);
          doc.line(M, y, 198, y); y += 7;
        }

        y += 2;
        this._signoff(doc, y, [
          ['Items expected: ' + (items || []).length + '        Items taken:', 62, 92, 'Bags used:', 24],
          ['Photos taken:', 26, 60, 'Driver:', 18],
          ['Customer name:', 30, 92, 'Signature:', 24],
        ]);

        doc.setFont('helvetica', 'italic'); doc.setFontSize(7.5); doc.setTextColor(130, 130, 145);
        doc.text('Customer signature confirms the items listed were collected and the condition notes above are agreed.', M, 291);

        doc.save(`${job.quote_number || 'Job'}-Takedown.pdf`);
      },

      // ---------- REHANG SHEET ----------
      rehang(job, items) {
        const doc = new jsPDF({ unit: 'mm', format: 'a4' });
        const M = 12, PW = 210;
        let y = this._frame(doc, job, 'REHANG SHEET', 'Sorted by storage location — pull the racks in this order.');

        const tags = showItemTags();
        const C = { ref: M, room: 30, item: 62, bag: 116, loc: 134, tick: 180 };
        const header = () => {
          doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(110, 110, 120);
          doc.text(tags ? 'TAG' : 'NO.', C.ref, y);
          doc.text('ROOM', C.room, y);
          doc.text('ITEM', C.item, y);
          doc.text('BAG', C.bag, y);
          doc.text('LOCATION', C.loc, y);
          doc.text('HUNG', C.tick, y);
          y += 2; doc.setDrawColor(...BRAND.blue); doc.setLineWidth(0.4); doc.line(M, y, PW - M, y); y += 5;
        };
        const space = (need) => { if (y + need > 262) { doc.addPage(); y = 20; header(); } };
        header();

        const sorted = (items || []).slice().sort((a, b) =>
          String(a.location || 'zzzz').localeCompare(String(b.location || 'zzzz')) ||
          String(a.bag || '').localeCompare(String(b.bag || '')) || a.seq - b.seq);

        const groups = [];
        sorted.forEach((it) => {
          const k = it.location || 'NO LOCATION RECORDED';
          const g = groups.find((gg) => gg[0] === k);
          if (g) g[1].push(it); else groups.push([k, [it]]);
        });

        groups.forEach(([loc, rows]) => {
          space(16);
          doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5); doc.setTextColor(...BRAND.blue);
          doc.text(String(loc).toUpperCase(), M, y); y += 6;
          rows.forEach((it) => {
            space(11);
            doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(30, 30, 45);
            doc.text(tags ? it.ref : '#' + it.seq, C.ref, y);
            doc.setFontSize(9);
            doc.text(clip(it.room, 16), C.room, y);
            doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5);
            doc.text(clip(it.label, 26), C.item, y);
            doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5);
            doc.text(it.bag ? String(it.bag) : '—', C.bag, y);
            doc.setFontSize(8.5); doc.setTextColor(90, 90, 105);
            doc.text(clip(it.location || '—', 22), C.loc, y);
            this._box(doc, C.tick + 3, y - 4);
            const sub = [];
            if (Number(it.pieces) > 1) sub.push(it.pieces + ' pieces');
            if (it.issue) sub.push('ISSUE: ' + it.issue);
            if (it.note) sub.push(it.note);
            if (sub.length) {
              doc.setFontSize(8); doc.setTextColor(...BRAND.pink);
              doc.text(clip(sub.join(' · '), 58), C.item, y + 3.6);
            }
            y += sub.length ? 11 : 8.5;
            doc.setDrawColor(232, 234, 242); doc.setLineWidth(0.25); doc.line(M, y - 2.5, 198, y - 2.5);
          });
          y += 3;
        });

        y += 4;
        this._signoff(doc, y, [
          ['Items to rehang: ' + (items || []).length + '        Items hung:', 62, 92, 'Bags returned:', 30],
          ['Not returned / reason:', 40, 198, '', 0],
          ['Installer:', 20, 92, 'Customer signature:', 40],
        ]);

        doc.save(`${job.quote_number || 'Job'}-Rehang.pdf`);
      },
    };

    /* ============================================================
       ACTIVITY — who did what, when
       Merges the job's status history with the timestamps recorded
       against individual items. Nothing is written twice; this is a
       read-only view of records the app already keeps.
       ============================================================ */
    function buildActivity(job) {
      const out = [];
      (job.data?.status_history || []).forEach((h) => {
        out.push({
          at: h.changed_at, who: h.changed_by, kind: 'status',
          what: `Status → ${STATUS_LABEL[h.status] || h.status}${h.note && h.note !== 'Status changed' ? ' — ' + h.note : ''}`,
        });
      });
      const a = job.data?.acceptance;
      if (a?.confirmed_at) out.push({ at: a.confirmed_at, who: a.confirmed_by, kind: 'status', what: `Quote accepted via ${a.how || 'verbal'}` });
      const d = job.data?.declined;
      if (d?.at) out.push({ at: d.at, who: d.by, kind: 'status', what: `Quote declined — ${d.reason || ''}${d.note ? ': ' + d.note : ''}` });
      // Follow-ups go through the same send path, so they are already in
      // email_log. Match them by timestamp and label them properly rather
      // than listing every chase twice as "Quote emailed".
      const fu = job.data?.follow_ups || [];
      const fuAt = fu.map((f) => f.sent_at).filter(Boolean);
      (job.data?.quote?.email_log || []).forEach((e) => {
        if (e.sent_at && nearAny(e.sent_at, fuAt)) return;
        out.push({ at: e.sent_at, who: e.sent_by || null, kind: 'status', what: `Quote emailed to ${e.to || ''}` });
      });
      fu.forEach((f) => {
        out.push({ at: f.sent_at, who: f.sent_by || null, kind: 'status', what: `Follow-up (${followUpStage(f.stage).label}) emailed to ${f.to || ''}` });
      });
      (job.data?.items || []).forEach((it) => {
        const nm = `${it.label} (${showItemTags() ? it.ref : '#' + it.seq}, ${it.room})`;
        if (it.taken_at) out.push({ at: it.taken_at, who: it.taken_by, kind: 'take', what: `Taken down — ${nm}` });
        if (it.done_at) out.push({ at: it.done_at, who: it.done_by, kind: 'prod', what: `Cleaned${it.method ? ' (' + it.method + ')' : ''}${it.bag ? ', bag ' + it.bag : ''}${it.location ? ', ' + it.location : ''} — ${nm}` });
        if (it.rehung_at) out.push({ at: it.rehung_at, who: it.rehung_by, kind: 'hang', what: `Rehung — ${nm}` });
      });
      return out.filter((x) => x.at).sort((a1, b1) => new Date(b1.at) - new Date(a1.at));
    }

    function activityHtml(job) {
      const rows = buildActivity(job);
      if (!rows.length) return `<div class="it-empty">Nothing recorded yet.</div>`;
      return `<ul class="act-list">${rows.map((r) => `
        <li class="act-item">
          <span class="act-dot ${r.kind === 'status' ? '' : r.kind}"></span>
          <div class="act-body">
            <div class="act-what">${escapeHtml(r.what)}</div>
            <div class="act-when">${escapeHtml(fmtStamp(r.at))}${r.who ? ' · ' + escapeHtml(r.who) : ''}</div>
          </div>
        </li>`).join('')}</ul>`;
    }

    // Turn common Resend/function errors into something readable.

      if (r.includes('forbidden')) return 'This job belongs to another company — cannot send.';
      if (r.includes('authenticated')) return 'Session expired — sign out and back in, then retry.';

    /* ============================================================
       FERGUS PUSH
       Acceptance is the only way a job gets into Fergus — nothing is ever
       raised there as a quote. This calls the push-to-fergus Edge Function,
       which finds or creates the customer and site, raises a Charge Up job
       and writes the DRD number back onto this quote.

       It must never block or reverse an acceptance. If Fergus is down or the
       customer is ambiguous, the quote stays accepted and a Push to Fergus
       button appears in the job header to try again.
       ============================================================ */
    const fergusPush = {
      // Resolve the match without writing anything, so it can be approved first.
      async preview(jobId) {
        return await fergusPush.attempt(jobId, false, true);
      },

      // Show what the job is about to be attached to and wait for a yes. Only
      // reached when the customer or the site has never been linked before, so a
      // repeat customer never sees this.
      askApproval(pv) {
        return new Promise((resolve) => {
          const block = (label, o, isSite) => {
            const nw = o.will_create;
            const lines = [];
            if (o.contacts && o.contacts.length) lines.push(escapeHtml(o.contacts.join(' \u00b7 ')));
            if (isSite && o.contact) lines.push('Site contact in Fergus: ' + escapeHtml(o.contact));
            return '<div style="margin:0 0 16px">'
              + '<div style="font:700 11px Arial,sans-serif;color:#888;letter-spacing:.06em">' + label + '</div>'
              + '<div style="font:600 15px Arial,sans-serif;color:#222;padding-top:3px">'
              + escapeHtml((isSite ? o.address : o.name) || 'Not set') + '</div>'
              + lines.map((l) => '<div style="font:400 13px Arial,sans-serif;color:#666">' + l + '</div>').join('')
              + '<div style="font:600 12px Arial,sans-serif;padding-top:5px;color:' + (nw ? '#0a7d32' : '#9a6b00') + '">'
              + (nw ? 'New \u2014 will be created in Fergus'
                    : 'Matched an existing Fergus record \u2014 check this is the right one')
              + '</div></div>';
          };
          const wrap = document.createElement('div');
          wrap.style.cssText = 'position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.45);'
            + 'display:flex;align-items:center;justify-content:center;padding:20px';
          wrap.innerHTML = '<div style="background:#fff;border-radius:10px;max-width:460px;width:100%;padding:22px">'
            + '<h3 style="font:700 17px Arial,sans-serif;color:#2b2d7e;margin:0 0 4px">Check the Fergus match</h3>'
            + '<p style="font:400 13px/1.5 Arial,sans-serif;color:#666;margin:0 0 18px">This customer or address '
            + 'has not gone to Fergus before. Confirm it is right and you will not be asked again for them.</p>'
            + block('CUSTOMER', pv.customer, false)
            + block('SITE', pv.site, true)
            + '<div style="display:flex;gap:10px;justify-content:flex-end;padding-top:4px">'
            + '<button id="fx-no" style="font:600 13px Arial,sans-serif;background:#eee;color:#333;border:0;'
            + 'border-radius:5px;padding:9px 16px;cursor:pointer">Not now</button>'
            + '<button id="fx-yes" style="font:600 13px Arial,sans-serif;background:#2b2d7e;color:#fff;border:0;'
            + 'border-radius:5px;padding:9px 16px;cursor:pointer">Send to Fergus</button></div></div>';
          document.body.appendChild(wrap);
          const done = (v) => { wrap.remove(); resolve(v); };
          wrap.querySelector('#fx-no').addEventListener('click', () => done(false));
          wrap.querySelector('#fx-yes').addEventListener('click', () => done(true));
        });
      },

      // Preview, get approval if the match is new, then push.
      async runWithApproval(jobId) {
        const pv = await fergusPush.preview(jobId);
        if (pv && pv.needs_confirmation) {
          const ok = await fergusPush.askApproval(pv);
          if (!ok) return { skipped: true };
        }
        return await fergusPush.run(jobId);
      },

      async run(jobId, { force = false } = {}) {
        // The function cold-starts. A preflight that lands on a container mid
        // shutdown returns 503, which the browser reports only as an untyped
        // "Failed to fetch", so retry a genuine network failure once.
        try {
          return await fergusPush.attempt(jobId, force);
        } catch (err) {
          if (err.name !== 'TypeError') throw err;
          await new Promise((r) => setTimeout(r, 2000));
          return await fergusPush.attempt(jobId, force);
        }
      },

      async attempt(jobId, force, preview) {
        const { data: { session: s } } = await sb.auth.getSession();
        // Fergus can take a few seconds; never leave the button spinning forever.
        const ctl = new AbortController();
        const timer = setTimeout(() => ctl.abort(), 25000);
        try {
          const res = await fetch(`${SUPABASE_URL}/functions/v1/push-to-fergus`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${s.access_token}`, 'apikey': SUPABASE_ANON_KEY },
            body: JSON.stringify({ job_id: jobId, force, preview: !!preview }),
            signal: ctl.signal,
          });
          const out = await res.json().catch(() => ({}));
          if (!res.ok || !out.ok) throw new Error(fergusPush.explain(out, res.status));
          return out;
        } catch (err) {
          if (err.name === 'AbortError') throw new Error('Fergus did not respond in time');
          throw err;
        } finally {
          clearTimeout(timer);
        }
      },

      // Plain English for the failures a person can actually act on.
      explain(out, status) {
        if (out.code === 'no_token') return 'Fergus is not connected yet — the API token is missing';
        if (out.code === 'job_not_found') return 'this job was not found';
        if (out.code === 'ambiguous_customer') {
          const names = (out.candidates || []).map((c) => `${c.name} (${c.id})`).join(', ');
          return `more than one Fergus customer matches${names ? ' — ' + names : ''}. Merge them in Fergus, or raise this job by hand`;
        }
        if (out.code === 'writeback_failed') return out.error;
        if (status === 401) return 'Fergus rejected the API token';
        return out.error || `Fergus push failed (${status})`;
      },
    };

    /* ============================================================
       FOLLOW-UP EMAIL
       Chases an open quote up the three-rung ladder in FOLLOWUP_STAGES.
       Reuses send-quote-email (PDF optional) exactly as the review email
       does — no Edge Function change. That function already appends every
       send to data.quote.email_log, so email history keeps working; this
       adds data.follow_ups, which carries the rung and who sent it.
       ============================================================ */
    const FOLLOWUP_DEFAULTS = {
      'followup-1-body': `Just checking the quote for {ref} reached you — they do occasionally land in junk mail.

There's no rush at all. If you'd like to go ahead, or you'd like me to walk you through anything in it, just reply to this email or give us a call.`,

      'followup-2-body': `I wanted to check in on the quote for {ref}.

If the scope or the timing isn't quite right, we can usually work with it — staging the job over two visits, or doing the main living areas first, is a common way to spread the cost.

Happy to revise it however suits. Just reply and let me know what you're thinking.`,

      'followup-3-body': `I haven't heard back on the quote for {ref}, so I'll close it off at our end and stop chasing you.

Nothing is lost by that — if you'd like to pick it up later, just reply to this email and we'll reopen it. The measurements and details all stay on record, though the pricing may need a quick review if it's been a while.

Thanks for considering us.`,

      // Subjects live in the same map so Admin resolves body and subject
      // defaults through one lookup.
      'followup-1-subject': 'Quote {ref} — did it reach you?',
      'followup-2-subject': 'Checking in on quote {ref}',
      'followup-3-subject': 'Closing off quote {ref}',
    };

    const followUpEmail = {
      open(job, onSent) {
        const companyName = session.company?.name || 'Dr Drapes Curtain Clinic';
        const cc = session.company?.contact_email || '';
        const sentAt = quoteSentAt(job);
        const age = daysSince(sentAt);
        const alreadySent = followUpsSent(job);
        const due = followUpDue(job);
        // Open on the rung that's actually due; otherwise the next one up.
        const state = {
          stage: (due || followUpStage(Math.min(alreadySent + 1, 3))).n,
          subjectTouched: false, bodyTouched: false,
        };

        const fill = (n) => {
          const st = followUpStage(n);
          const vars = {
            company: companyName,
            name: firstName(job.customer_name || ''),
            ref: job.quote_number || '',
            total: job.data?.quote?.total != null ? money(Number(job.data.quote.total)) : '',
            days: age == null ? '' : String(age),
          };
          const sub = (tpl) => String(tpl || '').replace(/\{(company|name|ref|total|days)\}/g, (_, k) => vars[k]);
          const tpl = session.settings[st.tplKey] || FOLLOWUP_DEFAULTS[st.tplKey];
          const subjTpl = session.settings[st.subjKey] || FOLLOWUP_DEFAULTS[st.subjKey];
          const greeting = job.customer_name ? `Hi ${firstName(job.customer_name)},` : 'Hi,';
          const outro = (session.settings['email-outro'] || '').trim();
          return {
            subject: sub(subjTpl),
            body: `${greeting}\n\n${sub(tpl)}${outro ? '\n\n' + outro : ''}`.trim(),
          };
        };

        const chips = FOLLOWUP_STAGES.map((st) => {
          const done = alreadySent >= st.n ? ' ✓' : '';
          return `<span class="acc-chip ${state.stage === st.n ? 'active' : ''}" data-fustage="${st.n}">${st.label}${done}</span>`;
        }).join('');

        const first = fill(state.stage);
        const history = followUpsOf(job);
        const lastLine = history.length
          ? (() => {
            const l = history[history.length - 1];
            return `${history.length} follow-up${history.length === 1 ? '' : 's'} sent · last was ${followUpStage(l.stage).label}, ${new Date(l.sent_at).toLocaleDateString('en-AU', { day: 'numeric', month: 'short' })}`;
          })()
          : 'No follow-ups sent yet.';

        const mount = $('#modal-mount');
        mount.innerHTML = `
          <div class="modal-backdrop" id="fu-backdrop">
            <div class="modal compose">
              <div class="m-head"><h2>Follow Up on Quote</h2><p>${escapeHtml(job.quote_number || '')}${age == null ? '' : ` — quote emailed ${age} day${age === 1 ? '' : 's'} ago`}. ${escapeHtml(lastLine)}</p></div>
              <div class="m-body">
                <div class="modal-error hidden" id="fu-error"></div>
                <div><span style="font-size:12px;font-weight:700;color:var(--muted)">STAGE</span></div>
                <div class="acc-chips">${chips}</div>
                <div class="field"><label>To</label><input id="fu-to" value="${escapeAttr(job.customer_email || '')}" placeholder="customer@email.com" /></div>
                <div class="field"><label>CC (always included)</label>
                  <div class="cc-locked"><span class="lock">🔒</span> ${escapeHtml(cc || 'No company CC set')}</div>
                </div>
                <div class="field"><label>Subject</label><input id="fu-subject" value="${escapeAttr(first.subject)}" /></div>
                <div class="field"><label>Message</label><textarea id="fu-body" rows="10">${escapeHtml(first.body)}</textarea></div>
                <label class="acc-terms"><input type="checkbox" id="fu-attach" ${state.stage === 1 ? 'checked' : ''}/> Attach the quote PDF again</label>
                <p class="section-hint" id="fu-hint"></p>
              </div>
              <div class="m-foot">
                <button class="btn btn-secondary" id="fu-cancel">Cancel</button>
                <button class="btn btn-email" id="fu-send" style="width:auto">Send Follow-up</button>
              </div>
            </div>
          </div>`;

        const close = () => { mount.innerHTML = ''; };
        const hint = () => {
          const el = $('#fu-hint');
          el.textContent = state.stage === 3
            ? 'This is the last email. After it, the quote sits until you mark it lost from the job page or the dashboard — nothing happens automatically.'
            : '';
        };
        hint();

        $('#fu-cancel').addEventListener('click', close);
        $('#fu-backdrop').addEventListener('click', (e) => { if (e.target.id === 'fu-backdrop') close(); });
        $('#fu-subject').addEventListener('input', () => { state.subjectTouched = true; });
        $('#fu-body').addEventListener('input', () => { state.bodyTouched = true; });

        // Switching rung rewrites the wording — but never over an edit already
        // made, or the operator loses what they just typed.
        document.querySelectorAll('[data-fustage]').forEach((c) =>
          c.addEventListener('click', () => {
            state.stage = Number(c.dataset.fustage);
            document.querySelectorAll('[data-fustage]').forEach((x) =>
              x.classList.toggle('active', Number(x.dataset.fustage) === state.stage));
            const f = fill(state.stage);
            if (!state.subjectTouched) $('#fu-subject').value = f.subject;
            if (!state.bodyTouched) $('#fu-body').value = f.body;
            $('#fu-attach').checked = state.stage === 1;
            hint();
          }));

        $('#fu-send').addEventListener('click', async () => {
          const to = $('#fu-to').value.trim();
          const errEl = $('#fu-error'); errEl.classList.add('hidden');
          if (!to || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(to)) {
            errEl.textContent = 'Enter a valid customer email address.';
            errEl.classList.remove('hidden'); return;
          }
          const btn = $('#fu-send'); btn.disabled = true; btn.textContent = 'Sending…';
          const subject = $('#fu-subject').value;
          try {
            const body_html = '<div style="font-family:Arial,sans-serif;font-size:14px;color:#222;white-space:pre-wrap">'
              + escapeHtml($('#fu-body').value) + '</div>';
            const payload = { job_id: job.id, to, subject, body_html };
            if ($('#fu-attach').checked) {
              payload.pdf_base64 = quotePdf.base64(job);
              payload.pdf_filename = `${job.quote_number || 'Quote'}.pdf`;
            }
            const { data: { session: s } } = await sb.auth.getSession();
            const res = await fetch(`${SUPABASE_URL}/functions/v1/send-quote-email`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${s.access_token}`, 'apikey': SUPABASE_ANON_KEY },
              body: JSON.stringify(payload),
            });
            const out = await res.json().catch(() => ({}));
            if (!res.ok || out.error) throw new Error(out.detail || out.error || `Send failed (${res.status})`);
            // Record the rung. Re-read first: the Edge Function has just
            // rewritten data server-side to append the email log entry.
            // Reuse the timestamp it returned, so Activity can pair the two
            // records and show one line per send rather than two.
            try {
              const fresh = await db.getJob(job.id);
              const log = (fresh.data?.follow_ups || []).concat([{
                stage: state.stage, sent_at: out.sent_at || new Date().toISOString(),
                to, sent_by: session.profile.name, subject,
              }]);
              await db.saveJob(job.id, { follow_ups: log });
            } catch (_) { /* logging only — never block the send */ }
            close();
            ui.toast(`${followUpStage(state.stage).label} sent to ${to}`);
            if (onSent) await onSent();
          } catch (err) {
            errEl.textContent = sendErrorMessage(err.message || 'Send failed');
            errEl.classList.remove('hidden');
            btn.disabled = false; btn.textContent = 'Send Follow-up';
          }
        });
      },
    };

            box.className = 'modal-match mm-warn';
            box.innerHTML = `<b>Two different customers match.</b> The phone belongs to

          const last = hist[0];

                ? ` <span style="opacity:.75">(${escapeHtml(hit.customer_type)})</span>` : ''}

        } catch (err) {
          console.error('Customer lookup failed:', err);

          box.innerHTML = `Could not check for an existing customer. The job will still save, but it may not link to their history.

        if (!$('#nj-phone').value.trim() && !$('#nj-email').value.trim()) {

          errEl.textContent = 'Street address and suburb are both needed. They are what put the job at the right property in Fergus.';
          errEl.classList.remove('hidden'); return;
        }
        errEl.classList.add('hidden');
        const btn = $('#nj-create');
        btn.disabled = true; btn.textContent = 'Creating…';
        try {
          const job = await db.createJob({
            customer_name: name,
            customer_phone: $('#nj-phone').value.trim(),
            customer_email: $('#nj-email').value.trim(),
            customer_id: matchedId,
            address: njAddr,
            job_type: $('#nj-type').value,
            insurer_name: $('#nj-insurer').value.trim(),
            claim_number: $('#nj-claim').value.trim(),
