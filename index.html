          ui.toast(`${job.quote_number} created`);
          router.go('job', { jobId: job.id });
        } catch (err) {
          errEl.textContent = err.message || 'Could not create job.';
          errEl.classList.remove('hidden');
          btn.disabled = false; btn.textContent = 'Create Job';
        }
      });
    }

    /* ============================================================
       PRICING MODEL
       Reads rates LIVE from session.settings (the settings table),
       so price changes apply to new quotes automatically.

       Categories:
         curtain  — per metre of track WIDTH, tier auto-selected by DROP
         sheer    — per metre of WIDTH, 2 tiers by drop
         velvet   — per metre of WIDTH, 3 tiers by drop
         blind    — per m² (width × drop)
         flatw    — pelmet/swags/valance: flat rate × WIDTH (m)
         repair   — qty × rate
       Mould add-on: curtains/flatw per metre width; blinds per m².
       ============================================================ */
    const rate = (key) => Number(session.settings[key] || 0);

    // Parse a measurement input: <100 = metres, >=100 = millimetres → metres.
    function toMetres(raw) {
      const n = parseFloat(raw);
      if (!isFinite(n) || n <= 0) return 0;
      return n >= 100 ? n / 1000 : n;
    }

    // Curtain/velvet 3-tier and sheer 2-tier selection by drop (metres).
    function curtainTier(dropM) {
      if (dropM > 3.8) return { key: 'curtain-l', label: '> 3.8m drop' };
      if (dropM > 2.4) return { key: 'curtain-m', label: '> 2.4m drop' };
      return { key: 'curtain-s', label: '≤ 2.4m drop' };
    }
    function velvetTier(dropM) {
      if (dropM > 3.8) return { key: 'velvet-l', label: '> 3.8m drop' };
      if (dropM > 2.4) return { key: 'velvet-m', label: '> 2.4m drop' };
      return { key: 'velvet-s', label: '≤ 2.4m drop' };
    }
    function sheerTier(dropM) {
      if (dropM > 3.0) return { key: 'sheer-l', label: '> 3m drop' };
      return { key: 'sheer-s', label: '≤ 3m drop' };
    }

    // The selectable catalogue for the line-item picker.
    const CATALOG = {
      curtain: { label: 'Standard Curtain / Drape', mode: 'curtain' },
      sheer:   { label: 'Sheer Curtain',            mode: 'sheer' },
      velvet:  { label: 'Velvet / Silk / Linen / Satin', mode: 'velvet' },
      'roman':        { label: 'Roman Blind',           mode: 'blind', key: 'roman' },
      'austrian':     { label: 'Austrian Blind',        mode: 'blind', key: 'austrian' },
      'roller-sun':   { label: 'Roller Blind — Sunscreen', mode: 'blind', key: 'roller-sun' },
      'roller-block': { label: 'Roller Blind — Blockout',  mode: 'blind', key: 'roller-block' },
      'venetian':     { label: 'Venetian Blind',        mode: 'blind', key: 'venetian' },
      'pelmet':  { label: 'Pelmet',          mode: 'flatw', key: 'pelmet' },
      'swags':   { label: 'Swags & Tails',   mode: 'flatw', key: 'swags' },
      'valance': { label: 'Valance on Hooks', mode: 'flatw', key: 'valance' },
      'custom':  { label: 'Custom item',     mode: 'custom' },
    };

    const REPAIRS = [
      ['cord-replace', 'Cord Replace'], ['cord-tidy', 'Cord Tidy'],
      ['hook-replace', 'Hook Replace'], ['ring-replace', 'Ring Replace'],
      ['weight-replace', 'Weight Replace'], ['track-repair', 'Track Repair'],
      ['track-replace', 'Track Replace'], ['motor-service', 'Motor Service'],
      ['motor-replace', 'Motor Replace'], ['lining-repair', 'Lining Repair'],
      ['heading-repair', 'Heading Repair'], ['seam-repair', 'Seam Repair'],
      ['bracket-replace', 'Bracket Replace'], ['wand-replace', 'Wand Replace'],
      ['fascia-repair', 'Fascia Repair'],
    ];

    // Compute one line's amount + derived fields from its inputs.
    // line: { cat, width, drop, qty, mould }  (raw input strings)
    // 'custom' lines carry { cat:'custom', label, amount } — flat, no calc.
    function computeLine(line) {
      if (line.cat === 'custom') {
        return { amount: round2(line.amount), basis: 'Custom', custom: true };
      }
      const cat = CATALOG[line.cat];
      if (!cat) return { amount: 0 };
      const widthM = toMetres(line.width);
      const dropM = toMetres(line.drop);
      let base = 0, stdRate = 0, basis = '', tierLabel = '', sqm = 0, mouldAmt = 0;
      const hasOverride = line.rate_override !== undefined && line.rate_override !== '' && line.rate_override !== null;

      if (cat.mode === 'curtain' || cat.mode === 'sheer' || cat.mode === 'velvet') {
        const tier = cat.mode === 'curtain' ? curtainTier(dropM)
                   : cat.mode === 'velvet' ? velvetTier(dropM)
                   : sheerTier(dropM);
        stdRate = rate(tier.key);
        tierLabel = tier.label;
        const r = hasOverride ? Number(line.rate_override) : stdRate;
        base = r * widthM;
        basis = `${widthM.toFixed(2)}m width × $${r}/m`;
        if (line.mould) mouldAmt = rate('mould') * widthM;
        return finishLine(base, mouldAmt, r, stdRate, hasOverride, basis, tierLabel, widthM, dropM, sqm);
      } else if (cat.mode === 'blind') {
        stdRate = rate(cat.key);
        sqm = widthM * dropM;
        const r = hasOverride ? Number(line.rate_override) : stdRate;
        base = r * sqm;
        basis = `${sqm.toFixed(2)}m² × $${r}/m²`;
        if (line.mould) mouldAmt = rate('mould-blind') * sqm;
        return finishLine(base, mouldAmt, r, stdRate, hasOverride, basis, tierLabel, widthM, dropM, sqm);
      } else if (cat.mode === 'flatw') {
        stdRate = rate(cat.key);
        const r = hasOverride ? Number(line.rate_override) : stdRate;
        base = r * widthM;
        basis = `${widthM.toFixed(2)}m width × $${r}/m`;
        if (line.mould) mouldAmt = rate('mould') * widthM;
        return finishLine(base, mouldAmt, r, stdRate, hasOverride, basis, tierLabel, widthM, dropM, sqm);
      }
      return { amount: 0 };
    }

    function finishLine(base, mouldAmt, rateUsed, stdRate, isOverride, basis, tierLabel, widthM, dropM, sqm) {
      return {
        amount: round2(base + mouldAmt), rateUsed, stdRate, isOverride, basis, tierLabel,
        widthM, dropM, sqm: round2(sqm), mouldAmt: round2(mouldAmt), baseAmt: round2(base),
      };
    }

    function computeRepair(r) {
      const qty = Math.max(0, parseInt(r.qty, 10) || 0);
      const stdRate = rate(r.key);
      const hasOverride = r.rate_override !== undefined && r.rate_override !== '' && r.rate_override !== null;
      const rateUsed = hasOverride ? Number(r.rate_override) : stdRate;
      return { amount: round2(qty * rateUsed), qty, rateUsed, stdRate, isOverride: hasOverride };
    }

    function round2(n) { return Math.round((Number(n) || 0) * 100) / 100; }
    function money(n) { return '$' + Number(n || 0).toLocaleString('en-AU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

    // Derive dashboard stats from the jobs list.
    function computeDashStats(jobs) {
      const now = new Date();
      const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
      const weekStart = new Date(now); weekStart.setDate(now.getDate() - now.getDay()); weekStart.setHours(0, 0, 0, 0);
      const total = (j) => Number(j.data?.quote?.total || 0);
      const createdAt = (j) => new Date(j.created_at || j.updated_at || 0);
      // confirmed/invoiced "when" — use status_history if available, else created_at
      const statusChangedAt = (j, st) => {
        const h = (j.data?.status_history || []).filter((x) => x.status === st);
        return h.length ? new Date(h[h.length - 1].changed_at) : createdAt(j);
      };
      // strict version: null when the step was never recorded, so a job can
      // never be dated to the wrong period by falling back to its quote date.
      const statusEventAt = (j, st) => {
        const h = (j.data?.status_history || []).filter((x) => x.status === st);
        return h.length ? new Date(h[h.length - 1].changed_at) : null;
      };

      const byStatus = {};
      let pipelineVal = 0, pipelineCount = 0;
      let confirmedTotalVal = 0, confirmedTotalCount = 0; // for avg job size (all confirmed+)
      let wonCount = 0, declinedCount = 0, pendingCount = 0;
      let toChase = 0, toSchedule = 0, lastChance = 0, quotesUnsent = 0;
      const chase = [];   // open quotes needing a person to do something
      let declinedMonthVal = 0, declinedMonthCount = 0;
      const m = { quotedVal: 0, quotedCount: 0, confirmedVal: 0, confirmedCount: 0, invoicedVal: 0, invoicedCount: 0, newJobs: 0 };
      const w = { invoicedVal: 0, invoicedCount: 0, newJobs: 0 };
      const order = STATUSES;

      jobs.forEach((j) => {
        byStatus[j.status] = (byStatus[j.status] || 0) + 1;
        const t = total(j);
        const ca = createdAt(j);
        const declined = j.status === 'declined';
        const sIdx = order.indexOf(j.status); // -1 for declined

        // open pipeline = still in quoted (not declined)
        if (j.status === 'quoted') { pipelineVal += t; pipelineCount++; }

        // avg job size: jobs confirmed or beyond
        if (sIdx >= order.indexOf('confirmed')) { confirmedTotalVal += t; confirmedTotalCount++; }

        // win rate buckets (Option B): won = confirmed+, lost = declined, pending = quoted
        if (sIdx >= order.indexOf('confirmed')) wonCount++;
        else if (declined) declinedCount++;
        else if (j.status === 'quoted') pendingCount++;

        // this-month buckets
        if (ca >= monthStart) m.newJobs++;
        if (ca >= weekStart) w.newJobs++;
        if (ca >= monthStart && !declined) { m.quotedVal += t; m.quotedCount++; }
        // Confirmed / invoiced are dated to the status change itself, matching
        // the Reports "Money in this period" band. A job quoted months ago but
        // invoiced today is today's money.
        const cAt = statusEventAt(j, 'confirmed');
        if (cAt && cAt >= monthStart) { m.confirmedVal += t; m.confirmedCount++; }
        const iAt = statusEventAt(j, 'invoiced');
        if (iAt) {
          if (iAt >= monthStart) { m.invoicedVal += t; m.invoicedCount++; }
          if (iAt >= weekStart) { w.invoicedVal += t; w.invoicedCount++; }
        }
        if (declined) {
          const dAt = j.data?.declined?.at ? new Date(j.data.declined.at) : ca;
          if (dAt >= monthStart) { declinedMonthVal += t; declinedMonthCount++; }
        }

        // needs attention (not declined)
        // The chase clock runs from when the quote was emailed, not from when
        // the job was raised. A quote never sent is a different problem, and
        // is surfaced as such rather than being silently dropped.
        if (j.status === 'quoted') {
          const row = {
            id: j.id, quote_number: j.quote_number, customer_name: j.customer_name, total: t,
          };
          const sentAt = quoteSentAt(j);
          if (!sentAt) {
            quotesUnsent++;
            const ageC = Math.floor((now - ca) / 86400000);
            if (ageC >= 2) chase.push({ ...row, age: ageC, sent: 0, due: null, lost: false, unsent: true });
          } else {
            const due = followUpDue(j);
            const lost = lostDue(j);
            if (due || lost) {
              toChase++;
              if (lost || due?.n === 3) lastChance++;
              chase.push({
                ...row, age: Math.floor((now - sentAt) / 86400000),
                sent: followUpsSent(j), due, lost, unsent: false,
              });
            }
          }
        }
        if (j.status === 'confirmed' && !(j.data?.pre_inspection?.saved_at)) toSchedule++;
      });

      // Option B win rate: won ÷ (won + declined)
      const decided = wonCount + declinedCount;
      const winRate = decided > 0 ? Math.round(wonCount / decided * 100) : 0;
      const avgJobSize = confirmedTotalCount > 0 ? round2(confirmedTotalVal / confirmedTotalCount) : 0;

      return {
        byStatus, month: m, week: w,
        pipelineVal: round2(pipelineVal), pipelineCount,
        winRate, wonCount, declinedCount, pendingCount,
        avgJobSize, toChase, toSchedule, lastChance, quotesUnsent,
        // Oldest first — the quote that has been waiting longest is the one
        // most likely to be lost, and the one the panel should lead with.
        chase: chase.sort((a1, b1) => b1.age - a1.age),
        declinedMonthVal: round2(declinedMonthVal), declinedMonthCount,
      };
    }

    /* ---------- REPORTS: pure aggregation ----------
       Two separate lenses, because they answer two different questions:

       1. COHORT  — quotes RAISED in [from,to], dated by created_at.
          Answers "how much did we quote, and how much of it did we win?"
          Win rate, average quote, staff conversion and decline reasons all
          belong here: they only make sense against the quotes that were
          actually raised in the period.

       2. ACTIVITY — what HAPPENED in [from,to], dated by the status change
          itself. A job quoted in June and invoiced in August is August money.
          Answers "how much did we confirm and invoice this period?"
    */
    function computeReport(jobs, from, to, includeArchived) {
      const order = STATUSES;
      const confIdx = order.indexOf('confirmed');
      const total = (j) => Number(j.data?.quote?.total || 0);
      const createdAt = (j) => new Date(j.created_at || j.updated_at || 0);
      const creator = (j) => j.data?.created_by || (j.data?.status_history || [])[0]?.changed_by || '—';
      const statusAt = (j, st) => {
        const h = (j.data?.status_history || []).filter((x) => x.status === st);
        return h.length ? new Date(h[h.length - 1].changed_at) : null;
      };
      const inRange = (d) => !!d && d >= from && d <= to;

      const pool = jobs.filter((j) => includeArchived || !j.archived);
      const cohort = pool.filter((j) => { const c = createdAt(j); return c >= from && c <= to; });

      // ----- LENS 2: activity in period (event-dated, whole pool) -----
      let actConfirmedVal = 0, actConfirmedCount = 0;
      let actInvoicedVal = 0, actInvoicedCount = 0;
      let actDeclinedVal = 0, actDeclinedCount = 0;
      let noInvoiceEvent = 0; // data-integrity check
      pool.forEach((j) => {
        const t = total(j);
        const sIdx = order.indexOf(j.status);
        if (inRange(statusAt(j, 'confirmed'))) { actConfirmedVal += t; actConfirmedCount++; }
        const iv = statusAt(j, 'invoiced');
        if (inRange(iv)) { actInvoicedVal += t; actInvoicedCount++; }
        // sitting at Invoiced or beyond but no Invoiced event ever recorded
        if (!iv && sIdx >= order.indexOf('invoiced')) noInvoiceEvent++;
        if (j.status === 'declined') {
          const dAt = j.data?.declined?.at ? new Date(j.data.declined.at) : null;
          if (inRange(dAt)) { actDeclinedVal += t; actDeclinedCount++; }
        }
      });

      // ----- LENS 1: quotes raised in period -----
      let quotedVal = 0, quotedCount = 0, confirmedVal = 0, confirmedCount = 0;
      let invoicedVal = 0, invoicedCount = 0, declinedVal = 0, declinedCount = 0;
      let wonCount = 0, pendingCount = 0;
      const staff = {}, cust = {}, reasons = {}, byStatus = {}, rows = [];

      cohort.forEach((j) => {
        const t = total(j);
        const st = j.status;
        const sIdx = order.indexOf(st);
        const won = sIdx >= confIdx;
        const declined = st === 'declined';

        quotedVal += t; quotedCount++;
        byStatus[st] = (byStatus[st] || 0) + 1;
        if (won) { confirmedVal += t; confirmedCount++; wonCount++; }
        if (sIdx >= order.indexOf('invoiced')) { invoicedVal += t; invoicedCount++; }
        if (declined) { declinedVal += t; declinedCount++; }
        if (st === 'quoted') pendingCount++;

        const who = creator(j);
        const S = staff[who] || (staff[who] = { count: 0, quotedVal: 0, wonCount: 0, declinedCount: 0, confirmedVal: 0 });
        S.count++; S.quotedVal += t;
        if (won) { S.wonCount++; S.confirmedVal += t; }
        if (declined) S.declinedCount++;

        const cn = (j.customer_name || 'No name').trim();
        cust[cn] = (cust[cn] || 0) + t;

        if (declined) {
          const r = j.data?.declined?.reason || 'other';
          const R = reasons[r] || (reasons[r] = { count: 0, val: 0 });
          R.count++; R.val += t;
        }

        const cf = statusAt(j, 'confirmed'), iv = statusAt(j, 'invoiced');
        rows.push({
          quote_number: j.quote_number || '', drd_number: j.drd_number || '',
          po_number: j.data?.po_number || '', customer_name: j.customer_name || '',
          status: st, total: t, created_at: createdAt(j).toISOString(),
          confirmed_at: cf ? cf.toISOString() : '', invoiced_at: iv ? iv.toISOString() : '',
          declined_reason: declined ? (j.data?.declined?.reason || 'other') : '',
          created_by: who, archived: j.archived ? 'yes' : 'no',
        });
      });

      const decided = wonCount + declinedCount;
      const winRate = decided > 0 ? Math.round(wonCount / decided * 100) : 0;
      const avgQuote = quotedCount > 0 ? round2(quotedVal / quotedCount) : 0;
      const topCustomers = Object.entries(cust).sort((a, b) => b[1] - a[1]).slice(0, 10);
      const staffRows = Object.entries(staff).sort((a, b) => b[1].quotedVal - a[1].quotedVal);
      const reasonRows = Object.entries(reasons).sort((a, b) => b[1].val - a[1].val);

      return {
        cohortCount: cohort.length,
        quotedVal: round2(quotedVal), quotedCount,
        confirmedVal: round2(confirmedVal), confirmedCount,
        invoicedVal: round2(invoicedVal), invoicedCount,
        declinedVal: round2(declinedVal), declinedCount,
        wonCount, pendingCount, winRate, avgQuote,
        byStatus, topCustomers, staffRows, reasonRows, rows,
        // activity lens — dated to when the status change actually happened
        act: {
          confirmedVal: round2(actConfirmedVal), confirmedCount: actConfirmedCount,
          invoicedVal: round2(actInvoicedVal), invoicedCount: actInvoicedCount,
          declinedVal: round2(actDeclinedVal), declinedCount: actDeclinedCount,
          noInvoiceEvent,
        },
      };
    }

    // Trailing-N-month trend (independent of the summary date range).
    function computeReportTrend(jobs, includeArchived, months = 12) {
      const total = (j) => Number(j.data?.quote?.total || 0);
      const createdAt = (j) => new Date(j.created_at || j.updated_at || 0);
      const statusAt = (j, st) => {
        const h = (j.data?.status_history || []).filter((x) => x.status === st);
        return h.length ? new Date(h[h.length - 1].changed_at) : null;
      };
      const pool = jobs.filter((j) => includeArchived || !j.archived);
      const now = new Date();
      const buckets = [];
      for (let i = months - 1; i >= 0; i--) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        buckets.push({ key: d.getFullYear() + '-' + d.getMonth(), label: d.toLocaleDateString('en-AU', { month: 'short', year: '2-digit' }), quoted: 0, confirmed: 0, invoiced: 0 });
      }
      const idxOf = (d) => buckets.findIndex((b) => b.key === d.getFullYear() + '-' + d.getMonth());
      pool.forEach((j) => {
        const t = total(j);
        const ci = idxOf(createdAt(j)); if (ci >= 0) buckets[ci].quoted += t;
        const cf = statusAt(j, 'confirmed'); if (cf) { const k = idxOf(cf); if (k >= 0) buckets[k].confirmed += t; }
        const iv = statusAt(j, 'invoiced'); if (iv) { const k = idxOf(iv); if (k >= 0) buckets[k].invoiced += t; }
      });
      return buckets;
    }

    // Roll up an entire quote object → subtotal/gst/total.
    // Room-based: rooms[].items + rooms[].repairs, plus whole-job repairs.
    function computeQuote(quote) {
      let sub = 0;
      (quote.rooms || []).forEach((room) => {
        (room.items || []).forEach((l) => { sub += computeLine(l).amount; });
        (room.repairs || []).forEach((r) => { sub += computeRepair(r).amount; });
      });
      (quote.repairs || []).forEach((r) => { sub += computeRepair(r).amount; }); // whole-job repairs
      const ex = quote.extras || {};
      ['fuel_amt', 'transport', 'rehang', 'callout', 'storage', 'other_amt'].forEach((k) => {
        if (k === 'fuel_amt' && !ex.fuel_on) return;
        sub += Number(ex[k]) || 0;
      });
      // discount
      let disc = 0;
      const d = quote.discount || { type: 'none', value: 0 };
      if (d.type === 'percent') disc = sub * (Number(d.value) || 0) / 100;
      else if (d.type === 'fixed') disc = Number(d.value) || 0;
      const subtotal = round2(sub - disc);
      const gst = round2(subtotal * 0.1);
      const total = round2(subtotal + gst);
      return { subtotal, gst, total, discountAmt: round2(disc), preDiscount: round2(sub) };
    }

    /* ---------- small pure helpers ---------- */
    function firstName(n) { return (n || '').trim().split(/\s+/)[0] || n || ''; }
    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function escapeAttr(s) { return escapeHtml(s ?? ''); }
    function debounce(fn, ms) {
      let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
    }

    // Deliberately module-level: the jobs list re-renders its own wiring, so a
    // debounce created inside that render would start a fresh timer each time
    // and never actually wait. 600ms is long enough to finish typing a name.
    // Jobs already loaded for the current view. Filtering is done in the browser,
    // so searching reuses these rather than refetching every job per keystroke.
    let jobsCache = null;
    const runJobSearch = debounce((mount) => router.jobsList(mount, { rowsOnly: true }), 350);
    function deepClone(o) { return JSON.parse(JSON.stringify(o ?? null)); }
    // Deep-merge source into a clone of target (objects merge, arrays/scalars replace).
    function deepMerge(target, source) {
      const out = Array.isArray(target) ? [...target] : { ...target };
      for (const k of Object.keys(source || {})) {
        const sv = source[k], tv = out[k];
        if (sv && typeof sv === 'object' && !Array.isArray(sv) && tv && typeof tv === 'object' && !Array.isArray(tv)) {
          out[k] = deepMerge(tv, sv);
        } else {
          out[k] = sv;
        }
      }
      return out;
    }

    /* ============================================================
       EVENT WIRING
       ============================================================ */
    $('#login-btn').addEventListener('click', doLogin);
    $('#forgot-link').addEventListener('click', doForgot);
    /* Clicking the reset link while the app is already open in that tab only
       changes the hash. No reload, so boot() never sees the token. */
    window.addEventListener('hashchange', () => {
      const token = readResetToken();
      if (token) enterReset(token);
    });
    $('#reset-btn').addEventListener('click', doReset);
    $('#new-password').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#new-password-2').focus(); });
    $('#new-password-2').addEventListener('keydown', (e) => { if (e.key === 'Enter') doReset(); });
    $('#reset-cancel').addEventListener('click', async () => {
      await sb.auth.signOut();
      $('#new-password').value = ''; $('#new-password-2').value = '';
      ui.resetError(null);
      ui.showLogin();
    });
    $('#password').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
    $('#email').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#password').focus(); });
    $('#logout-btn').addEventListener('click', async () => {
      await auth.logout();
      ui.showLogin();
    });

    // Nav bar routing
    document.querySelectorAll('#navbar a').forEach((a) =>
      a.addEventListener('click', () => router.go(a.dataset.route)));

    async function doLogin() {
      const email = $('#email').value.trim();
      const password = $('#password').value;
      ui.loginError(null);
      if (!email || !password) { ui.loginError('Enter your email and password.'); return; }

      const btn = $('#login-btn');
      btn.disabled = true; btn.textContent = 'Signing in…';
      try {
        await auth.login(email, password);
        $('#password').value = '';
        ui.showApp();
        router.go(isDriver() ? 'run' : 'dashboard');
        enqBadge.start();
      } catch (err) {
        const msg = /invalid login credentials/i.test(err.message || '')
          ? 'Incorrect email or password.'
          : (err.message || 'Sign in failed.');
        ui.loginError(msg);
      } finally {
        btn.disabled = false; btn.textContent = 'Sign in';
      }
    }

    /* Ask the send-password-reset function to email a recovery link. The
       function always answers ok, whether or not the address has an account,
       so nothing here can be used to find out who has a login. */
    async function doForgot() {
      const email = $('#email').value.trim();
      ui.loginError(null); ui.loginNote(null);
      if (!email) {
        ui.loginError('Enter your email address first, then click Forgot your password.');
        $('#email').focus();
        return;
      }
      const link = $('#forgot-link');
      link.textContent = 'Sending\u2026';
      try {
        const res = await fetch(`${SUPABASE_URL}/functions/v1/send-password-reset`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
          },
          body: JSON.stringify({ email }),
        });
        if (!res.ok) throw new Error('Request failed');
        ui.loginNote(`If ${email} has an account, a reset link is on its way. It works once and expires in an hour.`);
      } catch (_) {
        ui.loginError('Could not send the reset email. Check your connection and try again.');
      } finally {
        link.textContent = 'Forgot your password?';
      }
    }

    /* Redeem a reset token and show the new-password card. The hash goes
       first, so the token is never left in the address bar or in history, and
       whoever was signed in is signed out before the recovery session starts. */
    async function enterReset(token) {
      history.replaceState(null, '', location.pathname + location.search);
      try { await auth.logout(); } catch (_) { /* nobody was signed in */ }
      const { error } = await sb.auth.verifyOtp({ token_hash: decodeURIComponent(token), type: 'recovery' });
      if (!error) { ui.showReset(); return; }
      ui.showLogin();
      ui.loginError('That reset link has expired or was already used. Request a new one.');
    }

    /* Runs on the recovery session created by the emailed link. */
    async function doReset() {
      const pw = $('#new-password').value;
      const pw2 = $('#new-password-2').value;
      ui.resetError(null);
      if (pw.length < 8) { ui.resetError('Use at least 8 characters.'); return; }
      if (pw !== pw2) { ui.resetError('The two passwords do not match.'); return; }

      const btn = $('#reset-btn');
      btn.disabled = true; btn.textContent = 'Saving\u2026';
      try {
        const { error } = await sb.auth.updateUser({ password: pw });
        if (error) throw error;
        // Sign out so the next step is a normal sign in with the new password,
        // rather than carrying the one-time recovery session into the app.
        await sb.auth.signOut();
        $('#new-password').value = ''; $('#new-password-2').value = '';
        ui.showLogin();
        ui.loginNote('Password changed. Sign in with your new one.');
      } catch (err) {
        ui.resetError(err.message || 'Could not save the new password. Request a fresh link and try again.');
      } finally {
        btn.disabled = false; btn.textContent = 'Save new password';
      }
    }

    /* ============================================================
       ENQUIRY BADGE
       New enquiries arrive while nobody is looking at the Enquiries tab.
       Show how many are still untouched right on the tab, refreshed on a
       timer and whenever the tab is brought back to the front.
       ============================================================ */
    /* ============================================================
       RUN SHEET
       The day's stops, straight off the Fergus calendar. Built for a
       phone held in one hand at somebody's front door: the address and
       the phone number are the two things that have to be tappable, and
       the Fergus event title is shown word for word because that is
       where "call when 5 minutes away" and "code 000" actually live.
       ============================================================ */
    const runSheet = {
      day: null,
      driverId: null,      // Fergus user id, or null for everyone
      lastError: null,

      // The business runs on Melbourne time wherever the browser thinks it is.
      todayLocal() {
        const p = {};
        for (const part of new Intl.DateTimeFormat('en-CA', {
          timeZone: 'Australia/Melbourne', year: 'numeric', month: '2-digit', day: '2-digit',
        }).formatToParts(new Date())) if (part.type !== 'literal') p[part.type] = part.value;
        return `${p.year}-${p.month}-${p.day}`;
      },

      shiftDay(iso, days) {
        const d = new Date(`${iso}T12:00:00Z`);
        d.setUTCDate(d.getUTCDate() + days);
        return d.toISOString().slice(0, 10);
      },

      dayLabel(iso) {
        const today = runSheet.todayLocal();
        if (iso === today) return 'Today';
        if (iso === runSheet.shiftDay(today, 1)) return 'Tomorrow';
        if (iso === runSheet.shiftDay(today, -1)) return 'Yesterday';
        return new Date(`${iso}T12:00:00Z`).toLocaleDateString('en-AU',
          { weekday: 'short', day: 'numeric', month: 'short' });
      },

      timeOf(stop) {
        if (!stop.starts_at) return '—';
        return new Date(stop.starts_at).toLocaleTimeString('en-AU',
          { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Australia/Melbourne' });
      },

      addressOf(stop) {
        return [stop.address_line, stop.suburb, stop.state, stop.postcode]
          .filter(Boolean).join(' ').replace(/\s+/g, ' ').trim();
      },

      /* Cached so a black spot on the way to Flinders still shows the run. */
      cacheKey() { return `dqp-runsheet-${runSheet.day}-${runSheet.driverId || 'all'}`; },
      cacheWrite(rows) {
        try { localStorage.setItem(runSheet.cacheKey(), JSON.stringify({ at: Date.now(), rows })); } catch (_) {}
      },
      cacheRead() {
        try {
          const raw = localStorage.getItem(runSheet.cacheKey());
          return raw ? JSON.parse(raw) : null;
        } catch (_) { return null; }
      },

      async view(main) {
        if (!runSheet.day) runSheet.day = runSheet.todayLocal();
        // A driver only ever sees their own stops. The office sees everyone
        // unless they pick someone, because David is a linked user on nearly
        // every Fergus booking and his own filter would be the whole day.
        if (isDriver()) {
          // Without a Fergus id the filter would be empty and the driver
          // would get the whole company's day. Say so instead.
          if (!session.profile.fergus_user_id) {
            main.innerHTML = `
              <div class="rs-wrap"><div class="rs-empty">
                <h3>Your login isn't linked to Fergus yet</h3>
                <p>Ask the office to connect this account to your Fergus user
                   so your stops can be found.</p>
              </div></div>`;
            return;
          }
          runSheet.driverId = session.profile.fergus_user_id;
        }

        main.innerHTML = `<div class="rs-wrap"><div class="rs-loading">Loading the run…</div></div>`;

        let rows = [];
        let stale = null;
        try {
          rows = await db.listRunSheet(runSheet.day, runSheet.driverId);
          runSheet.cacheWrite(rows);
          runSheet.lastError = null;
        } catch (err) {
          const cached = runSheet.cacheRead();
          if (!cached) { runSheet.lastError = err.message || 'Could not load the run sheet.'; }
          else { rows = cached.rows; stale = cached.at; }
        }

        const people = isDriver() ? [] : await db.listFieldUsers().catch(() => []);
        main.innerHTML = runSheet.html(rows, people, stale);
        runSheet.wire(main);
      },

      html(rows, people, stale) {
        const nav = `
          <div class="rs-days">
            <button class="rs-day" data-shift="-1">‹</button>
            <div class="rs-daylabel">
              <strong>${escapeHtml(runSheet.dayLabel(runSheet.day))}</strong>
              <span>${escapeHtml(new Date(`${runSheet.day}T12:00:00Z`).toLocaleDateString('en-AU',
                { weekday: 'long', day: 'numeric', month: 'long' }))}</span>
            </div>
            <button class="rs-day" data-shift="1">›</button>
          </div>`;

        const picker = people.length ? `
          <select id="rs-driver" class="rs-select">
            <option value="">Everyone</option>
            ${people.map((p) => `<option value="${p.fergus_user_id}"${
              String(p.fergus_user_id) === String(runSheet.driverId) ? ' selected' : ''
            }>${escapeHtml(p.name)}</option>`).join('')}
          </select>` : '';

        const banner = runSheet.lastError
          ? `<div class="rs-banner rs-bad">${escapeHtml(runSheet.lastError)}</div>`
          : stale
            ? `<div class="rs-banner">Showing the last copy saved to this phone — no connection right now.</div>`
            : '';

        const body = rows.length
          ? rows.map(runSheet.card).join('')
          : `<div class="rs-empty"><h3>Nothing booked</h3><p>No stops on the Fergus calendar for ${
              escapeHtml(runSheet.dayLabel(runSheet.day).toLowerCase())}.</p></div>`;

        return `
          <div class="rs-wrap">
            <div class="rs-head">
              ${nav}
              <div class="rs-tools">
                ${picker}
                <button id="rs-refresh" class="rs-refresh">Refresh</button>
              </div>
            </div>
            ${banner}
            <div class="rs-count">${rows.length} ${rows.length === 1 ? 'stop' : 'stops'}</div>
            ${body}
          </div>`;
      },

      card(stop) {
        const addr = runSheet.addressOf(stop);
        const maps = addr
          ? `<a class="rs-addr" target="_blank" rel="noopener"
               href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addr)}">
               ${escapeHtml(addr)}</a>`
          : `<div class="rs-addr rs-muted">No address on the Fergus job</div>`;

        const phone = stop.contact_phone
          ? `<a class="rs-phone" href="tel:${escapeHtml((stop.contact_phone || '').replace(/\s+/g, ''))}">
               ${escapeHtml(stop.contact_phone)}</a>`
          : '';

        const label = { takedown: 'Pick up', rehang: 'Rehang', other: 'On site' }[stop.stop_type] || 'On site';

        const card = stop.job_card
          ? `<details class="rs-card-items"><summary>What's on the job</summary><pre>${
              escapeHtml(stop.job_card)}</pre></details>`
          : '';

        const link = stop.job_id
          ? `<button class="rs-open" data-job="${escapeHtml(stop.job_id)}">Open the job</button>`
          : `<div class="rs-muted rs-nolink">Not in Drapr — raised straight in Fergus</div>`;

        return `
          <article class="rs-stop rs-${escapeHtml(stop.stop_type)}">
            <div class="rs-top">
              <div class="rs-time">${escapeHtml(runSheet.timeOf(stop))}</div>
              <div class="rs-badge rs-b-${escapeHtml(stop.stop_type)}">${escapeHtml(label)}</div>
              ${stop.fergus_job_no ? `<div class="rs-jobno">${escapeHtml(stop.fergus_job_no)}</div>` : ''}
            </div>
            ${stop.customer_name ? `<h3 class="rs-cust">${escapeHtml(stop.customer_name)}</h3>` : ''}
            ${maps}
            ${phone}
            <div class="rs-note">${escapeHtml(stop.title || '')}</div>
            ${stop.description ? `<div class="rs-note rs-note2">${escapeHtml(stop.description)}</div>` : ''}
            ${card}
            ${link}
          </article>`;
      },

      wire(main) {
        main.querySelectorAll('.rs-day').forEach((b) =>
          b.addEventListener('click', () => {
            runSheet.day = runSheet.shiftDay(runSheet.day, Number(b.dataset.shift));
            runSheet.view(main);
          }));

        const sel = main.querySelector('#rs-driver');
        if (sel) sel.addEventListener('change', () => {
          runSheet.driverId = sel.value ? Number(sel.value) : null;
          runSheet.view(main);
        });

        main.querySelectorAll('.rs-open').forEach((b) =>
          b.addEventListener('click', () => router.go('job', { jobId: b.dataset.job })));

        const refresh = main.querySelector('#rs-refresh');
        if (refresh) refresh.addEventListener('click', async () => {
          refresh.disabled = true; refresh.textContent = 'Checking Fergus…';
          try {
            await db.refreshRunSheet();
            await runSheet.view(main);
            ui.toast('Run sheet up to date');
          } catch (err) {
            ui.toast(err.message || 'Could not reach Fergus');
            refresh.disabled = false; refresh.textContent = 'Refresh';
          }
        });
      },
    };

    const enqBadge = {
      timer: null,
      set(n) {
        const el = document.getElementById('nav-enq-badge');
        if (!el) return;
        el.textContent = n > 99 ? '99+' : n;
        el.classList.toggle('hidden', !n);
      },
      async refresh() {
        if (!session.profile) return;
        let n;
        try { n = await db.countNewEnquiries(); }
        catch (_) { return; }          // never let a failed count break the nav
        this.set(n);
      },
      start() {
        this.refresh();
        if (this.timer) clearInterval(this.timer);
        this.timer = setInterval(() => this.refresh(), 60 * 1000);
        document.addEventListener('visibilitychange', () => { if (!document.hidden) this.refresh(); });
      },
    };

    /* ============================================================
       VERSION WATCH
       The whole app is one file served from GitHub Pages, so a tab left
       open across a deploy keeps running the code it loaded. That is how
       an acceptance can look fine on screen and never reach Fergus.
       Watch the served file and offer a reload when it changes.
       ============================================================ */
    const versionWatch = {
      stamp: null,
      async read() {
        try {
          const res = await fetch(location.pathname + '?v=' + Date.now(), { method: 'HEAD', cache: 'no-store' });
          return res.headers.get('etag') || res.headers.get('last-modified');
        } catch (_) {
          return null;   // offline or blocked; never nag on a failed check
        }
      },
      async start() {
        this.stamp = await this.read();
        if (!this.stamp) return;
        const check = async () => {
          const now = await this.read();
          if (now && now !== this.stamp) this.show();
        };
        setInterval(check, 5 * 60 * 1000);
        document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
      },
      show() {
        if (document.getElementById('version-banner')) return;
        const b = document.createElement('div');
        b.id = 'version-banner';
        b.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#2b2d7e;color:#fff;'
          + "font:600 14px 'Montserrat',Arial,sans-serif;padding:12px 16px;display:flex;justify-content:center;"
          + 'gap:14px;align-items:center;flex-wrap:wrap';
        b.innerHTML = '<span>A newer version of Drapr is available. Reload before accepting any more quotes.</span>'
          + '<button id="version-reload" style="font:600 13px Montserrat,Arial,sans-serif;background:#fff;'
          + 'color:#2b2d7e;border:0;border-radius:4px;padding:6px 14px;cursor:pointer">Reload now</button>';
        document.body.appendChild(b);
        document.getElementById('version-reload').addEventListener('click', () => location.reload());
      },
    };

    /* ============================================================
       BOOT
       Resolve session BEFORE anything renders. Nothing shows until
       we know who the user is and which company they belong to.
       ============================================================ */
    (async function boot() {
      try {
        // Redeeming the token here rather than through /auth/v1/verify keeps
        // the flow off the dashboard's redirect allow list.
        if (RESET_TOKEN) {
          await enterReset(RESET_TOKEN);
          versionWatch.start();
          return;
        }

        const ok = await auth.resolveSession();
        if (ok) {
          ui.showApp();
          router.go(isDriver() ? 'run' : 'dashboard');
          enqBadge.start();
        }
        else { ui.showLogin(); }
        versionWatch.start();
      } catch (err) {
        console.error('Boot error:', err);
        ui.showLogin();
      }
    })();
  </script>
</body>
</html>
